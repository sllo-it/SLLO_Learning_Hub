  <title>Hungry Goats 🐐 | Impene Zishonje</title>
  <style>
    /* ============================================================
       RESET & BASE
    ============================================================ */
    *, *::before, *::after {
      margin: 0; padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    html, body { width: 100%; min-height: 100%; overflow-x: hidden; }

    body {

      flex-direction: column;

      padding: 12px 12px 32px;

    /* ============================================================
       BILINGUAL HELPER CLASSES
    ============================================================ */

    .fb-en {

    }
    .fb-rw {

    /* ============================================================

    /* ============================================================
       PROGRESS DOTS
    ============================================================ */
    .progress-row {

    .dot {

    }
    .dot.done {
      background: #ffd600;
      border-color: #f9a825;

    /* ============================================================
       SPEECH BUBBLE
    ============================================================ */
    .bubble-wrap {
      position: relative;
      max-width: 480px;

      flex-shrink: 0;

    .speech-bubble {

    /* Arrow pointing down toward goat */
    .speech-bubble::after {
      content: '';

      border-left: 13px solid transparent;
      border-right: 13px solid transparent;
      border-top: 24px solid #66bb6a;
    }
    .speech-bubble::before {
      content: '';
      position: absolute;
      bottom: -17px; left: 50%;

      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 17px solid #ffffff;
      z-index: 1;

    /* ============================================================
       GOAT + STAR POP
    ============================================================ */
    .goat-wrap {

    .goat {

    .goat.bounce {
      animation: goatBounce 0.56s cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards;
    }
    @keyframes goatBounce {
      0%   { transform: scale(1)    rotate(0deg)  translateY(0);    }
      20%  { transform: scale(1.26) rotate(-9deg) translateY(-13px);}
      40%  { transform: scale(1.32) rotate(8deg)  translateY(-16px);}

    .plate-section {

      52%     { transform: translateX(7px);  }

      91%     { transform: translateX(-2px); }

    /* ============================================================

<body>

  <!-- ── HEADER ───────────────────────────────────────── -->
  <header class="header">
    <div class="title">
      <span class="title-en">🐐 Hungry Goats</span>
      <span class="title-rw">Impene Zishonje</span>
    </div>
    <div class="score-box">
      <span class="score-en">⭐ <span id="scoreVal">0</span> pts</span>
      <span class="score-rw">Amanota</span>
    </div>
  </header>

  <!-- ── PROGRESS DOTS (10 rounds) ────────────────────── -->
  <div class="progress-row" id="dotsRow"></div>

  <!-- ── SPEECH BUBBLE ────────────────────────────────── -->
  <div class="bubble-wrap">
    <div class="speech-bubble">
      <div class="bubble-en">
        Give me <span class="num" id="targetNumEl">?</span> 🍌!
      </div>
      <div class="bubble-rw">
        Mpa <span class="num" id="targetNumRwEl">?</span> ibigitoki!
      </div>
    </div>
  </div>

  <!-- ── GOAT + STAR POP ──────────────────────────────── -->
  <div class="goat-wrap">
    <span class="goat" id="goatEl">🐐</span>
    <span class="star-pop" id="starPopEl">⭐</span>
  </div>

  <!-- ── PLATE ────────────────────────────────────────── -->
  <div class="plate-section">
    <div class="plate-label-wrap">
      <span class="plate-label-en">🍽️ Plate</span>
      <span class="plate-label-rw">Isahani</span>
    </div>
    <div class="plate" id="plateEl">
      <span class="empty-hint" id="emptyHintEl">
        <span class="empty-hint-en">Tap 🍌 to add bananas!</span>
        <span class="empty-hint-rw">Kanda 🍌 wongeremo ibigitoki!</span>
      </span>
    </div>
  </div>

  <!-- ── COUNT DISPLAY ────────────────────────────────── -->
  <div class="count-row" id="countRowEl">
    <span class="count-current" id="countNowEl">0</span>
    <span>/</span>
    <span id="countTargetEl">?</span>
    🍌
  </div>

  <!-- ── FEEDBACK TEXT ────────────────────────────────── -->
  <div class="feedback" id="feedbackEl"></div>

  <!-- ── CONTROLS ─────────────────────────────────────── -->
  <div class="controls">
    <button class="banana-btn" id="bananaBtnEl" onclick="tapBanana()">🍌</button>
    <p class="tap-hint">
      <span class="tap-hint-en">Tap to feed the goat!</span>
      <span class="tap-hint-rw">Kanda uhe impene!</span>
    </p>
    <div class="btn-row">
      <button class="btn-check" onclick="checkAnswer()">
        <span class="btn-label-en">✅ Check!</span>
        <span class="btn-label-rw">Suzuma!</span>
      </button>
      <button class="btn-reset" onclick="resetPlate()">
        <span class="btn-label-en">↩️ Reset</span>
        <span class="btn-label-rw">Subira</span>
      </button>
    </div>
  </div>

  <!-- ── END OVERLAY ──────────────────────────────────── -->
  <div class="overlay" id="endOverlay">
    <div class="end-card">
      <span class="end-emoji" id="endEmojiEl">🎉</span>
      <div class="end-title">
        <span class="end-title-en" id="endTitleEnEl">Well Done!</span>
        <span class="end-title-rw" id="endTitleRwEl">Wakoze neza!</span>
      </div>
      <div class="end-score-wrap">
        <div class="end-score-en">
          You scored <strong><span id="finalScoreEl">0</span> / 10</strong> ⭐
        </div>
        <div class="end-score-rw">
          Amanota yawe: <strong><span id="finalScoreRwEl">0</span> / 10</strong>
        </div>
      </div>
      <button class="btn-again" onclick="startGame()">
        <span class="btn-again-en">▶ Play Again!</span>
        <span class="btn-again-rw">Kinira Nanone!</span>
      </button>
    </div>
  </div>

  <script>
  'use strict';

  /* ==============================================================
     AUDIO ENGINE  —  100 % Web Audio API, zero external files
  ============================================================== */
  let _actx = null;

  function getACtx() {
    if (!_actx) {
      _actx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (_actx.state === 'suspended') { _actx.resume(); }
    return _actx;
  }

  /**
   * sndTap — soft triangle-wave blip on each banana tap.
   * Frequency glides 520→320 Hz for a gentle "plop" feel.
   */
  function sndTap() {
    try {
      const ctx = getACtx(), t = ctx.currentTime;
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(520, t);
      osc.frequency.exponentialRampToValueAtTime(320, t + 0.09);
      gain.gain.setValueAtTime(0.22, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
      osc.start(t);
      osc.stop(t + 0.16);
    } catch (e) {}
  }

  /**
   * sndCorrect — ascending C-E-G major arpeggio chime.
   * Three sine tones staggered 160 ms apart: "ding-dong-ding".
   */
  function sndCorrect() {
    try {
      const ctx = getACtx(), t = ctx.currentTime;
      const notes = [
        { freq: 523.25, delay: 0.00, dur: 0.48 },  /* C5 */
        { freq: 659.25, delay: 0.16, dur: 0.48 },  /* E5 */
        { freq: 783.99, delay: 0.32, dur: 0.70 },  /* G5 */
      ];
      notes.forEach(function(n) {
        const osc  = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(n.freq, t + n.delay);
        gain.gain.setValueAtTime(0, t + n.delay);
        gain.gain.linearRampToValueAtTime(0.44, t + n.delay + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + n.delay + n.dur);
        osc.start(t + n.delay);
        osc.stop(t + n.delay + n.dur + 0.05);
      });
    } catch (e) {}
  }

  /**
   * sndWrong — descending sawtooth buzz.
   * Ramps 155→88 Hz: blunt and low, not harsh or scary.
   */
  function sndWrong() {
    try {
      const ctx = getACtx(), t = ctx.currentTime;
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(155, t);
      osc.frequency.linearRampToValueAtTime(88, t + 0.34);
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.32, t + 0.02);
      gain.gain.linearRampToValueAtTime(0.28, t + 0.17);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.42);
      osc.start(t);
      osc.stop(t + 0.46);
    } catch (e) {}
  }

  /**
   * sndFanfare — six-note C-major pentatonic fanfare for game over.
   * Cheerful ascending run ending on a high C resolution.
   */
  function sndFanfare() {
    try {
      const ctx = getACtx(), t = ctx.currentTime;
      const seq = [
        { freq: 523.25,  delay: 0.00 },  /* C5 */
        { freq: 659.25,  delay: 0.14 },  /* E5 */
        { freq: 783.99,  delay: 0.28 },  /* G5 */
        { freq: 1046.50, delay: 0.44 },  /* C6 */
        { freq: 783.99,  delay: 0.60 },  /* G5 */
        { freq: 1046.50, delay: 0.74 },  /* C6 */
      ];
      seq.forEach(function(s) {
        const osc  = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(s.freq, t + s.delay);
        gain.gain.setValueAtTime(0, t + s.delay);
        gain.gain.linearRampToValueAtTime(0.38, t + s.delay + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + s.delay + 0.54);
        osc.start(t + s.delay);
        osc.stop(t + s.delay + 0.62);
      });
    } catch (e) {}
  }

  /* ==============================================================
     GAME STATE
  ============================================================== */
  var TOTAL_ROUNDS = 10;
  var target = 0;
  var count  = 0;
  var score  = 0;
  var done   = 0;
  var locked = false;

  /* ==============================================================
     DOM REFERENCES
  ============================================================== */
  var $scoreVal      = document.getElementById('scoreVal');
  var $dotsRow       = document.getElementById('dotsRow');
  var $targetNumEl   = document.getElementById('targetNumEl');
  var $targetNumRwEl = document.getElementById('targetNumRwEl');
  var $goatEl        = document.getElementById('goatEl');
  var $starPopEl     = document.getElementById('starPopEl');
  var $plateEl       = document.getElementById('plateEl');
  var $emptyHintEl   = document.getElementById('emptyHintEl');
  var $countNowEl    = document.getElementById('countNowEl');
  var $countTgtEl    = document.getElementById('countTargetEl');
  var $countRowEl    = document.getElementById('countRowEl');
  var $feedbackEl    = document.getElementById('feedbackEl');
  var $endOverlay    = document.getElementById('endOverlay');
  var $finalScEl     = document.getElementById('finalScoreEl');
  var $finalScRwEl   = document.getElementById('finalScoreRwEl');
  var $endEmojiEl    = document.getElementById('endEmojiEl');
  var $endTitleEnEl  = document.getElementById('endTitleEnEl');
  var $endTitleRwEl  = document.getElementById('endTitleRwEl');

  /* ==============================================================
     HELPER — build bilingual feedback HTML string
  ============================================================== */
  function biHTML(enText, rwText) {
    return '<span class="fb-en">' + enText + '</span>'
         + '<span class="fb-rw">'  + rwText + '</span>';
  }

  /* ==============================================================
     INITIALISATION
  ============================================================== */
  function startGame() {
    score  = 0;
    done   = 0;
    locked = false;
    $scoreVal.textContent = '0';
    $endOverlay.classList.remove('active');
    buildProgressDots();
    newRound();
  }

  function buildProgressDots() {
    $dotsRow.innerHTML = '';
    for (var i = 0; i < TOTAL_ROUNDS; i++) {
      var d = document.createElement('div');
      d.className = 'dot';
      d.id = 'dot' + i;
      $dotsRow.appendChild(d);
    }
  }

  /* ==============================================================
     ROUND MANAGEMENT
  ============================================================== */
  function newRound() {
    locked = false;
    count  = 0;

    clearPlateDOM();

    /* Remove any lingering animation classes */
    $plateEl.classList.remove('shake');
    $countRowEl.classList.remove('shake');
    $goatEl.classList.remove('bounce');
    $starPopEl.classList.remove('active');
    $starPopEl.style.opacity = '0';

    /* Clear feedback */
    $feedbackEl.innerHTML = '';
    $feedbackEl.className = 'feedback';

    /* Pick a random target number 1–9 */
    target = Math.floor(Math.random() * 9) + 1;
    $targetNumEl.textContent    = target;
    $targetNumRwEl.textContent  = target;
    $countTgtEl.textContent     = target;
    $countNowEl.textContent     = '0';
  }

  /** Remove only the banana items from the plate, keep the hint span */
  function clearPlateDOM() {
    var bananas = $plateEl.querySelectorAll('.plate-banana');
    for (var i = 0; i < bananas.length; i++) {
      bananas[i].remove();
    }
    $emptyHintEl.style.display = 'flex';
  }

  /* ==============================================================
     PLAYER ACTIONS
  ============================================================== */

  /** Tapping the big banana button */
  function tapBanana() {
    if (locked) return;

    /* Hard cap at 9 — matches maximum possible target */
    if (count >= 9) {
      triggerWrong('Too many! Press ↩️ Reset', 'Ni byinshi! Kanda Subira');
      return;
    }

    sndTap();
    count++;
    $countNowEl.textContent = count;

    /* Hide empty-plate hint once first banana lands */
    $emptyHintEl.style.display = 'none';

    /* Append animated banana to plate */
    var b = document.createElement('span');
    b.className   = 'plate-banana';
    b.textContent = '🍌';
    $plateEl.appendChild(b);

    /* If there was a red wrong message, clear it so child can
       keep correcting themselves without visual clutter */
    if ($feedbackEl.classList.contains('wrong')) {
      $feedbackEl.innerHTML = '';
      $feedbackEl.className = 'feedback';
    }
  }

  /** Reset button — clears the plate without penalising score */
  function resetPlate() {
    if (locked) return;
    count = 0;
    $countNowEl.textContent = '0';
    clearPlateDOM();
    $plateEl.classList.remove('shake');
    $countRowEl.classList.remove('shake');
    $feedbackEl.innerHTML = '';
    $feedbackEl.className = 'feedback';
  }

  /** Check button — evaluate banana count against target */
  function checkAnswer() {
    if (locked) return;

    if (count === 0) {
      triggerWrong('Tap 🍌 first!', 'Banza kanda 🍌!');
      return;
    }

    if (count === target) {
      handleCorrect();
    } else {
      var diff = target - count;
      if (diff > 0) {
        triggerWrong(
          'Need ' + diff + ' more 🍌!',
          'Ukeneye ' + diff + ' yongeye!'
        );
      } else {
        triggerWrong(
          'Too many! Press ↩️ Reset',
          'Ni byinshi! Kanda Subira'
        );
      }
    }
  }

  /* ==============================================================
     FEEDBACK ROUTINES
  ============================================================== */

  /** Wrong answer: buzz + shake + bilingual hint */
  function triggerWrong(enMsg, rwMsg) {
    sndWrong();

    /* Force CSS animation restart via reflow trick */
    $plateEl.classList.remove('shake');
    $countRowEl.classList.remove('shake');
    void $plateEl.offsetWidth;
    void $countRowEl.offsetWidth;
    $plateEl.classList.add('shake');
    $countRowEl.classList.add('shake');

    $feedbackEl.innerHTML = biHTML(enMsg, rwMsg);
    $feedbackEl.className = 'feedback wrong';

    setTimeout(function() {
      $plateEl.classList.remove('shake');
      $countRowEl.classList.remove('shake');
    }, 460);
  }

  /** Correct answer: chime + goat bounce + star pop + advance round */
  function handleCorrect() {
    locked = true;
    sndCorrect();

    /* Goat bounce — force restart */
    $goatEl.classList.remove('bounce');
    void $goatEl.offsetWidth;
    $goatEl.classList.add('bounce');

    /* Star pop — force restart */
    $starPopEl.classList.remove('active');
    void $starPopEl.offsetWidth;
    $starPopEl.style.opacity = '';
    $starPopEl.classList.add('active');

    /* Bilingual positive feedback */
    $feedbackEl.innerHTML = biHTML('🎉 Great job!', 'Wakoze neza!');
    $feedbackEl.className = 'feedback';

    /* Update score */
    score++;
    $scoreVal.textContent = score;

    /* Mark progress dot */
    done++;
    var dot = document.getElementById('dot' + (done - 1));
    if (dot) { dot.classList.add('done'); }

    /* Wait for animation to settle before advancing */
    setTimeout(function() {
      if (done >= TOTAL_ROUNDS) {
        showEndScreen();
      } else {
        newRound();
      }
    }, 1700);
  }

  /** End-of-game overlay with score-appropriate bilingual message */
  function showEndScreen() {
    sndFanfare();
    $finalScEl.textContent   = score;
    $finalScRwEl.textContent = score;

    if (score === 10) {
      $endEmojiEl.textContent   = '🏆';
      $endTitleEnEl.textContent = 'Perfect!';
      $endTitleRwEl.textContent = 'Ntarengwa!';
    } else if (score >= 7) {
      $endEmojiEl.textContent   = '🎉';
      $endTitleEnEl.textContent = 'Well Done!';
      $endTitleRwEl.textContent = 'Wakoze neza!';
    } else if (score >= 4) {
      $endEmojiEl.textContent   = '😊';
      $endTitleEnEl.textContent = 'Good Try!';
      $endTitleRwEl.textContent = 'Wagerageje neza!';
    } else {
      $endEmojiEl.textContent   = '💪';
      $endTitleEnEl.textContent = 'Keep Trying!';
      $endTitleRwEl.textContent = 'Komeza ugerageze!';
    }

    $endOverlay.classList.add('active');
  }

  /* ==============================================================
     BOOT — kick off on page load
  ============================================================== */
  startGame();
  </script>


</body></html>
