<!DOCTYPE html>

<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Arena</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        header {
            background-color: #1e293b;
            padding: 15px;
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
            border-bottom: 4px solid #334155;
            color: #38bdf8;
        }
        /* Theater Area (Top Half) */
        .theater {
            height: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #1e1b4b 0%, #0f172a 100%);
            border-bottom: 4px dashed #334155;
            position: relative;
            padding: 20px;
        }
        #main-question { font-size: 4rem; font-weight: 800; text-shadow: 0 4px 12px rgba(0,0,0,0.5); }
        #buzzer-status { font-size: 1.8rem; margin-top: 15px; color: #fbbf24; font-weight: 600; min-height: 2.5rem; }

        /* Multi-Choice Option Panel */
        .global-options {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            width: 80%;
            justify-content: center;
        }
        .opt-box {
            background: #1e293b;
            border: 2px solid #475569;
            border-radius: 8px;
            padding: 12px 30px;
            font-size: 1.8rem;
            font-weight: bold;
            min-width: 120px;
            text-align: center;
        }

        /* Player Zone Layout (Bottom Half) */
        .player-arena { display: flex; height: 50%; width: 100%; }
        .player-pod {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px;
            transition: all 0.2s ease;
        }
        #p1-pod { background-color: #1c3d5a; border-right: 2px solid #334155; }
        #p2-pod { background-color: #14532d; border-right: 2px solid #334155; }
        #p3-pod { background-color: #701a75; }

        /* Typography Inside Pods */
        .pod-title { font-size: 1.3rem; font-weight: bold; border-bottom: 2px solid rgba(255,255,255,0.1); padding-bottom: 5px; display: flex; justify-content: space-between; }
        .pod-score { font-size: 2.2rem; color: #ffd700; }
        .control-map { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 6px; font-family: monospace; font-size: 0.95rem; line-height: 1.5; margin-top: auto; }
        
        /* Status Overrides */
        .active-buzzed { background-color: #d97706 !important; transform: scale(1.02); z-index: 2; box-shadow: 0 0 30px rgba(217,119,6,0.5); }
        .locked-out { opacity: 0.25; filter: grayscale(80%); }
        .correct-flash { background-color: #16a34a !important; }
        .wrong-flash { background-color: #dc2626 !important; }

        /* Overlay Final Screen */
        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); display:none; flex-direction:column; justify-content:center; align-items:center; z-index:10; }
        .modal h1 { font-size: 4rem; color: #ffd700; margin-bottom: 20px; }
        .modal button { padding: 15px 40px; font-size: 1.5rem; font-weight: bold; border:none; border-radius:8px; background:#16a34a; color:white; cursor:pointer; }
    </style>
</head>
<body>

    <header>Math trio arena -- first to 7 points wins</header>

    <!-- Shared Upper Viewport -->
    <div class="theater">
        <div id="main-question">Find x: 5x + 3 = 2x + 12</div>
        <div class="global-options">
            <div class="opt-box" id="o0">[1] 1</div>
            <div class="opt-box" id="o1">[2] 2</div>
            <div class="opt-box" id="o2">[3] 3</div>
            <div class="opt-box" id="o3">[4] 4</div>
        </div>
        <div id="buzzer-status" style="color: rgb(251, 191, 36);">Ready: Hit Your Buzzer Key!</div>
    </div>

    <!-- Triple Divided Base Controllers -->
    <div class="player-arena">
        <!-- PLAYER 1 -->
        <div class="player-pod" id="p1-pod">
            <div class="pod-title"><div>PLAYER 1</div><div class="pod-score" id="p1-score">0</div></div>
            <div class="control-map">
                <strong>BUZZER: <span style="color:#f43f5e">1</span></strong><br>
                Press: [Q] [W] [E] or [R]
            </div>
        </div>
        <!-- PLAYER 2 -->
        <div class="player-pod" id="p2-pod">
            <div class="pod-title"><div>PLAYER 2</div><div class="pod-score" id="p2-score">0</div></div>
            <div class="control-map">
                <strong>BUZZER: <span style="color:#f43f5e">2</span></strong><br>
                Press: [G] [H] [J] or [K]
            </div>
        </div>
        <!-- PLAYER 3 -->
        <div class="player-pod" id="p3-pod">
            <div class="pod-title"><div>PLAYER 3</div><div class="pod-score" id="p3-score">0</div></div>
            <div class="control-map">
                <strong>BUZZER: <span style="color:#f43f5e">3</span></strong><br>
                Press: [U] [I] [O] or [P]
            </div>
        </div>
    </div>

    <!-- End Game Overlay Screen -->
    <div class="modal" id="end-modal">
        <h1 id="winner-announcement">PLAYER WINS!</h1>
        <button onclick="resetTournament()">Next Tournament Round</button>
    </div>

    <script>
        const s1s2Database = [
            { q: "(-4) × (-5) - 3", a: 17, opt: [23, 17, -23, -17] },
            { q: "Find x: 4x - 9 = 11", a: 5, opt: [3, 4, 5, 20] },
            { q: "Value of: -18 ÷ (-3) - 8", a: -2, opt: [-2, 14, -14, 2] },
            { q: "Simplify: (x² × x³)", a: "x⁵", opt: ["x⁶", "x⁵", "x¹", "5x"] },
            { q: "Vectors: (3, -1) + (-2, 5)", a: "(1, 4)", opt: ["(5, 4)", "(1, 4)", "(1, -6)", "(-5, 6)"] },
            { q: "Convert to %: 3/5", a: "60%", opt: ["35%", "53%", "60%", "30%"] },
            { q: "Solve: -2x = 16", a: -8, opt: [8, -8, 14, -14] },
            { q: "Solve: 6(x-4)=18", a: 7, opt: [4, 8, 10, 7] },
            { q: "(-7) x (-3) + 2", a: 23, opt: [-23, -31, 23, -13] },
            { q: "Solve: 8(3x + 2) = 64", a: 2, opt: [5, 2, 1, 7] },
            { q: "Simplify: (2x³)²", a: "4x⁶", opt: ["4x⁶", "4x⁵", "2x⁵", "2x⁶"] },
            { q: "Find x: 5x + 3 = 2x + 12", a: 3, opt: [1, 2, 3, 4] },
            { q: "Value of: -15 ÷ (-5) + 6", a: 9, opt: [3, 9, -3, -9] }
        ];

        let scores = { p1: 0, p2: 0, p3: 0 };
        let activeQ = null;
        let activeBuzzer = null; // Contains 'p1', 'p2', 'p3' or null
        let matchRunning = true;
        let countdownTimer = null;

        function renderNewTurn() {
            activeBuzzer = null;
            // Clear layout modifier utility classes
            ['p1-pod', 'p2-pod', 'p3-pod'].forEach(id => {
                const el = document.getElementById(id);
                el.className = "player-pod";
            });
            document.getElementById('buzzer-status').innerText = "Ready: Hit Your Buzzer Key!";
            document.getElementById('buzzer-status').style.color = "#fbbf24";

            activeQ = s1s2Database[Math.floor(Math.random() * s1s2Database.length)];
            document.getElementById('main-question').innerText = activeQ.q;
            
            // Render Shared Global Multiple Choice Options Array
            for(let i=0; i<4; i++) {
                document.getElementById(`o${i}`).innerText = `[${i+1}] ${activeQ.opt[i]}`;
            }
        }

        window.addEventListener('keydown', function(event) {
            if (!matchRunning) return;
            const key = event.key.toUpperCase();

            // PHASE 1: OPEN BUZZER CAPTURES
            if (activeBuzzer === null) {
                if (key === '1') lockInBuzzer('p1', 'p1-pod');
                if (key === '2') lockInBuzzer('p2', 'p2-pod');
                if (key === '3') lockInBuzzer('p3', 'p3-pod');
                return;
            }

            // PHASE 2: ACTIVE BUZZED INPUT RESOLUTION
            if (activeBuzzer !== null) {
                let selectedIndex = -1;

                if (activeBuzzer === 'p1') {
                    if (['Q', 'W', 'E', 'R'].includes(key)) selectedIndex = ['Q', 'W', 'E', 'R'].indexOf(key);
                } else if (activeBuzzer === 'p2') {
                    if (['G', 'H', 'J', 'K'].includes(key)) selectedIndex = ['G', 'H', 'J', 'K'].indexOf(key);
                } else if (activeBuzzer === 'p3') {
                    if (['U', 'I', 'O', 'P'].includes(key)) selectedIndex = ['U', 'I', 'O', 'P'].indexOf(key);
                }

                if (selectedIndex !== -1) {
                    clearTimeout(countdownTimer);
                    verifyChoice(selectedIndex);
                }
            }
        });

        function lockInBuzzer(playerCode, podId, nameString) {
            activeBuzzer = playerCode;
            
            // Visual Lockout Masking Execution
            ['p1-pod', 'p2-pod', 'p3-pod'].forEach(id => {
                document.getElementById(id).classList.add(id === podId ? 'active-buzzed' : 'locked-out');
            });

            document.getElementById('buzzer-status').innerText = `⏱️ ${nameString} BUZZED IN! CHOOSE IN 5 SECONDS...`;
            document.getElementById('buzzer-status').style.color = "#f97316";

            // Fire 5 Second Penalty Watchdog
            countdownTimer = setTimeout(() => {
                document.getElementById('buzzer-status').innerText = `❌ TIME OUT PENALTY!`;
                applyPointAdjustment(false);
            }, 5000);
        }

        function verifyChoice(idx) {
            const chosenAnswer = activeQ.opt[idx];
            const isCorrect = (chosenAnswer === activeQ.a);
            applyPointAdjustment(isCorrect);
        }

        function applyPointAdjustment(isSuccess) {
            const targetedPod = document.getElementById(`${activeBuzzer}-pod`);
            targetedPod.classList.remove('active-buzzed');

            if (isSuccess) {
                targetedPod.classList.add('correct-flash');
                scores[activeBuzzer]++;
                document.getElementById('buzzer-status').innerText = "✅ CORRECT ANSWER!";
                document.getElementById('buzzer-status').style.color = "#22c55e";
            } else {
                targetedPod.classList.add('wrong-flash');
                scores[activeBuzzer] = Math.max(0, scores[activeBuzzer] - 1); // Deduct for wrong/time-out
                document.getElementById('buzzer-status').innerText = `❌ INCORRECT! Answer was: ${activeQ.a}`;
                document.getElementById('buzzer-status').style.color = "#ef4444";
            }

            // Sync scores to page UI layout counters
            document.getElementById('p1-score').innerText = scores.p1;
            document.getElementById('p2-score').innerText = scores.p2;
            document.getElementById('p3-score').innerText = scores.p3;

            // Check Win Thresholds
            if (scores[activeBuzzer] >= 7) {
                matchRunning = false;
                setTimeout(() => {
                    const winnerMap = { p1: "PLAYER 1", p2: "PLAYER 2", p3: "PLAYER 3" };
                    document.getElementById('winner-announcement').innerText = `🏆 ${winnerMap[activeBuzzer]} WINS THE TOURNAMENT!`;
                    document.getElementById('end-modal').style.display = 'flex';
                }, 1200);
            } else {
                setTimeout(renderNewTurn, 2000);
            }
        }

        function resetTournament() {
            scores = { p1: 0, p2: 0, p3: 0 };
            document.getElementById('p1-score').innerText = 0;
            document.getElementById('p2-score').innerText = 0;
            document.getElementById('p3-score').innerText = 0;
            document.getElementById('end-modal').style.display = 'none';
            matchRunning = true;
            renderNewTurn();
        }

        // Initialize engine launch state
        renderNewTurn();
    </script>

</body></html>
