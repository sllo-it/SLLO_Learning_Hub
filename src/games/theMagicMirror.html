/* ============================================================
   CANVAS MATH AND TRANSLATION LAYERS
   ============================================================ */
function drawShapeGeneric(ctx, shape, mirrorActive) {
  ctx.save();
  if (mirrorActive) {
    ctx.translate(AXIS, 0);
    ctx.scale(-1, 1);
    ctx.translate(-AXIS, 0);
  }
  
  ctx.fillStyle = shape.color;
  ctx.lineWidth = 5;
  ctx.strokeStyle = 'rgba(50,30,90,0.35)';
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  if (shape.type === 'poly') {
    ctx.beginPath();
    ctx.moveTo(shape.pts[0][0], shape.pts[0][1]);
    for(let i=1; i<shape.pts.length; i++) {
      ctx.lineTo(shape.pts[i][0], shape.pts[i][1]);
    }
    ctx.closePath();
    ctx.fill(); ctx.stroke();
  } else {
    shape.draw(ctx);
    ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

function drawAxis(ctx) {
  ctx.save();
  ctx.setLineDash([10, 10]);
  ctx.lineWidth = 3.5;
  ctx.strokeStyle = 'rgba(90,70,150,0.5)';
  ctx.beginPath(); ctx.moveTo(AXIS, 5); ctx.lineTo(AXIS, 315); ctx.stroke();
  ctx.restore();
}

function drawTargetLeft(shape) {
  targetCtx.clearRect(0, 0, 300, 320);
  drawShapeGeneric(targetCtx, shape, false);
  drawAxis(targetCtx);
}

function drawTargetFull(shape) {
  targetCtx.clearRect(0, 0, 300, 320);
  drawShapeGeneric(targetCtx, shape, false);
  drawShapeGeneric(targetCtx, shape, true);
  drawAxis(targetCtx);
}

function drawOption(ctx, shape, type) {
  ctx.clearRect(0, 0, 300, 320);
  drawShapeGeneric(ctx, shape, false);

  ctx.save();
  if (type === 'correct') {
    drawShapeGeneric(ctx, shape, true);
  } else if (type === 'shift') {
    ctx.translate(0, 45); 
    drawShapeGeneric(ctx, shape, true);
  } else if (type === 'distort') {
    ctx.translate(AXIS, 0);
    ctx.scale(0.4, 1.3);
    ctx.translate(-AXIS, -30);
    drawShapeGeneric(ctx, shape, true);
  }
  ctx.restore();
  drawAxis(ctx);
}

function paintFog(ctx) {
  ctx.clearRect(0, 0, 300, 320);
  const g = ctx.createLinearGradient(0, 0, 300, 320);
  g.addColorStop(0, '#cbd5e1'); g.addColorStop(1, '#94a3b8');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 300, 320);
  
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  for (let i = 0; i < 20; i++) {
    ctx.beginPath();
    ctx.arc(Math.random()*300, Math.random()*320, 3+Math.random()*4, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.fillStyle = '#334155'; ctx.textAlign = 'center';
  ctx.font = "bold 24px 'Comic Sans MS', sans-serif";
  ctx.fillText('🧼 Wipe Me!', 150, 165);
}

/* ============================================================
   WEB AUDIO API SOUND GENERATOR
   ============================================================ */
let actx = null;
function initAudio() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) actx = new AC();
  }
  if (actx && actx.state === 'suspended') actx.resume();
}

function synth(f, d, type, v, del) {
  if (!actx) return;
  const t = actx.currentTime + (del || 0);
  const o = actx.createOscillator(); const g = actx.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.001, t); g.gain.linearRampToValueAtTime(v||0.2, t+0.01);
  g.gain.exponentialRampToValueAtTime(0.001, t+d);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t+d+0.02);
}

let lastScratch = 0;
function scratchSound() {
  if (!actx || performance.now() - lastScratch < 100) return;
  lastScratch = performance.now();
  const len = Math.floor(actx.sampleRate * 0.04), b = actx.createBuffer(1, len, actx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * 0.25;
  const s = actx.createBufferSource(); s.buffer = b;
  const f = actx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 2000;
  const g = actx.createGain(); g.gain.value = 0.1;
  s.connect(f); f.connect(g); g.connect(actx.destination); s.start();
}

// Grand Finale Victory Fanfare Synthesizer
function celebrationSound() {
  if (!actx) return;
  // Part 1: Fast ascending magical arpeggio scale
  const scale = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50];
  scale.forEach(function(freq, index) {
    synth(freq, 0.25, 'triangle', 0.15, index * 0.08);
  });

  // Part 2: Rich, booming victory chord layer triggered at the apex of the scale
  const chordDelay = scale.length * 0.08;
  const chordNotes = [523.25, 659.25, 783.99, 987.77, 1318.51]; // Bright, triumphant Major 7th chord structure
  chordNotes.forEach(function(freq) {
    synth(freq, 1.8, 'sine', 0.12, chordDelay);
    synth(freq, 1.2, 'triangle', 0.08, chordDelay); // Add texture nodes for a warmer, arcade feel
  });
}

/* ============================================================
   GAME LOGIC RUNTIME TIMELINE PIPELINE
   ============================================================ */
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

function initializePlaylist() {
  levelPlaylist = [];
  for (let i = 0; i < SHAPES_DATABASE.length; i++) levelPlaylist.push(i);
  shuffle(levelPlaylist);
}

function updateHud() {
  document.getElementById('levelPill').textContent = 'Level ' + (levelIndex + 1) + '/6';
  let s = '';
  for (let i = 0; i < 6; i++) s += (i < stars) ? '⭐' : '☆';
  document.getElementById('starPill').textContent = s;
}

function loadLevel() {
  solved = false; foldActive = false;
  
  const shapeId = levelPlaylist[levelIndex % levelPlaylist.length];
  const shape = SHAPES_DATABASE[shapeId];

  document.getElementById('instruction').textContent = 'Complete the ' + shape.name + '! ' + shape.emoji;

  drawTargetLeft(shape);
  
  flapCtx.clearRect(0, 0, 300, 320);
  drawShapeGeneric(flapCtx, shape, false);

  flap.style.transition = 'none'; flap.style.transform = 'rotateY(0deg)'; flap.style.opacity = '1';
  void flap.offsetWidth; flap.style.transition = '';

  optionTypes = shuffle(['correct', 'shift', 'distort']);

  optionEls.forEach(function(rec, i){
    drawOption(rec.baseCtx, shape, optionTypes[i]);
    paintFog(rec.fogCtx);
    rec.opt.classList.remove('wrong', 'correct');
    rec.btn.disabled = false;
  });

  document.getElementById('banner').className = '';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('againBtn').style.display = 'none';
  updateHud();
}

function handleChoice(i) {
  if (solved) return;
  initAudio();

  if (optionTypes[i] === 'correct') {
    solved = true;
    // Standard correct level chime
    synth(523, 0.3, 'triangle', 0.2, 0); synth(659, 0.3, 'triangle', 0.2, 0.1); synth(783, 0.4, 'triangle', 0.2, 0.2);
    
    optionEls.forEach(function(rec){ rec.btn.disabled = true; });
    optionEls[i].opt.classList.add('correct');
    
    const b = document.getElementById('banner');
    b.textContent = '🎉 Perfect Reflection Match! Watch it fold...';
    b.className = 'show good';

    foldActive = true;
    flap.style.transform = 'rotateY(180deg)';
  } else {
    synth(160, 0.2, 'sawtooth', 0.25, 0); synth(110, 0.3, 'sawtooth', 0.25, 0.12);
    const rec = optionEls[i];
    rec.opt.classList.add('wrong');
    
    const b = document.getElementById('banner');
    b.textContent = '🤔 Not quite a perfect mirror reflection! Clean another!';
    b.className = 'show bad';
    
    setTimeout(function(){
      rec.opt.classList.remove('wrong');
      if(!solved) b.className = '';
    }, 1300);
  }
}

flap.addEventListener('transitionend', function(e){
  if (e.propertyName !== 'transform' || !foldActive) return;
  foldActive = false;
  
  const shapeId = levelPlaylist[levelIndex % levelPlaylist.length];
  drawTargetFull(SHAPES_DATABASE[shapeId]);
  
  setTimeout(function(){ flap.style.opacity = '0'; }, 100);
  
  stars = Math.min(6, stars + 1);
  updateHud();

  const b = document.getElementById('banner');
  if (levelIndex >= 5) {
    b.textContent = '🏆 Brilliant! You have completed all target stages!';
    document.getElementById('winMsg').style.display = 'flex';
    celebrate();
    celebrationSound(); // Trigger the grand finale audio fanfare here
  } else {
    b.textContent = '✨ Excellent Symmetrical Magic! Ready for the next card?';
    document.getElementById('nextBtn').style.display = 'inline-block';
  }
});

/* ============================================================
   UI DOM BINDINGS GENERATOR STRUCTURE
   ============================================================ */
function buildDOMContainers() {
  const row = document.getElementById('optionsRow');
  row.innerHTML = ''; optionEls.length = 0;

  for (let i = 0; i < 3; i++) {
    const opt = document.createElement('div'); opt.className = 'option';
    const wrap = document.createElement('div'); wrap.className = 'opt-wrap';
    const base = document.createElement('canvas'); base.width = 300; base.height = 320;
    const fog = document.createElement('canvas'); fog.width = 300; fog.height = 320; fog.className = 'fog';
    const btn = document.createElement('button'); btn.className = 'choose-btn'; btn.textContent = 'Match this one!';

    wrap.appendChild(base); wrap.appendChild(fog); opt.appendChild(wrap); opt.appendChild(btn); row.appendChild(opt);

    const rec = { opt: opt, baseCtx: base.getContext('2d'), fogCtx: fog.getContext('2d'), btn: btn, scratching: false };
    optionEls.push(rec);

    function pos(e) {
      const r = fog.getBoundingClientRect();
      return { x: (e.clientX - r.left) * (300 / r.width), y: (e.clientY - r.top) * (320 / r.height) };
    }
    function wipe(x, y) {
      const c = rec.fogCtx; c.globalCompositeOperation = 'destination-out';
      c.beginPath(); c.arc(x, y, 25, 0, Math.PI*2); c.fill();
      c.globalCompositeOperation = 'source-over';
    }

    fog.addEventListener('pointerdown', function(e){
      e.preventDefault(); initAudio(); rec.scratching = true;
      try { fog.setPointerCapture(e.pointerId); } catch(err){}
      const p = pos(e); wipe(p.x, p.y); scratchSound();
    });
    fog.addEventListener('pointermove', function(e){
      if(!rec.scratching) return; e.preventDefault();
      const p = pos(e); wipe(p.x, p.y); scratchSound();
    });
    function stop() { rec.scratching = false; }
    fog.addEventListener('pointerup', stop); fog.addEventListener('pointercancel', stop); fog.addEventListener('pointerleave', stop);
    btn.addEventListener('click', function(){ handleChoice(i); });
  }
}

function resetFullGameWorkflow() {
  levelIndex = 0; stars = 0;
  document.getElementById('winMsg').style.display = 'none';
  document.getElementById('confetti').style.display = 'none';
  initializePlaylist();
  loadLevel();
}

document.getElementById('nextBtn').addEventListener('click', function(){ levelIndex++; loadLevel(); });
document.getElementById('finalAgainBtn').addEventListener('click', resetFullGameWorkflow);

/* ============================================================
   CONFETTI GENERATOR RENDER MATRIX
   ============================================================ */
function celebrate() {
  const c = document.getElementById('confetti'); c.style.display = 'block';
  const ctx = c.getContext('2d'); c.width = window.innerWidth; c.height = window.innerHeight;
  const colors = ['#ff5d8f', '#ffd23f', '#43c463', '#4cc9f0', '#9b5de5'];
  const parts = [];

  for (let i = 0; i < 180; i++) {
    parts.push({
      x: c.width/2, y: c.height/2,
      vx: (Math.random() - 0.5) * 18, vy: (Math.random() - 0.8) * 18,
      g: 0.3, size: 6 + Math.random()*8, color: colors[i % colors.length],
      rot: Math.random()*6, vr: (Math.random() - 0.5) * 0.2
    });
  }
  const start = performance.now();
  requestAnimationFrame(function frame(t) {
    if (t - start > 4000) { c.style.display = 'none'; return; }
    ctx.clearRect(0, 0, c.width, c.height);
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i]; p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color; ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size*0.6);
      ctx.restore();
    }
    requestAnimationFrame(frame);
  });
}

window.addEventListener('pointerdown', function once(){ initAudio(); window.removeEventListener('pointerdown', once); }, { once: true });
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });

/* ============================================================
   INITIALIZATION TRIGGER ENTRIES
   ============================================================ */
buildDOMContainers();
resetFullGameWorkflow();
</script>
</body></html>
