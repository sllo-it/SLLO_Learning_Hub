<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Мугишагийн зах · Mugisha's Market · 穆吉沙的市场</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #e6d5b8;
            font-family: 'Segoe UI', 'Noto Sans', 'Noto Sans Mongolian', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .game {
            width: 100%;
            max-width: 520px;
            background: #fff7e6;
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            overflow: hidden;
            min-height: 780px;
            display: flex;
            flex-direction: column;
        }
        .top-bar {
            background: white;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #f9a825;
            font-weight: bold;
            flex-wrap: wrap;
        }
        .goal-bar {
            flex: 1; margin: 0 10px;
            background: #eee; border-radius: 10px; height: 12px; overflow: hidden;
            min-width: 60px;
        }
        .goal-fill {
            height: 100%; background: #4caf50; border-radius: 10px; transition: width 0.5s;
        }
        .lang-switch { display: flex; gap: 5px; }
        .lang-btn {
            background: #eee; border: none; border-radius: 10px;
            padding: 4px 8px; cursor: pointer; font-weight: bold; font-size: 13px;
        }
        .lang-btn.active { background: #5d4037; color: white; }
        .scene {
            flex: 1;
            background: linear-gradient(180deg, #87CEEB 0%, #b3e5fc 30%, #ffe0b2 100%);
            position: relative;
            display: flex; flex-direction: column; align-items: center;
            padding: 20px 15px;
        }
        .characters {
            display: flex; justify-content: space-between; width: 100%; padding: 0 10px; margin-bottom: 5px;
        }
        .char { font-size: 4.5rem; transition: 0.3s; }
        .char.mugisha { animation: bounce 1s infinite alternate; }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-8px); } }
        .bubble {
            background: white; border-radius: 20px; padding: 12px 18px;
            font-size: 1rem; font-weight: bold; color: #3e2723;
            box-shadow: 0 6px 12px rgba(0,0,0,0.2); text-align: center;
            max-width: 300px; margin: 5px auto 10px; animation: popIn 0.3s ease;
        }
        @keyframes popIn { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .order-card {
            background: white; border-radius: 20px; padding: 15px 20px;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15); margin-bottom: 10px;
            border: 3px dashed #f9a825; animation: glow 1.5s infinite alternate; width: 100%;
        }
        @keyframes glow { from { border-color: #f9a825; } to { border-color: #ff6f00; } }
        .order-icons { font-size: 3rem; }
        .order-question {
            font-weight: bold; font-size: 1.1rem; text-align: center; color: #3e2723;
            background: #fff3e0; padding: 10px 15px; border-radius: 15px; width: 100%;
        }
        .tray-label { font-weight: bold; color: #5d4037; margin: 8px 0 5px; font-size: 0.9rem; }
        .payment-tray {
            background: #8d6e63; border-radius: 20px; padding: 12px; min-height: 60px;
            width: 100%; display: flex; align-items: center; justify-content: center;
            flex-wrap: wrap; gap: 8px; margin-bottom: 5px; border: 3px solid #5d4037;
        }
        .tray-item {
            font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 4px;
            animation: dropIn 0.3s ease;
        }
        .tray-coin {
            background: #ffecb3; color: #5d4037; border-radius: 50%;
            width: 40px; height: 40px; justify-content: center; font-size: 0.8rem;
            border: 2px solid #f9a825; font-weight: bold;
        }
        .tray-bill {
            background: #c8e6c9; color: #1b5e20; border-radius: 8px; padding: 5px 10px;
            border: 2px solid #388e3c; font-size: 0.85rem;
        }
        @keyframes dropIn { from { transform: translateY(-30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .total-display { margin-left: auto; font-size: 1.3rem; color: white; font-weight: bold; }
        .wallet-label {
            font-weight: bold; color: #5d4037; margin: 8px 0 5px; font-size: 0.9rem;
            display: flex; align-items: center; gap: 5px;
        }
        .finger { font-size: 1.3rem; animation: pointDown 0.6s infinite alternate; }
        @keyframes pointDown { from { transform: translateY(0); } to { transform: translateY(8px); } }
        .wallet { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }

        .money-card {
            cursor: pointer;
            box-shadow: 0 5px 12px rgba(0,0,0,0.3);
            transition: 0.2s;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .money-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        .money-card:active { transform: scale(0.92); }

        .coin-card {
            width: 72px; height: 72px; border-radius: 50%;
        }
        .coin-card .coin-inner {
            width: 100%; height: 100%; border-radius: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative;
        }
        .coin-card .coin-value {
            font-size: 1.2rem; font-weight: bold; color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5); z-index: 1; line-height: 1;
        }
        .coin-card .coin-currency {
            font-size: 0.55rem; font-weight: bold; color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.4); z-index: 1;
        }
        .coin-card .coin-label {
            font-size: 0.5rem; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.5);
            text-align: center; z-index: 1; line-height: 1.1; padding: 0 4px;
            white-space: pre-line; max-width: 60px;
        }
        .coin-card .coin-rim {
            position: absolute; inset: 4px; border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.4); z-index: 0; pointer-events: none;
        }
        .coin-card.copper .coin-inner { background: linear-gradient(140deg, #b87333, #da8a67); }
        .coin-card.silver .coin-inner { background: linear-gradient(140deg, #9e9e9e, #bdbdbd); }
        .coin-card.gold   .coin-inner { background: linear-gradient(140deg, #f9a825, #ffcc02); }

        .bill-card {
            width: 90px; height: 120px; border-radius: 10px;
        }
        .bill-card .bill-inner {
            width: 100%; height: 100%; border-radius: 10px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative;
        }
        .bill-card .bill-bg {
            position: absolute; inset: 0; opacity: 0.12; border-radius: 10px;
            background: repeating-linear-gradient(0deg, transparent, transparent 5px,
                rgba(255,255,255,0.3) 5px, rgba(255,255,255,0.3) 7px);
            pointer-events: none;
        }
        .bill-card .bill-icon { font-size: 2rem; z-index: 1; margin-top: 2px; }
        .bill-card .bill-value {
            font-size: 1.4rem; font-weight: bold; color: #fff;
            text-shadow: 0 2px 3px rgba(0,0,0,0.5); z-index: 1;
            background: rgba(0,0,0,0.2); padding: 1px 8px; border-radius: 10px;
        }
        .bill-card .bill-currency {
            font-size: 0.7rem; font-weight: bold; color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.4); z-index: 1;
        }
        .bill-card .bill-label {
            font-size: 0.6rem; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.6);
            text-align: center; z-index: 1; line-height: 1.2; padding: 2px 5px;
            white-space: pre-line; word-break: break-word; max-width: 80px;
        }
        .bill-card.orange .bill-inner { background: linear-gradient(140deg, #f57c00, #ffb74d); }
        .bill-card.brown  .bill-inner { background: linear-gradient(140deg, #8d6e63, #bcaaa4); }
        .bill-card.green  .bill-inner { background: linear-gradient(140deg, #388e3c, #81c784); }
        .bill-card.blue   .bill-inner { background: linear-gradient(140deg, #1565c0, #64b5f6); }
        .bill-card.purple .bill-inner { background: linear-gradient(140deg, #6a1b9a, #ce93d8); }

        .btn-row { display: flex; gap: 12px; margin-top: 8px; }
        .btn {
            border: none; border-radius: 25px; padding: 12px 25px;
            font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.3s;
        }
        .btn.clear { background: #bdbdbd; color: #333; }
        .btn.pay { background: #f9a825; color: #3e2723; }
        .feedback-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; align-items: center; justify-content: center;
            z-index: 100; font-size: 5rem; animation: fadeUp 0.8s ease forwards;
        }
        @keyframes fadeUp {
            0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; }
        }
        .win-screen { text-align: center; padding: 30px; }
        .message {
            text-align: center; font-weight: bold; font-size: 0.9rem; min-height: 24px;
        }
    </style>
</head>
<body>
<div class="game" id="gameContainer"></div>
<script>
    (function() {
        // 多语言文本：蒙古语 (mn)、英语 (en)、简体中文 (zh)
        const L = {
            mn: {
                have: "Байгаа: {n} ₮",
                goalShort: "Зорилго: {n}",
                story1: "Ээж өвчтэй. Эмнээ 50,000 ₮ хэрэгтэй! Би зах дээр очиж худалдаа хийх ёстой.",
                story2: "Гакур өвгөн надад бараа өгсөн. Ээждээ мөнгө олъё!",
                questionTotal: "{emoji} Үйлчлүүлэгч {qty} {item}-г нэг бүрийг {price} ₮-өөр авна.<br>➡️ <b>Нийт үнэ хэд вэ?</b>",
                questionChange: "{emoji} Үйлчлүүлэгч {paid} ₮ өгсөн, төлбөр {bill} ₮.<br>➡️ <b>Хэдийг буцааж өгөх вэ?</b>",
                walletLabel: "👆 Мөнгө дарж төлөх:",
                trayLabel: "Таны төлбөрийн тавиур:",
                pay: "✅ Төлөх",
                clear: "🗑 Цэвэрлэх",
                wrong: "❌ Буруу! Дахин тооцоол.",
                correct: "✅ Зөв! Сайн байна!",
                win: "Би хангалттай мөнгө оллоо! Ээж эмээ авна! 💊❤️ Баярлалаа!",
                playAgain: "🔄 Дахин тоглох",
                potato: "төмс",
                banana: "гадил",
                maize: "эрдэнэ шиш",
                coin10: "Арван төгрөг",
                coin20: "Хорь төгрөг",
                coin50: "Тавь төгрөг",
                coin100: "Зуун төгрөг",
                coin200: "Хоёр зуун төгрөг",
                coin500: "Таван зуун төгрөг",
                note1000: "Мянга төгрөг",
                note5000: "Таван мянга",
                note10000: "Арван мянга",
                note20000: "Хорин мянга"
            },
            en: {
                have: "Have: {n} ₮",
                goalShort: "Goal: {n}",
                story1: "Mom is sick. I need 50,000 ₮ for medicine! I must sell at the market.",
                story2: "Elder Gakuru gave me goods to sell. Let's earn money for Mom!",
                questionTotal: "{emoji} Customer buys {qty} {item} at {price} ₮ each.<br>➡️ <b>What is the total price?</b>",
                questionChange: "{emoji} Customer paid {paid} ₮ for a bill of {bill} ₮.<br>➡️ <b>How much change to give?</b>",
                walletLabel: "👆 Click money to pay:",
                trayLabel: "Your payment tray:",
                pay: "✅ Pay",
                clear: "🗑 Clear",
                wrong: "❌ Incorrect! Calculate again.",
                correct: "✅ Correct! Well done!",
                win: "I saved enough! Mom gets her medicine! 💊❤️ Thank you!",
                playAgain: "🔄 Play Again",
                potato: "potatoes",
                banana: "bananas",
                maize: "maize",
                coin10: "Ten Tögrög",
                coin20: "Twenty Tögrög",
                coin50: "Fifty Tögrög",
                coin100: "Hundred Tögrög",
                coin200: "Two Hundred Tögrög",
                coin500: "Five Hundred Tögrög",
                note1000: "Thousand Tögrög",
                note5000: "Five Thousand",
                note10000: "Ten Thousand",
                note20000: "Twenty Thousand"
            },
            zh: {
                have: "拥有: {n} ₮",
                goalShort: "目标: {n}",
                story1: "妈妈生病了，我需要50,000₮买药！我必须去市场卖东西。",
                story2: "长者加库鲁给了我一些货物，让我们为妈妈赚钱吧！",
                questionTotal: "{emoji} 顾客购买 {qty} 个{item}，单价 {price} ₮。<br>➡️ <b>总价是多少？</b>",
                questionChange: "{emoji} 顾客支付了 {paid} ₮，账单为 {bill} ₮。<br>➡️ <b>应找零多少？</b>",
                walletLabel: "👆 点击货币支付：",
                trayLabel: "你的付款托盘：",
                pay: "✅ 支付",
                clear: "🗑 清空",
                wrong: "❌ 错误！再算一遍。",
                correct: "✅ 正确！做得好！",
                win: "我攒够钱了！妈妈有药了！💊❤️ 谢谢！",
                playAgain: "🔄 再玩一次",
                potato: "土豆",
                banana: "香蕉",
                maize: "玉米",
                coin10: "十图格里克",
                coin20: "二十图格里克",
                coin50: "五十图格里克",
                coin100: "一百图格里克",
                coin200: "二百图格里克",
                coin500: "五百图格里克",
                note1000: "一千图格里克",
                note5000: "五千图格里克",
                note10000: "一万图格里克",
                note20000: "两万图格里克"
            }
        };

        // 蒙古货币：硬币和纸币
        const COINS = [
            { value: 10,  material: 'copper', key: 'coin10' },
            { value: 20,  material: 'copper', key: 'coin20' },
            { value: 50,  material: 'silver', key: 'coin50' },
            { value: 100, material: 'silver', key: 'coin100' },
            { value: 200, material: 'gold',   key: 'coin200' },
            { value: 500, material: 'gold',   key: 'coin500' }
        ];

        const BILLS = [
            { value: 1000,  color: 'orange', icon: '🐎', key: 'note1000' },
            { value: 5000,  color: 'brown',  icon: '🏔️', key: 'note5000' },
            { value: 10000, color: 'green',  icon: '🏛️', key: 'note10000' },
            { value: 20000, color: 'purple', icon: '🦅', key: 'note20000' }
        ];

        const ALL_MONEY = [...COINS, ...BILLS];

        const GOAL = 50000;   // 需要50000图格里克买药
        const START_MONEY = 20000;  // 起始资金
        const PRODUCTS = [
            { id: 'potato', emoji: '🥔', basePrice: 6000 },
            { id: 'banana', emoji: '🍌', basePrice: 4000 },
            { id: 'maize',  emoji: '🌽', basePrice: 5000 }
        ];

        let lang = 'mn'; // 默认蒙古语
        let money = START_MONEY;
        let phase = 'intro';
        let problem = null;
        let tray = [];
        let message = '';

        function t(key, vars={}) {
            let s = L[lang][key] || key;
            for (let v in vars) s = s.replace(`{${v}}`, vars[v]);
            return s;
        }
        function fmt(n) { return n.toLocaleString('en'); }
        function rand(min,max) { return Math.floor(Math.random()*(max-min+1))+min; }

        function newProblem() {
            const prod = PRODUCTS[Math.floor(Math.random()*PRODUCTS.length)];
            const qty = rand(2, 8);
            // 单价 = 基础价 + 随机 0~5 * 1000，保证是10的倍数
            const price = prod.basePrice + rand(0, 5) * 1000;
            const total = qty * price;
            const type = Math.random() < 0.5 ? 'total' : 'change';
            if (type === 'total') {
                problem = { type:'total', total, item:prod.id, qty, price, emoji:prod.emoji };
            } else {
                // 支付金额比总价多 1~10 * 1000
                const paid = total + rand(1, 10) * 1000;
                problem = { type:'change', total, paid, change:paid-total, item:prod.id, qty, price, emoji:prod.emoji };
            }
            tray = [];
            message = '';
        }

        function target() { return problem ? (problem.type==='total'?problem.total:problem.change) : 0; }
        function traySum() { return tray.reduce((a,b)=>a+b,0); }

        function addMoney(v) { tray.push(v); message = ''; render(); }
        function removeMoney(i) { tray.splice(i,1); message = ''; render(); }
        function clearTray() { tray = []; message = ''; render(); }

        function submit() {
            const sum = traySum();
            const tgt = target();
            if (sum !== tgt) {
                message = t('wrong');
                render();
                return;
            }
            // 正确，获得收入
            money += (problem.type==='total' ? problem.total : 0) + 1000;
            showFeedback('✅🎉');
            if (money >= GOAL) {
                phase = 'win';
            } else {
                problem = null;
                message = '';
            }
            render();
        }

        function showFeedback(icon) {
            const el = document.createElement('div');
            el.className = 'feedback-overlay';
            el.textContent = icon;
            document.body.appendChild(el);
            setTimeout(()=>el.remove(), 800);
        }

        function isCoin(v) { return COINS.some(c => c.value === v); }

        function render() {
            const container = document.getElementById('gameContainer');
            const progress = Math.min(100, Math.round((money/GOAL)*100));
            let h = '';
            h += `<div class="top-bar">
                <span>💰 ${t('have',{n:fmt(money)})}</span>
                <div class="goal-bar"><div class="goal-fill" style="width:${progress}%"></div></div>
                <span>🎯 ${t('goalShort',{n:fmt(GOAL)})}</span>
                <div class="lang-switch">
                    <button class="lang-btn ${lang==='mn'?'active':''}" id="setMN">Мон</button>
                    <button class="lang-btn ${lang==='en'?'active':''}" id="setEN">En</button>
                    <button class="lang-btn ${lang==='zh'?'active':''}" id="setZH">中文</button>
                </div>
            </div>`;
            h += `<div class="scene">`;

            if (phase === 'intro') {
                h += `<div class="characters"><div class="char mugisha">🧑‍🌾</div><div class="char">👩🤒</div></div>`;
                h += `<div class="bubble">${t('story1')}</div>`;
                h += `<button class="btn" style="background:#f9a825;margin-top:15px;" id="nextStory">▶️ ${lang==='en'?'Next': (lang==='mn'?'Үргэлжлүүлэх':'继续')}</button>`;
            } else if (phase === 'story2') {
                h += `<div class="characters"><div class="char mugisha">🧑‍🌾</div><div class="char">👴</div></div>`;
                h += `<div class="bubble">${t('story2')}</div>`;
                h += `<button class="btn" style="background:#f9a825;margin-top:15px;" id="goMarket">🥔 ${lang==='en'?'Go to Market': (lang==='mn'?'Зах руу явах':'去市场')}</button>`;
            } else if (phase === 'market') {
                if (!problem) newProblem();
                const p = problem;
                const sum = traySum();
                h += `<div class="order-card">`;
                h += `<div class="order-icons">${p.emoji}</div>`;
                if (p.type === 'total') {
                    h += `<div class="order-question">${t('questionTotal',{emoji:p.emoji, qty:p.qty, item:t(p.item), price:fmt(p.price)})}</div>`;
                } else {
                    h += `<div class="order-question">${t('questionChange',{emoji:p.emoji, paid:fmt(p.paid), bill:fmt(p.total)})}</div>`;
                }
                h += `</div>`;
                h += `<div class="tray-label">${t('trayLabel')}</div>`;
                h += `<div class="payment-tray">`;
                tray.forEach((v,i) => {
                    if (isCoin(v)) {
                        h += `<div class="tray-item tray-coin" data-idx="${i}">${v}</div>`;
                    } else {
                        h += `<div class="tray-item tray-bill" data-idx="${i}">₮ ${v} ✕</div>`;
                    }
                });
                h += `<span class="total-display">= ${fmt(sum)} ₮</span>`;
                h += `</div>`;
                h += `<div class="message" style="color:#ef5350;">${message}</div>`;
                h += `<div class="wallet-label"><span class="finger">👇</span> ${t('walletLabel')}</div>`;
                h += `<div class="wallet">`;
                ALL_MONEY.forEach(m => {
                    if (m.type === 'coin' || COINS.includes(m)) {
                        // 硬币渲染
                        const coin = COINS.find(c => c.value === m.value) || m;
                        h += `<div class="money-card coin-card ${coin.material}" data-val="${coin.value}">
                            <div class="coin-inner">
                                <div class="coin-rim"></div>
                                <div class="coin-value">${coin.value}</div>
                                <div class="coin-currency">₮</div>
                                <div class="coin-label">${t(coin.key)}</div>
                            </div>
                        </div>`;
                    } else {
                        const bill = BILLS.find(b => b.value === m.value) || m;
                        h += `<div class="money-card bill-card ${bill.color}" data-val="${bill.value}">
                            <div class="bill-inner">
                                <div class="bill-bg"></div>
                                <div class="bill-icon">${bill.icon}</div>
                                <div class="bill-value">${bill.value}</div>
                                <div class="bill-currency">₮</div>
                                <div class="bill-label">${t(bill.key)}</div>
                            </div>
                        </div>`;
                    }
                });
                h += `</div>`;
                h += `<div class="btn-row">
                    <button class="btn clear" id="clearBtn">${t('clear')}</button>
                    <button class="btn pay" id="payBtn">${t('pay')}</button>
                </div>`;
            } else if (phase === 'win') {
                h += `<div class="win-screen">
                    <div style="font-size:6rem;">🧑‍🌾💊❤️</div>
                    <div class="bubble" style="margin:20px auto;">${t('win')}</div>
                    <button class="btn" style="background:#f9a825;margin-top:15px;" id="resetBtn">${t('playAgain')}</button>
                </div>`;
            }
            h += `</div>`;
            container.innerHTML = h;

            document.getElementById('setMN')?.addEventListener('click', ()=>{ lang='mn'; render(); });
            document.getElementById('setEN')?.addEventListener('click', ()=>{ lang='en'; render(); });
            document.getElementById('setZH')?.addEventListener('click', ()=>{ lang='zh'; render(); });
            document.getElementById('nextStory')?.addEventListener('click', ()=>{ phase='story2'; render(); });
            document.getElementById('goMarket')?.addEventListener('click', ()=>{ phase='market'; problem=null; render(); });
            if (phase==='market') {
                document.querySelectorAll('.money-card').forEach(card => {
                    card.addEventListener('click', ()=>{ addMoney(parseInt(card.dataset.val)); });
                });
                document.querySelectorAll('.tray-item').forEach((item,i) => {
                    item.addEventListener('click', (e)=>{ e.stopPropagation(); removeMoney(i); });
                });
                document.getElementById('clearBtn')?.addEventListener('click', clearTray);
                document.getElementById('payBtn')?.addEventListener('click', submit);
            }
            document.getElementById('resetBtn')?.addEventListener('click', ()=>{ money=START_MONEY; phase='intro'; problem=null; tray=[]; message=''; render(); });
        }

        render();
    })();
</script>
</body>
</html>
