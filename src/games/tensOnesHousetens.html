<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tens &amp; Ones House 🏠</title>
<style>
/* ================================================================
   RESET & BASE
================================================================ */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0; padding: 0;
  -webkit-tap-highlight-color: transparent;
}
html { height: 100%; }
body {
  height: 100%;
  background: #fff8e1;
  font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif;
  overflow: hidden;
  touch-action: manipulation;
}

/* ================================================================
   APP SHELL
================================================================ */
#app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 700px;
  margin: 0 auto;
  padding: 8px 10px 10px;
  gap: 7px;
}

/* ================================================================
   HEADER
================================================================ */
#header {
  flex-shrink: 0;
  background: linear-gradient(135deg, #5d4037 0%, #8d6e63 100%);
  border-radius: 18px;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 4px 14px rgba(93,64,55,0.38);
}
.game-title {
  font-size: clamp(0.92rem, 3.8vw, 1.38rem);
  font-weight: 900;
  color: #fff8e1;
  text-shadow: 0 2px 5px rgba(0,0,0,0.32);
  white-space: nowrap;
}
#scoreBadge {
  background: linear-gradient(135deg, #ffd54f, #ffb300);
  color: #5d4037;
  font-size: clamp(0.92rem, 3.6vw, 1.28rem);
  font-weight: 900;
  padding: 5px 16px;
  border-radius: 50px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.22);
  min-width: 80px;
  text-align: center;
  white-space: nowrap;
}
#scoreBadge.bump {
  animation: scoreBump 0.40s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes scoreBump {
  0%,100% { transform: scale(1.00); }
  50%     { transform: scale(1.48); }
}

/* ================================================================
   TARGET NUMBER DISPLAY
================================================================ */
#targetSection {
  flex-shrink: 0;
  background: linear-gradient(135deg, #ff8f00 0%, #ffa000 55%, #ffb300 100%);
  border-radius: 20px;
  padding: 9px 20px 11px;
  text-align: center;
  box-shadow: 0 5px 18px rgba(255,143,0,0.40);
  position: relative;
  overflow: hidden;
}
/* Watermark house emojis */
#targetSection::before {
  content: '🏠';
  position: absolute;
  top: 50%; left: 2%;
  transform: translateY(-50%);
  font-size: clamp(2.2rem, 9vw, 3.8rem);
  opacity: 0.13;
  pointer-events: none;
}
#targetSection::after {
  content: '🌿';
  position: absolute;
  top: 50%; right: 2%;
  transform: translateY(-50%);
  font-size: clamp(2.2rem, 9vw, 3.8rem);
  opacity: 0.13;
  pointer-events: none;
}
.target-label {
  display: block;
  font-size: clamp(0.82rem, 3.3vw, 1.12rem);
  font-weight: 800;
  color: rgba(255,255,255,0.92);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  text-shadow: 0 1px 4px rgba(0,0,0,0.18);
}
#targetNumber {
  display: block;
  font-size: clamp(3.0rem, 13vw, 5.2rem);
  font-weight: 900;
  color: #fff;
  line-height: 1.05;
  text-shadow: 0 3px 10px rgba(0,0,0,0.22);
}
#targetNumber.pop {
  animation: numPop 0.38s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes numPop {
  0%   { transform: scale(0.35); opacity: 0.2; }
  100% { transform: scale(1.00); opacity: 1.0; }
}

/* ================================================================
   HOUSES SECTION
================================================================ */
#housesSection {
  flex: 1;
  display: flex;
  gap: 10px;
  min-height: 0;  /* allow flex child to shrink */
}

.house {
  flex: 1;
  border-radius: 22px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 6px 22px rgba(0,0,0,0.14);
  position: relative;
  min-height: 0;
}

/* ── TENS house (warm amber/orange) ── */
.house-tens {
  background: #fff3e0;
  border: 3.5px solid #e65100;
}
.house-tens .house-roof {
  background: linear-gradient(135deg, #e65100 0%, #f4511e 100%);
}
.house-tens .house-count {
  background: linear-gradient(135deg, #ffe0b2, #ffcc80);
  color: #bf360c;
  border: 2.5px solid #ffab40;
}

/* ── ONES house (soft leaf green) ── */
.house-ones {
  background: #f1f8e9;
  border: 3.5px solid #558b2f;
}
.house-ones .house-roof {
  background: linear-gradient(135deg, #558b2f 0%, #7cb342 100%);
}
.house-ones .house-count {
  background: linear-gradient(135deg, #dcedc8, #c5e1a5);
  color: #33691e;
  border: 2.5px solid #8bc34a;
}

/* ── Roof header bar ── */
.house-roof {
  flex-shrink: 0;
  padding: 8px 6px 7px;
  text-align: center;
  /* Triangle "peak" via bottom CSS border to simulate a roof */
  position: relative;
}
/* Decorative ridge line at the very top */
.house-roof::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: rgba(255,255,255,0.28);
  border-radius: 22px 22px 0 0;
}
.house-label {
  display: block;
  font-size: clamp(1.05rem, 4.3vw, 1.55rem);
  font-weight: 900;
  color: #fff;
  letter-spacing: 0.07em;
  text-shadow: 0 1px 5px rgba(0,0,0,0.26);
}
.house-sublabel {
  display: block;
  font-size: clamp(0.53rem, 2.05vw, 0.74rem);
  font-weight: 700;
  color: rgba(255,255,255,0.88);
  margin-top: 2px;
  letter-spacing: 0.03em;
}

/* ── Interior content area ── */
.house-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 7px 6px 7px;
  min-height: 0;
  gap: 5px;
}

/* ── Emoji grid (wrapping flex) ── */
.emoji-grid {
  flex: 1;
  width: 100%;
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  align-content: flex-start;
  justify-content: center;
  overflow-y: auto;
  scrollbar-width: none;
  padding: 2px 0;
  min-height: 0;
}
.emoji-grid::-webkit-scrollbar { display: none; }

/* Each emoji spawns with a bounce pop */
.stick-emoji {
  font-size: clamp(1.6rem, 6.0vw, 2.25rem);
  line-height: 1;
  display: inline-block;
  user-select: none;
  -webkit-user-select: none;
  animation: popIn 0.28s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes popIn {
  0%   { transform: scale(0) rotate(-20deg); opacity: 0; }
  100% { transform: scale(1) rotate(  0deg); opacity: 1; }
}

/* ── Count badge (shown at house bottom) ── */
.house-count {
  flex-shrink: 0;
  font-size: clamp(1.28rem, 5.0vw, 1.85rem);
  font-weight: 900;
  padding: 4px 16px;
  border-radius: 30px;
  min-width: 56px;
  text-align: center;
  box-shadow: 0 2px 7px rgba(0,0,0,0.12);
  transition: transform 0.18s cubic-bezier(0.34,1.56,0.64,1);
}
.house-count.bump {
  animation: countBump 0.30s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes countBump {
  0%,100% { transform: scale(1.00); }
  50%     { transform: scale(1.45); }
}

/* ── House animation states ── */
.house.shake {
  animation: houseShake 0.52s ease both;
}
@keyframes houseShake {
  0%,100% { transform: translateX( 0px); }
  12%     { transform: translateX(-12px); }
  26%     { transform: translateX( 12px); }
  40%     { transform: translateX( -8px); }
  55%     { transform: translateX(  8px); }
  70%     { transform: translateX( -4px); }
  85%     { transform: translateX(  4px); }
}
.house.win-pulse {
  animation: winPulse 0.60s ease both;
}
@keyframes winPulse {
  0%,100% { transform: scale(1.00); }
  50%     { transform: scale(1.07);
            filter: brightness(1.18)
            drop-shadow(0 0 16px rgba(90,220,90,0.65)); }
}

/* ================================================================
   ADD BUTTONS  (+10 Bundle | +1 Stick)
================================================================ */
#addButtons {
  flex-shrink: 0;
  display: flex;
  gap: 9px;
}
.add-btn {
  flex: 1;
  min-height: 67px;
  border: none;
  border-radius: 18px;
  font-size: clamp(0.90rem, 3.55vw, 1.20rem);
  font-weight: 900;
  color: #fff;
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  letter-spacing: 0.01em;
  position: relative;
  overflow: hidden;
  box-shadow: 0 5px 0 rgba(0,0,0,0.23), 0 8px 20px rgba(0,0,0,0.13);
  transition: transform 0.08s ease, box-shadow 0.08s ease;
}
/* Glass highlight sheen */
.add-btn::before {
  content: '';
  position: absolute;
  inset: 0 0 52% 0;
  background: rgba(255,255,255,0.21);
  border-radius: 16px 16px 0 0;
  pointer-events: none;
}
.add-btn:active:not(:disabled) {
  transform: translateY(4px);
  box-shadow: 0 1px 0 rgba(0,0,0,0.23);
}
.add-btn:disabled { opacity: 0.40; pointer-events: none; }

#btnAddTen {
  background: linear-gradient(158deg, #ff8f00 0%, #e65100 100%);
}
#btnAddOne {
  background: linear-gradient(158deg, #7cb342 0%, #558b2f 100%);
}

/* ================================================================
   CONTROL BUTTONS  (Clear | Check)
================================================================ */
#controlButtons {
  flex-shrink: 0;
  display: flex;
  gap: 9px;
  padding-bottom: env(safe-area-inset-bottom, 2px);
}
.ctrl-btn {
  flex: 1;
  min-height: 67px;
  border: none;
  border-radius: 18px;
  font-size: clamp(1.00rem, 3.9vw, 1.30rem);
  font-weight: 900;
  color: #fff;
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  position: relative;
  overflow: hidden;
  box-shadow: 0 5px 0 rgba(0,0,0,0.23), 0 8px 20px rgba(0,0,0,0.12);
  transition: transform 0.08s ease, box-shadow 0.08s ease;
}
.ctrl-btn::before {
  content: '';
  position: absolute;
  inset: 0 0 52% 0;
  background: rgba(255,255,255,0.19);
  border-radius: 16px 16px 0 0;
  pointer-events: none;
}
.ctrl-btn:active:not(:disabled) {
  transform: translateY(4px);
  box-shadow: 0 1px 0 rgba(0,0,0,0.23);
}
.ctrl-btn:disabled { opacity: 0.38; pointer-events: none; }

#btnClear {
  background: linear-gradient(158deg, #ef5350 0%, #b71c1c 100%);
}
#btnCheck {
  background: linear-gradient(158deg, #43a047 0%, #1b5e20 100%);
}

/* ================================================================
   FEEDBACK TOAST  (slides up from below buttons on wrong answer)
================================================================ */
#feedbackBanner {
  position: fixed;
  bottom: -90px;
  left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(135deg, #e53935, #b71c1c);
  color: #fff;
  font-size: clamp(1.02rem, 4.1vw, 1.38rem);
  font-weight: 900;
  padding: 13px 28px;
  border-radius: 50px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.28);
  z-index: 200;
  white-space: nowrap;
  pointer-events: none;
  transition: bottom 0.32s cubic-bezier(0.34,1.56,0.64,1);
}
#feedbackBanner.visible {
  /* Sits above button rows (~67+9+67+10 = ~153px from bottom) */
  bottom: 168px;
}

/* ================================================================
   WIN MESSAGE (centred on screen, fades in/out)
================================================================ */
#winMsg {
  position: fixed;
  top: 45%; left: 50%;
  transform: translate(-50%, -50%) scale(0.2);
  font-size: clamp(2.4rem, 10vw, 4.4rem);
  font-weight: 900;
  color: #fff;
  text-align: center;
  white-space: nowrap;
  text-shadow:
    0 0 28px rgba(255,200,0,0.85),
    0 3px 12px rgba(0,0,0,0.35);
  pointer-events: none;
  z-index: 500;
  opacity: 0;
  transition:
    opacity 0.30s ease,
    transform 0.36s cubic-bezier(0.34,1.56,0.64,1);
}
#winMsg.show {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

/* ================================================================
   FLYING STAR PARTICLES  (created dynamically by JS)
================================================================ */
.fly-star {
  position: fixed;
  pointer-events: none;
  z-index: 999;
  /* base centre point — translate in CSS vars via JS inline style */
  transform: translate(-50%, -50%);
  animation: flyOut 1.35s ease-out forwards;
}
@keyframes flyOut {
  0%  { opacity: 1;
        transform: translate(-50%,-50%) scale(0.3) rotate(0deg); }
  42% { opacity: 1;
        transform: translate(
          calc(-50% + var(--tx, 0px)),
          calc(-50% + var(--ty, 0px))
        ) scale(1.35) rotate(160deg); }
  100%{ opacity: 0;
        transform: translate(
          calc(-50% + var(--tx2, 0px)),
          calc(-50% + var(--ty2, 0px))
        ) scale(0.65) rotate(350deg); }
}

/* ================================================================
   DECOMPOSITION HINT (shown briefly on correct answer)
================================================================ */
#decompHint {
  position: fixed;
  top: -70px;
  left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(135deg, #1b5e20, #388e3c);
  color: #fff;
  font-size: clamp(0.98rem, 3.9vw, 1.32rem);
  font-weight: 900;
  padding: 11px 24px;
  border-radius: 50px;
  box-shadow: 0 5px 18px rgba(0,0,0,0.28);
  z-index: 200;
  white-space: nowrap;
  pointer-events: none;
  transition: top 0.35s cubic-bezier(0.34,1.56,0.64,1);
}
#decompHint.visible {
  top: 14px; /* drops just below the very top edge */
}
</style>

<body>

<div id="app">

  <!-- ════════════════ HEADER ════════════════ -->
  <div id="header">
    <div class="game-title">🏠 Tens &amp; Ones House</div>
    <div id="scoreBadge">⭐ Score: 0</div>
  </div>

  <!-- ════════════════ TARGET NUMBER ════════════════ -->
  <div id="targetSection">
    <span class="target-label">Make the number:</span>
    <span id="targetNumber">35</span>
  </div>

  <!-- ════════════════ THE TWO HOUSES ════════════════ -->
  <div id="housesSection">

    <!-- TENS House -->
    <div class="house house-tens" id="houseTens">
      <div class="house-roof">
        <span class="house-label">TENS</span>
        <span class="house-sublabel">bundles of 10</span>
      </div>
      <div class="house-content">
        <div class="emoji-grid" id="tensGrid"></div>
        <div class="house-count" id="tensCount">0</div>
      </div>
    </div>

    <!-- ONES House -->
    <div class="house house-ones" id="houseOnes">
      <div class="house-roof">
        <span class="house-label">ONES</span>
        <span class="house-sublabel">single sticks</span>
      </div>
      <div class="house-content">
        <div class="emoji-grid" id="onesGrid"></div>
        <div class="house-count" id="onesCount">0</div>
      </div>
    </div>

  </div><!-- /#housesSection -->

  <!-- ════════════════ ADD BUTTONS ════════════════ -->
  <div id="addButtons">
    <button class="add-btn" id="btnAddTen" type="button">+10 Bundle 🪵</button>
    <button class="add-btn" id="btnAddOne" type="button">+1 Stick 🥢</button>
  </div>

  <!-- ════════════════ CONTROL BUTTONS ════════════════ -->
  <div id="controlButtons">
    <button class="ctrl-btn" id="btnClear" type="button">↩️ Clear</button>
    <button class="ctrl-btn" id="btnCheck" type="button">✅ Check!</button>
  </div>

</div><!-- /#app -->

<!-- Feedback & celebration UI (outside #app so they overlay freely) -->
<div id="feedbackBanner">❌ Try again!</div>
<div id="decompHint"></div>
<div id="winMsg">⭐ Well Done! ⭐</div>

<script>
'use strict';

/* ================================================================
   GAME STATE
================================================================ */
let score        = 0;
let tensCount    = 0;
let onesCount    = 0;
let targetNumber = 0;
let inputEnabled = true;   // false while winning animation plays

const MAX_TENS = 9;  // max 9 bundles  (9 × 10 = 90)
const MAX_ONES = 9;  // max 9 sticks   (9 × 1  =  9)

/* ================================================================
   WEB AUDIO API — 100 % synthesized, zero external files
================================================================ */
let _aCtx = null;

/** Lazily creates and auto-resumes the AudioContext. */
function getACtx() {
  if (!_aCtx) _aCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (_aCtx.state === 'suspended') _aCtx.resume();
  return _aCtx;
}

/* ── Light wood CLICK — placing a single stick ─────────────── */
function playWoodClick() {
  try {
    const ctx = getACtx();
    const now = ctx.currentTime;
    const dur = 0.055;
    const len = Math.ceil(ctx.sampleRate * dur);

    /* Very short noise burst with rapid decay */
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const dat = buf.getChannelData(0);
    for (let i = 0; i < len; i++) {
      dat[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 5.2);
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;

    /* Bandpass @ 1100 Hz gives a bright tap quality */
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 1100;
    bp.Q.value = 2.8;

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.52, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur + 0.01);

    src.connect(bp); bp.connect(g); g.connect(ctx.destination);
    src.start(now); src.stop(now + dur + 0.02);
  } catch(e) {}
}

/* ── Heavy THUD — placing a 10-bundle ──────────────────────── */
function playThud() {
  try {
    const ctx = getACtx();
    const now = ctx.currentTime;
    const dur = 0.095;
    const len = Math.ceil(ctx.sampleRate * dur);

    /* Slightly longer noise with slower decay = heavier feel */
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const dat = buf.getChannelData(0);
    for (let i = 0; i < len; i++) {
      dat[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.0);
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;

    /* Low bandpass @ 360 Hz = deep wooden knock */
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 360;
    bp.Q.value = 2.0;

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.65, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur + 0.02);

    src.connect(bp); bp.connect(g); g.connect(ctx.destination);
    src.start(now); src.stop(now + dur + 0.04);
  } catch(e) {}
}

/* ── SUCCESS CHIME — correct answer ────────────────────────── */
function playSuccess() {
  try {
    const ctx = getACtx();
    const now = ctx.currentTime;

    /* Warm triangle-oscillator arpeggio: C5 E5 G5 C6 */
    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
      const t  = now + i * 0.135;
      const os = ctx.createOscillator();
      const gn = ctx.createGain();
      os.connect(gn); gn.connect(ctx.destination);
      os.type = 'triangle';
      os.frequency.value = freq;
      gn.gain.setValueAtTime(0,    t);
      gn.gain.linearRampToValueAtTime(0.27, t + 0.018);
      gn.gain.exponentialRampToValueAtTime(0.001, t + 0.54);
      os.start(t); os.stop(t + 0.58);
    });

    /* Warm sine bass C3 swells under the final high note */
    const bas = ctx.createOscillator();
    const bg  = ctx.createGain();
    bas.connect(bg); bg.connect(ctx.destination);
    bas.type = 'sine';
    bas.frequency.value = 130.81;
    bg.gain.setValueAtTime(0,    now + 0.40);
    bg.gain.linearRampToValueAtTime(0.13, now + 0.42);
    bg.gain.exponentialRampToValueAtTime(0.001, now + 1.18);
    bas.start(now + 0.40); bas.stop(now + 1.22);
  } catch(e) {}
}

/* ── ERROR BUZZ — wrong answer ──────────────────────────────── */
function playBuzz() {
  try {
    const ctx = getACtx();
    const now = ctx.currentTime;

    /* Descending sawtooth "bwonk" */
    const os = ctx.createOscillator();
    const gn = ctx.createGain();
    os.connect(gn); gn.connect(ctx.destination);
    os.type = 'sawtooth';
    os.frequency.setValueAtTime(148, now);
    os.frequency.exponentialRampToValueAtTime(88, now + 0.30);
    gn.gain.setValueAtTime(0.26, now);
    gn.gain.exponentialRampToValueAtTime(0.001, now + 0.30);
    os.start(now); os.stop(now + 0.33);
  } catch(e) {}
}

/* ── MAX LIMIT BUMP — gentle clink when house is full ───────── */
function playMaxClink() {
  try {
    const ctx = getACtx();
    const now = ctx.currentTime;
    const os  = ctx.createOscillator();
    const gn  = ctx.createGain();
    os.connect(gn); gn.connect(ctx.destination);
    os.type = 'sine';
    os.frequency.value = 920;
    gn.gain.setValueAtTime(0.18, now);
    gn.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    os.start(now); os.stop(now + 0.18);
  } catch(e) {}
}

/* ================================================================
   DOM HELPERS
================================================================ */

/**
 * Appends one emoji span to a grid element (does NOT re-render all).
 * Each span gets its own popIn animation via the .stick-emoji class.
 */
function appendEmoji(gridId, glyph) {
  const grid = document.getElementById(gridId);
  const s    = document.createElement('span');
  s.className   = 'stick-emoji';
  s.textContent = glyph;
  grid.appendChild(s);
}

/** Empties a grid and updates its count badge. */
function clearGrid(gridId, countId) {
  document.getElementById(gridId).innerHTML     = '';
  const cEl = document.getElementById(countId);
  cEl.textContent = '0';
}

/** Updates and animates a count badge. */
function bumpCount(countId, value) {
  const el = document.getElementById(countId);
  el.textContent = value;
  el.classList.remove('bump');
  void el.offsetWidth;  /* force reflow to restart animation */
  el.classList.add('bump');
}

/** Triggers a CSS class briefly on an element (auto-removes). */
function flashClass(id, cls, durationMs) {
  const el = document.getElementById(id);
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), durationMs);
}

/* ================================================================
   GAME ACTIONS
================================================================ */

function addTen() {
  if (!inputEnabled) return;
  if (tensCount >= MAX_TENS) {
    /* House is full — gentle visual + audio feedback */
    flashClass('houseTens', 'shake', 520);
    playMaxClink();
    return;
  }
  tensCount++;
  appendEmoji('tensGrid', '🪵');
  bumpCount('tensCount', tensCount);
  playThud();
}

function addOne() {
  if (!inputEnabled) return;
  if (onesCount >= MAX_ONES) {
    flashClass('houseOnes', 'shake', 520);
    playMaxClink();
    return;
  }
  onesCount++;
  appendEmoji('onesGrid', '🥢');
  bumpCount('onesCount', onesCount);
  playWoodClick();
}

function clearBoard() {
  if (!inputEnabled) return;
  tensCount = 0;
  onesCount = 0;
  clearGrid('tensGrid', 'tensCount');
  clearGrid('onesGrid', 'onesCount');
  hideFeedback();
  hideDecomp();
}

function checkAnswer() {
  if (!inputEnabled) return;

  const tT = Math.floor(targetNumber / 10);  // expected tens
  const tO = targetNumber % 10;              // expected ones

  if (tensCount === tT && onesCount === tO) {
    /* ─────────────── ✅ CORRECT ───────────────── */
    inputEnabled = false;
    setAllButtons(true);
    hideFeedback();

    playSuccess();
    flashClass('houseTens', 'win-pulse', 680);
    flashClass('houseOnes', 'win-pulse', 680);

    /* Show decomposition hint  e.g.  "3 × 10 + 5 = 35" */
    showDecomp(tT, tO);
    showWinMsg();
    spawnStarBurst();

    setTimeout(() => {
      /* Increment and display score */
      score++;
      const sb = document.getElementById('scoreBadge');
      sb.textContent = '⭐ Score: ' + score;
      sb.classList.remove('bump');
      void sb.offsetWidth;
      sb.classList.add('bump');

      hideDecomp();
      newRound();
      inputEnabled = true;
      setAllButtons(false);
    }, 2100);

  } else {
    /* ─────────────── ❌ INCORRECT ─────────────── */
    playBuzz();
    /* Shake only the wrong house(s) */
    if (tensCount !== tT) flashClass('houseTens', 'shake', 520);
    if (onesCount !== tO) flashClass('houseOnes', 'shake', 520);
    showFeedback();
  }
}

/* ================================================================
   ROUND MANAGEMENT
================================================================ */

function newRound() {
  /* Generate a random 2-digit number 10 – 99 */
  targetNumber = Math.floor(Math.random() * 90) + 10;

  tensCount = 0;
  onesCount = 0;
  clearGrid('tensGrid', 'tensCount');
  clearGrid('onesGrid', 'onesCount');
  hideFeedback();
  hideDecomp();

  /* Animate the new number appearing */
  const numEl = document.getElementById('targetNumber');
  numEl.textContent = targetNumber;
  numEl.classList.remove('pop');
  void numEl.offsetWidth;
  numEl.classList.add('pop');
}

/* ================================================================
   FEEDBACK TOAST
================================================================ */
let _fbTimer = null;

function showFeedback() {
  const el = document.getElementById('feedbackBanner');
  el.classList.add('visible');
  clearTimeout(_fbTimer);
  _fbTimer = setTimeout(hideFeedback, 1700);
}
function hideFeedback() {
  document.getElementById('feedbackBanner').classList.remove('visible');
  clearTimeout(_fbTimer);
}

/* ================================================================
   DECOMPOSITION HINT BANNER
   e.g. "3 × 10  +  5  =  35"
================================================================ */
let _dcTimer = null;

function showDecomp(t, o) {
  const el   = document.getElementById('decompHint');
  const tens = t > 0 ? t + ' × 10' : '';
  const ones = o > 0 ? (t > 0 ? ' + ' + o : o) : '';
  el.textContent = tens + ones + ' = ' + targetNumber + ' ✅';
  el.classList.add('visible');
  clearTimeout(_dcTimer);
  _dcTimer = setTimeout(hideDecomp, 2000);
}
function hideDecomp() {
  document.getElementById('decompHint').classList.remove('visible');
  clearTimeout(_dcTimer);
}

/* ================================================================
   WIN MESSAGE OVERLAY
================================================================ */
function showWinMsg() {
  const el = document.getElementById('winMsg');
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1900);
}

/* ================================================================
   STAR BURST CELEBRATION
   Spawns 12 emoji stars that fly outward from the centre.
================================================================ */
function spawnStarBurst() {
  const GLYPHS = ['⭐', '✨', '🌟', '💛', '🎉'];
  for (let i = 0; i < 12; i++) {
    /* Stagger each star by 70 ms so they don't all start at once */
    setTimeout(() => {
      const el = document.createElement('div');
      el.className   = 'fly-star';
      el.textContent = GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
      el.style.fontSize = (1.5 + Math.random() * 1.7) + 'rem';

      /* Start position: roughly the centre of the target display */
      const cx = window.innerWidth  * 0.50 + (Math.random() - 0.5) * 70;
      const cy = window.innerHeight * 0.32 + (Math.random() - 0.5) * 50;
      el.style.left = cx + 'px';
      el.style.top  = cy + 'px';

      /* Random outward direction */
      const angle = Math.random() * Math.PI * 2;
      const dist  = 100 + Math.random() * 210;
      el.style.setProperty('--tx',  (Math.cos(angle) * dist * 0.45) + 'px');
      el.style.setProperty('--ty',  (Math.sin(angle) * dist * 0.45) + 'px');
      el.style.setProperty('--tx2', (Math.cos(angle) * dist)        + 'px');
      el.style.setProperty('--ty2', (Math.sin(angle) * dist)        + 'px');

      document.body.appendChild(el);
      /* Clean up DOM after animation ends */
      setTimeout(() => el.remove(), 1500);
    }, i * 70);
  }
}

/* ================================================================
   BUTTON STATE
================================================================ */
function setAllButtons(disabled) {
  ['btnAddTen', 'btnAddOne', 'btnClear', 'btnCheck'].forEach(id => {
    document.getElementById(id).disabled = disabled;
  });
}

/* ================================================================
   EVENT WIRING
   Uses touchstart (immediate, no 300 ms delay) with a ghost-click
   guard so desktop click fallback still works correctly.
================================================================ */
(function wireButtons() {
  let touchFired  = false;
  let lastTouchId = '';

  function bind(id, fn) {
    const el = document.getElementById(id);

    /* Primary: touchstart for zero-latency tablet response */
    el.addEventListener('touchstart', e => {
      e.preventDefault();       /* suppress ghost click */
      touchFired  = true;
      lastTouchId = id;
      setTimeout(() => { touchFired = false; }, 600);
      fn();
    }, { passive: false });

    /* Fallback: click for mouse / keyboard users */
    el.addEventListener('click', () => {
      if (touchFired && lastTouchId === id) return;
      fn();
    });
  }

  bind('btnAddTen', addTen);
  bind('btnAddOne', addOne);
  bind('btnClear',  clearBoard);
  bind('btnCheck',  checkAnswer);
})();

/* Unlock AudioContext on the very first user gesture */
document.addEventListener('touchstart', getACtx, { once: true });
document.addEventListener('click',      getACtx, { once: true });

/* ================================================================
   BOOT
================================================================ */
function init() { newRound(); }

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
