<!DOCTYPE html>

<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maths competition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        /* Tournament Header */
        header {
            background-color: #2d2d2d;
            padding: 10px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 3px solid #444;
            letter-spacing: 1px;
        }
        /* Split Screen Layout */
        .game-container {
            display: flex;
            flex: 1;
            width: 100%;
        }
        .player-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            position: relative;
            transition: background-color 0.2s ease;
        }
        #player1 {
            border-right: 4px dashed #555;
            background-color: #1e293b; /* Dark Blue */
        }
        #player2 {
            background-color: #311b92; /* Dark Purple */
        }
        /* Scoreboards */
        .score-board {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.5rem;
            font-weight: bold;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }
        .score-display {
            font-size: 2.5rem;
            color: #ffd700;
        }
        /* Math Question Area */
        .question-box {
            text-align: center;
            font-size: 3rem;
            font-weight: 700;
            margin: auto 0;
            padding: 20px;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            letter-spacing: 2px;
        }
        /* Interactive Option Grids */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
        }
        .option-card {
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            font-size: 1.8rem;
            font-weight: bold;
            position: relative;
        }
        .key-hint {
            position: absolute;
            top: 5px;
            left: 5px;
            background: #e11d48;
            color: white;
            font-size: 0.8rem;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }
        /* Visual Feedback Flash */
        .correct-flash { background-color: #16a34a !important; }
        .wrong-flash { background-color: #dc2626 !important; }

        /* Game Over Overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .overlay h1 { font-size: 4rem; color: #ffd700; margin-bottom: 20px; text-align: center;}
        .overlay button {
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background: #16a34a;
            color: white;
        }
    </style>
</head>
<body>

    <header>Math Competition -- First to 10 Points Wins</header>

    <div class="game-container">
        <!-- PLAYER 1 -->
        <div class="player-side" id="player1">
            <div class="score-board">
                <div>PLAYER 1</div>
                <div class="score-display" id="p1-score">0</div>
            </div>
            <div class="question-box" id="p1-question">5 x (-2) + 3 x 4</div>
            <div class="options-grid">
                <div class="option-card"><span class="key-hint">W</span><span id="p1-optA">2</span></div>
                <div class="option-card"><span class="key-hint">A</span><span id="p1-optB">-2</span></div>
                <div class="option-card"><span class="key-hint">S</span><span id="p1-optC">22</span></div>
                <div class="option-card"><span class="key-hint">D</span><span id="p1-optD">-22</span></div>
            </div>
        </div>

        <!-- PLAYER 2 -->
        <div class="player-side" id="player2">
            <div class="score-board">
                <div>PLAYER 2</div>
                <div class="score-display" id="p2-score">0</div>
            </div>
            <div class="question-box" id="p2-question">5 x (-2) + 3 x 4</div>
            <div class="options-grid">
                <div class="option-card"><span class="key-hint">↑</span><span id="p2-optA">2</span></div>
                <div class="option-card"><span class="key-hint">←</span><span id="p2-optB">-2</span></div>
                <div class="option-card"><span class="key-hint">↓</span><span id="p2-optC">22</span></div>
                <div class="option-card"><span class="key-hint">→</span><span id="p2-optD">-22</span></div>
            </div>
        </div>
    </div>

    <!-- Win Screen Overlay -->
    <div class="overlay" id="win-screen">
        <h1 id="winner-text">PLAYER WINS!</h1>
        <button onclick="resetGame()">Next Match (Spacebar)</button>
    </div>

    <script>
        const questionsPool = [
            { q: "-14 - (-8)", a: -6, options: [-22, -6, 6, 22] },
            { q: "(-3) × (-4) + 2", a: 14, options: [-10, 14, -14, 10] },
            { q: "-48 ÷ (-6)", a: 8, options: [8, -8, 42, -42] },
            { q: "-15 + (-7)", a: -22, options: [-8, 22, -22, 8] },
            { q: "5 + 3 × (-2)", a: -1, options: [-1, -16, 11, -11] },
            { q: "(-2)³", a: -8, options: [8, -6, -8, 6] },
            { q: "Solve: 3x + 4 = -2", a: -2, options: [-2, 2, 6, -6] },
            { q: "Solve: 2x - 5 = 7", a: 6, options: [1, 6, -6, 12] },
            { q: "Find x: x / -4 = 3", a: -12, options: [-12, 12, -7, 7] },
            { q: "Solve: 5x + 2 = -3x + 10", a: 1, options: [1, -1, 5, -5] },
            { q: "-6 - 4 × (-3)", a: 6, options: [6, -6, 18, -18] },
            { q: "(-5)² - 10", a: 15, options: [15, -15, 25, -25] },
            { q: "Solve for x: 4x + 3 = 2x + 11", a: 4, options: [4, -4, 8, -8] },
            { q: "Evaluate: (-2)⁴ ÷ (-2)²", a: 4, options: [4, -4, 16, -16] },
            { q: "Find x: x + (-7) = -3", a: 4, options: [4, -4, 10, -10] },
            { q: "Find x: 3x - 5 = 2x + 4", a: 9, options: [9, -9, 7, -7] },
            { q: "Evaluate: (-3)² + (-4)²", a: 25, options: [25, -25, 7, -7] },
            { q: "5 x (-2) + 3 x 4", a: 2, options: [2, -2, 22, -22] },
            { q: "Solve: 6x - 4 = 2x + 8", a: 3, options: [3, -3, 7, -7] },
            { q: "Evaluate: (-1)³ + (-1)² + (-1)", a: -1, options: [-1, 1, -3, 3] }
        ];

        let p1Score = 0;
        let p2Score = 0;
        let currentQ = null;
        const targetScore = 10;
        let isRoundActive = true;

        function loadNewQuestion() {
            if (p1Score >= targetScore || p2Score >= targetScore) {
                endGame();
                return;
            }
            
            isRoundActive = true;
            // Pick a completely random math question from our REB pool
            const randomIndex = Math.floor(Math.random() * questionsPool.length);
            currentQ = questionsPool[randomIndex];

            // Render text for Player 1
            document.getElementById('p1-question').innerText = currentQ.q;
            document.getElementById('p1-optA').innerText = currentQ.options[0];
            document.getElementById('p1-optB').innerText = currentQ.options[1];
            document.getElementById('p1-optC').innerText = currentQ.options[2];
            document.getElementById('p1-optD').innerText = currentQ.options[3];

            // Render identical text for Player 2
            document.getElementById('p2-question').innerText = currentQ.q;
            document.getElementById('p2-optA').innerText = currentQ.options[0];
            document.getElementById('p2-optB').innerText = currentQ.options[1];
            document.getElementById('p2-optC').innerText = currentQ.options[2];
            document.getElementById('p2-optD').innerText = currentQ.options[3];
        }

        // Handle Simultaneous Key Press Inputs
        window.addEventListener('keydown', function(event) {
            if (!isRoundActive) {
                if (event.code === "Space") resetGame();
                return;
            }

            const key = event.key.toLowerCase();
            const code = event.code;

            //PLAYER 1 CONTROLS (W, A, S, D)
            if (['w', 'a', 's', 'd'].includes(key)) {
                isRoundActive = false; // Freeze inputs immediately
                let chosenIndex = key === 'w' ? 0 : key === 'a' ? 1 : key === 's' ? 2 : 3;
                evaluateAnswer('p1', chosenIndex);
            }

            //PLAYER 2 CONTROLS (Arrows)
            if (['ArrowUp', 'ArrowLeft', 'ArrowDown', 'ArrowRight'].includes(code)) {
                isRoundActive = false; // Freeze inputs immediately
                let chosenIndex = code === 'ArrowUp' ? 0 : code === 'ArrowLeft' ? 1 : code === 'ArrowDown' ? 2 : 3;
                evaluateAnswer('p2', chosenIndex);
            }
        });

        function evaluateAnswer(player, index) {
            const selectedAnswer = currentQ.options[index];
            const isCorrect = (selectedAnswer === currentQ.a);
            const targetSide = player === 'p1' ? document.getElementById('player1') : document.getElementById('player2');

            if (isCorrect) {
                targetSide.classList.add('correct-flash');
                if (player === 'p1') p1Score++; else p2Score++;
            } else {
                targetSide.classList.add('wrong-flash');
                // Strict penalization rule: wrong answers cost points
                if (player === 'p1') p1Score = Math.max(0, p1Score - 1); 
                else p2Score = Math.max(0, p2Score - 1);
            }

            // Update physical score counters on monitor
            document.getElementById('p1-score').innerText = p1Score;
            document.getElementById('p2-score').innerText = p2Score;

            // Clear color flash and cycle questions after 800ms
            setTimeout(() => {
                targetSide.classList.remove('correct-flash', 'wrong-flash');
                loadNewQuestion();
            }, 800);
        }

        function endGame() {
            isRoundActive = false;
            const winner = p1Score >= targetScore ? "PLAYER 1" : "PLAYER 2";
            document.getElementById('winner-text').innerText = `🏆 ${winner} WINS THE MATCH!`;
            document.getElementById('win-screen').style.display = 'flex';
        }

        function resetGame() {
            p1Score = 0;
            p2Score = 0;
            document.getElementById('p1-score').innerText = 0;
            document.getElementById('p2-score').innerText = 0;
            document.getElementById('win-screen').style.display = 'none';
            loadNewQuestion();
        }

        // Initial launch when code file loads offline
        loadNewQuestion();
    </script>

</body></html>
