<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Farm Pictograph 🌾</title>
<style>

/* ================================================================
   RESET & BASE
================================================================ */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0; padding: 0;
  -webkit-tap-highlight-color: transparent;
}
html { height: 100%; }
body {
  min-height: 100%;
  background: linear-gradient(168deg,
    #b3e5fc 0%,
    #e8f5e9 42%,
    #f9fbe7 78%,
    #fff9c4 100%);
  font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif;
  overflow-x: hidden;
  touch-action: manipulation;
}

/* ================================================================
   APP SHELL
================================================================ */
#app {
  max-width: 520px;
  margin: 0 auto;
  padding: 8px 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  min-height: 100vh;
  min-height: 100dvh;
}

/* ================================================================
   HEADER
================================================================ */
.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.game-title {
  font-size: clamp(1.05rem, 4.8vw, 1.65rem);
  font-weight: 900;
  color: #1b5e20;
  text-shadow: 0 1px 4px rgba(0,0,0,0.12);
  white-space: nowrap;
}
#scoreBadge {
  background: linear-gradient(135deg, #ffd54f, #ffb300);
  color: #4e342e;
  font-size: clamp(0.86rem, 3.4vw, 1.10rem);
  font-weight: 900;
  padding: 6px 16px;
  border-radius: 50px;
  box-shadow: 0 3px 9px rgba(0,0,0,0.20);
  flex-shrink: 0;
  white-space: nowrap;
}
#scoreBadge.bump {
  animation: scoreBump 0.38s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes scoreBump {
  0%,100% { transform: scale(1.00); }
  50%     { transform: scale(1.55); }
}

/* ================================================================
   KEY LABEL
================================================================ */
.key-label {
  text-align: center;
  font-size: clamp(0.70rem, 2.7vw, 0.90rem);
  font-weight: 700;
  color: #37474f;
  background: rgba(255,255,255,0.70);
  border: 1.5px dashed #90a4ae;
  border-radius: 10px;
  padding: 4px 12px;
  letter-spacing: 0.03em;
  flex-shrink: 0;
}

/* ================================================================
   PICTOGRAPH TABLE
================================================================ */
#pictographArea {
  background: #fff;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 5px 20px rgba(0,0,0,0.13);
  border: 2.5px solid #66bb6a;
  flex-shrink: 0;
}
.picto-table {
  width: 100%;
  border-collapse: collapse;
}

/* ── Table header ── */
.picto-thead th {
  background: linear-gradient(135deg, #388e3c, #1b5e20);
  color: #fff;
  font-size: clamp(0.68rem, 2.6vw, 0.88rem);
  font-weight: 700;
  padding: 7px 10px;
  text-align: left;
  letter-spacing: 0.04em;
}
.picto-thead th:first-child {
  width: 36%;
  border-right: 2px solid rgba(255,255,255,0.22);
}

/* ── Data rows ── */
.picto-row:not(:last-child) {
  border-bottom: 2px solid rgba(0,0,0,0.06);
}

/* Label cell */
.picto-label-cell {
  width: 36%;
  padding: 8px 10px;
  border-right: 2px solid rgba(0,0,0,0.07);
  vertical-align: middle;
}
.label-inner {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 1px;
}
.label-emoji-big { font-size: clamp(1.3rem, 5.0vw, 1.75rem); line-height: 1; }
.label-name {
  font-size: clamp(0.70rem, 2.7vw, 0.90rem);
  font-weight: 800;
  color: #1a237e;
}

/* Emoji count cell */
.picto-emoji-cell {
  padding: 7px 10px;
  vertical-align: middle;
}
.emoji-list {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  align-items: center;
}
.farm-emoji {
  font-size: clamp(1.35rem, 5.3vw, 1.88rem);
  line-height: 1;
  display: inline-block;
}

/* Correct-row highlight + emoji bounce */
.picto-row.correct-row {
  animation: rowPulse 0.58s ease-in-out 3;
}
@keyframes rowPulse {
  0%,100% { filter: brightness(1.00); }
  50%     { filter: brightness(0.80) saturate(1.6); }
}
.picto-row.correct-row .farm-emoji {
  animation: emojiBounce 0.38s ease-in-out infinite alternate;
}
@keyframes emojiBounce {
  from { transform: translateY(0)    scale(1.00); }
  to   { transform: translateY(-7px) scale(1.12); }
}

/* ================================================================
   QUESTION CARD
================================================================ */
#questionCard {
  background: linear-gradient(145deg, #ffffff, #e3f2fd);
  border: 3px solid #1976d2;
  border-radius: 18px;
  padding: 11px 16px;
  text-align: center;
  box-shadow: 0 4px 14px rgba(25,118,210,0.14),
              inset 0 1px 3px rgba(255,255,255,0.80);
  flex-shrink: 0;
}
#questionText {
  font-size: clamp(1.02rem, 4.4vw, 1.52rem);
  color: #0d47a1;
  font-weight: 700;
  line-height: 1.45;
}
#questionText strong { font-weight: 900; color: #1b5e20; }
.q-emoji {
  font-size: 1.25em;
  vertical-align: -0.12em;
}

/* ================================================================
   ANSWER AREA
================================================================ */
#answerArea {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
#answerArea.locked {
  pointer-events: none;
  opacity: 0.52;
}

/* ── Number display box ── */
#numDisplay {
  background: #fff;
  border: 3px solid #1976d2;
  border-radius: 14px;
  padding: 7px 24px;
  font-size: clamp(1.65rem, 7.5vw, 2.5rem);
  font-weight: 900;
  color: #0d47a1;
  min-width: 130px;
  min-height: 58px;
  text-align: center;
  letter-spacing: 0.1em;
  box-shadow: inset 0 2px 8px rgba(0,0,0,0.07),
              0 3px 10px rgba(0,0,0,0.08);
  display: flex;
  align-items: center;
  justify-content: center;
}
#numDisplay.shake {
  animation: answerShake 0.52s ease both;
  border-color: #e53935 !important;
}
@keyframes answerShake {
  0%,100% { transform: translateX(0); }
  12% { transform: translateX(-14px); }
  27% { transform: translateX( 14px); }
  42% { transform: translateX(-10px); }
  56% { transform: translateX( 10px); }
  70% { transform: translateX( -5px); }
  82% { transform: translateX(  5px); }
  91% { transform: translateX( -2px); }
}
.num-placeholder {
  color: #b0bec5;
  font-size: clamp(0.82rem, 3.2vw, 1.05rem);
  font-weight: 700;
}
.num-cursor {
  display: inline-block;
  width: 2.5px;
  height: 1.1em;
  background: #1976d2;
  margin-left: 3px;
  vertical-align: middle;
  animation: cursorBlink 1s step-end infinite;
}
@keyframes cursorBlink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

/* ── Keypad grid ── */
#keypad {
  width: 100%;
  max-width: 330px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
}
.key-btn {
  min-height: 65px;
  border: none;
  border-radius: 14px;
  font-size: clamp(1.22rem, 5.2vw, 1.80rem);
  font-weight: 900;
  color: #fff;
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  transition: transform 0.07s ease, box-shadow 0.07s ease;
  position: relative;
  overflow: hidden;
  line-height: 1;
}
.key-btn::before {
  content: '';
  position: absolute;
  inset: 0 0 55% 0;
  background: rgba(255,255,255,0.22);
  border-radius: 12px 12px 0 0;
  pointer-events: none;
}
.key-btn:active { transform: translateY(4px) !important; box-shadow: none !important; }

.key-digit {
  background: linear-gradient(150deg, #42a5f5, #1565c0);
  box-shadow: 0 5px 0 #0d3b6e, 0 7px 14px rgba(0,0,0,0.14);
}
.key-delete {
  background: linear-gradient(150deg, #ef5350, #b71c1c);
  font-size: clamp(0.74rem, 2.9vw, 1.02rem);
  box-shadow: 0 5px 0 #7f1210, 0 7px 14px rgba(0,0,0,0.14);
}
.key-submit {
  background: linear-gradient(150deg, #66bb6a, #2e7d32);
  font-size: clamp(0.74rem, 2.9vw, 1.02rem);
  box-shadow: 0 5px 0 #1a4d1c, 0 7px 14px rgba(0,0,0,0.14);
}

.key-btn.tapped {
  animation: keyTap 0.22s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes keyTap {
  0%,100% { filter: brightness(1.00); transform: scale(1.00); }
  40%     { filter: brightness(1.50); transform: scale(1.07) translateY(-3px); }
}

/* ── 2×2 choice button grid ── */
#choiceGrid {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}
.choice-btn {
  min-height: 80px;
  border: 3px solid transparent;
  border-radius: 18px;
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-weight: 900;
  transition: transform 0.07s ease;
  box-shadow: 0 5px 0 rgba(0,0,0,0.22), 0 8px 16px rgba(0,0,0,0.10);
  position: relative;
  overflow: hidden;
}
.choice-btn::before {
  content: '';
  position: absolute;
  inset: 0 0 55% 0;
  background: rgba(255,255,255,0.20);
  border-radius: 16px 16px 0 0;
  pointer-events: none;
}
.choice-btn:active { transform: translateY(5px) !important; box-shadow: none !important; }

/* Per-item colour themes */
.cbt-0 {
  background: linear-gradient(150deg, #ffe082, #f9a825);
  color: #3e2000;
  box-shadow: 0 5px 0 #a66a00, 0 8px 16px rgba(0,0,0,0.10);
}
.cbt-1 {
  background: linear-gradient(150deg, #a5d6a7, #2e7d32);
  color: #fff;
  box-shadow: 0 5px 0 #1a4d1c, 0 8px 16px rgba(0,0,0,0.10);
}
.cbt-2 {
  background: linear-gradient(150deg, #fff176, #fbc02d);
  color: #3e2000;
  box-shadow: 0 5px 0 #a67c00, 0 8px 16px rgba(0,0,0,0.10);
}
.cbt-3 {
  background: linear-gradient(150deg, #90caf9, #1565c0);
  color: #fff;
  box-shadow: 0 5px 0 #0d3b6e, 0 8px 16px rgba(0,0,0,0.10);
}

.choice-emoji { font-size: clamp(1.9rem, 7.5vw, 2.6rem); line-height: 1; }
.choice-name  { font-size: clamp(0.78rem, 3.0vw, 1.02rem); font-weight: 900; }

/* Correct & wrong feedback animations for choice buttons */
.choice-btn.correct-flash {
  animation: choiceCorrect 0.50s ease both;
  border-color: rgba(255,255,255,0.70);
  filter: brightness(1.18);
}
@keyframes choiceCorrect {
  0%,100% { transform: scale(1.00); }
  50%     { transform: scale(1.08); }
}
.choice-btn.wrong-flash {
  animation: choiceWrong 0.42s ease both;
  filter: brightness(0.78);
}
@keyframes choiceWrong {
  0%,100% { transform: translateX(0); }
  25%     { transform: translateX(-9px); }
  75%     { transform: translateX( 9px); }
}

/* ================================================================
   CELEBRATION OVERLAY
================================================================ */
#celebOverlay {
  position: fixed;
  inset: 0;
  background: rgba(255, 235, 59, 0.80);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  z-index: 200;
  pointer-events: none;
  opacity: 0;
}
#celebOverlay.show {
  animation: celebFade 1.92s ease-in-out forwards;
}
@keyframes celebFade {
  0%   { opacity: 0; transform: scale(0.90); }
  12%  { opacity: 1; transform: scale(1.05); }
  76%  { opacity: 1; transform: scale(1.00); }
  100% { opacity: 0; transform: scale(1.07); }
}
.celeb-star {
  font-size: clamp(3.5rem, 15vw, 5.5rem);
  animation: celebRotate 1.92s linear;
  line-height: 1;
}
@keyframes celebRotate {
  from { transform: rotate(  0deg) scale(0.5); }
  15%  { transform: rotate( 90deg) scale(1.2); }
  55%  { transform: rotate(270deg) scale(1.0); }
  to   { transform: rotate(360deg) scale(0.8); }
}
.celeb-title {
  font-size: clamp(1.75rem, 7.5vw, 3.0rem);
  font-weight: 900;
  color: #fff;
  text-shadow: 0 3px 10px rgba(0,0,0,0.28);
  letter-spacing: 0.04em;
}
.celeb-sub {
  font-size: clamp(0.98rem, 4.0vw, 1.55rem);
  font-weight: 700;
  color: #fff;
  text-shadow: 0 2px 8px rgba(0,0,0,0.24);
  letter-spacing: 0.03em;
}

/* ================================================================
   FEEDBACK TOAST
================================================================ */
#feedbackToast {
  position: fixed;
  bottom: -90px;
  left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(135deg, #e53935, #b71c1c);
  color: #fff;
  font-size: clamp(0.86rem, 3.4vw, 1.15rem);
  font-weight: 900;
  padding: 12px 26px;
  border-radius: 50px;
  box-shadow: 0 5px 18px rgba(0,0,0,0.28);
  white-space: nowrap;
  z-index: 300;
  pointer-events: none;
  transition: bottom 0.34s cubic-bezier(0.34,1.56,0.64,1);
}
#feedbackToast.show {
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
}

/* ================================================================
   LANDSCAPE COMPACT — short screens
================================================================ */
@media (max-height: 620px) {
  #app { gap: 5px; padding: 5px 10px 8px; }
  .key-btn    { min-height: 58px; font-size: 1.1rem; }
  .choice-btn { min-height: 65px; }
  #numDisplay { min-height: 50px; font-size: 1.4rem; }
  .picto-emoji-cell, .picto-label-cell { padding: 5px 8px; }
  .farm-emoji { font-size: 1.4rem; }
}

</style>
</head>
<body>

<div id="app">

  <!-- ═══ HEADER ═══ -->
  <div class="header-row">
    <div class="game-title">🌾 Farm Pictograph</div>
    <div id="scoreBadge">⭐ Score: 0</div>
  </div>

  <!-- ═══ KEY ═══ -->
  <div class="key-label">📋 KEY: Each emoji shown = 1 item on the farm</div>

  <!-- ═══ PICTOGRAPH TABLE ═══ -->
  <div id="pictographArea">
    <table class="picto-table">
      <thead>
        <tr class="picto-thead">
          <th>Farm Item</th>
          <th>Count each emoji 👉</th>
        </tr>
      </thead>
      <tbody id="pictoBody">
        <!-- Rows injected dynamically by JavaScript -->
      </tbody>
    </table>
  </div>

  <!-- ═══ QUESTION CARD ═══ -->
  <div id="questionCard">
    <div id="questionText">❓ Loading…</div>
  </div>

  <!-- ═══ ANSWER AREA (keypad or choice buttons) ═══ -->
  <div id="answerArea"></div>

</div><!-- /#app -->

<!-- ═══ CELEBRATION OVERLAY ═══ -->
<div id="celebOverlay">
  <div class="celeb-star">⭐</div>
  <div class="celeb-title">CORRECT! 🎉</div>
  <div class="celeb-sub" id="celebSub"></div>
</div>

<!-- ═══ FEEDBACK TOAST ═══ -->
<div id="feedbackToast">❌ Try again! Count carefully 👀</div>

<script>
'use strict';

/* ================================================================
   FARM ITEM CATALOGUE
================================================================ */
const ITEMS = [
  {
    id: 0, name: 'Maize',   plural: 'Maize',
    emoji: '🌽',
    rowBg: '#fffde7', rowHL: '#fff176',
  },
  {
    id: 1, name: 'Cows',    plural: 'Cows',
    emoji: '🐄',
    rowBg: '#f1f8e9', rowHL: '#c5e1a5',
  },
  {
    id: 2, name: 'Bananas', plural: 'Bananas',
    emoji: '🍌',
    rowBg: '#fff8e1', rowHL: '#ffe082',
  },
  {
    id: 3, name: 'Sheep',   plural: 'Sheep',
    emoji: '🐑',
    rowBg: '#e3f2fd', rowHL: '#90caf9',
  },
];

/* Question-type tokens */
const QT_COUNT  = 'count';   /* "How many [X]?"                  → keypad   */
const QT_MORE   = 'more';    /* "How many more [A] than [B]?"    → keypad   */
const QT_MOST   = 'most';    /* "Which has the MOST?"            → choices  */
const QT_FEWEST = 'fewest';  /* "Which has the FEWEST?"          → choices  */
const QT_EXACT  = 'exact';   /* "Which has exactly N?"           → choices  */

/* ================================================================
   GAME STATE
================================================================ */
let score        = 0;
let farmCounts   = [];   /* count per ITEMS index (1–7)          */
let currentQ     = null; /* current question object              */
let inputDigits  = '';   /* digits typed so far on the keypad    */
let inputEnabled = true; /* false during post-correct animation  */

/* ================================================================
   WEB AUDIO API  —  100% synthesized, zero external assets
================================================================ */
let _ac = null;

/** Returns (or creates) a single shared AudioContext. */
function getAC() {
  if (!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)();
  if (_ac.state === 'suspended') _ac.resume();
  return _ac;
}
/* Warm up the context on first user interaction */
['touchstart', 'click'].forEach(evt =>
  document.addEventListener(evt, getAC, { once: true })
);

/**
 * Soft "pop/tap" — 880 Hz sine with 65 ms exponential decay.
 * Gives immediate tactile-feeling feedback for key presses.
 */
function playTap() {
  try {
    const ac = getAC(), t = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine';
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.15, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.065);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + 0.07);
  } catch(e) {}
}

/**
 * Celebratory chime melody — G major arpeggio (G4 → B4 → D5 → G5)
 * with two upper "ding-ding" repeats and a bright B5 finale.
 *
 * Each note is layered:
 *   • Primary  sine  at the fundamental frequency
 *   • Overtone sine  at freq × 2.756 (inharmonic — bell character)
 */
function playChime() {
  try {
    const ac  = getAC();
    const now = ac.currentTime;

    /* [frequency Hz, start offset s, volume] */
    const seq = [
      [392.00, 0.00, 0.20],   /* G4  — arpeggio root  */
      [493.88, 0.13, 0.22],   /* B4  */
      [587.33, 0.26, 0.22],   /* D5  */
      [783.99, 0.39, 0.28],   /* G5  — cascade top    */
      [587.33, 0.60, 0.17],   /* D5  — resolution     */
      [783.99, 0.76, 0.26],   /* G5  — ding 1         */
      [987.77, 0.96, 0.30],   /* B5  — bright final   */
      [783.99, 1.18, 0.20],   /* G5  — tail ring      */
    ];

    seq.forEach(([freq, off, vol]) => {
      const t = now + off;

      /* Fundamental tone */
      const o1 = ac.createOscillator(), g1 = ac.createGain();
      o1.type = 'sine'; o1.frequency.value = freq;
      g1.gain.setValueAtTime(0.001, t);
      g1.gain.linearRampToValueAtTime(vol, t + 0.014);
      g1.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
      o1.connect(g1); g1.connect(ac.destination);
      o1.start(t); o1.stop(t + 0.58);

      /* Inharmonic overtone — metallic bell shimmer */
      const o2 = ac.createOscillator(), g2 = ac.createGain();
      o2.type = 'sine'; o2.frequency.value = freq * 2.756;
      g2.gain.setValueAtTime(0.001, t);
      g2.gain.linearRampToValueAtTime(vol * 0.28, t + 0.010);
      g2.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
      o2.connect(g2); g2.connect(ac.destination);
      o2.start(t); o2.stop(t + 0.26);
    });
  } catch(e) {}
}

/**
 * Error buzz — sawtooth wave descending 145 Hz → 62 Hz over 280 ms.
 * Distinctly "wrong" feel with no melodic connotation.
 */
function playBuzz() {
  try {
    const ac = getAC(), t = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(145, t);
    o.frequency.exponentialRampToValueAtTime(62, t + 0.28);
    g.gain.setValueAtTime(0.24, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + 0.30);
  } catch(e) {}
}

/* ================================================================
   PICTOGRAPH TABLE RENDERING
================================================================ */

/**
 * Builds the <tbody> rows of the pictograph from the current farmCounts.
 * Each row shows the item's emoji + label in the left cell, and
 * the appropriate number of emoji icons in the right cell.
 */
function renderPictograph() {
  const tbody = document.getElementById('pictoBody');
  tbody.innerHTML = '';

  ITEMS.forEach((item, idx) => {
    const count = farmCounts[idx];

    /* ── Table row ── */
    const tr = document.createElement('tr');
    tr.className        = 'picto-row';
    tr.id               = 'row-' + idx;
    tr.style.background = item.rowBg;

    /* ── Label cell: large emoji + item name ── */
    const tdL = document.createElement('td');
    tdL.className = 'picto-label-cell';
    const lInner = document.createElement('div');
    lInner.className = 'label-inner';
    lInner.innerHTML =
      `<span class="label-emoji-big">${item.emoji}</span>` +
      `<span class="label-name">${item.name}</span>`;
    tdL.appendChild(lInner);
    tr.appendChild(tdL);

    /* ── Emoji count cell: one emoji per unit ── */
    const tdE = document.createElement('td');
    tdE.className = 'picto-emoji-cell';
    const elist = document.createElement('div');
    elist.className = 'emoji-list';
    for (let i = 0; i < count; i++) {
      const sp = document.createElement('span');
      sp.className   = 'farm-emoji';
      sp.textContent = item.emoji;
      elist.appendChild(sp);
    }
    tdE.appendChild(elist);
    tr.appendChild(tdE);

    tbody.appendChild(tr);
  });
}

/* ================================================================
   QUESTION GENERATION
================================================================ */

/**
 * Analyses `farmCounts` and randomly selects a well-formed question.
 *
 * Type availability rules:
 *   QT_COUNT  — always available
 *   QT_MORE   — at least two items with different counts
 *   QT_MOST   — exactly one item with the maximum count
 *   QT_FEWEST — exactly one item with the minimum count
 *   QT_EXACT  — at least one count value held by exactly one item
 *
 * Returns a question object:
 *   { type, inputType('number'|'choice'),
 *     answer(number|string), html(string),
 *     targetIdx, bigIdx?, smallIdx?, targetCount? }
 */
function generateQuestion() {
  const max = Math.max(...farmCounts);
  const min = Math.min(...farmCounts);

  /* Items that share the max / min — used for uniqueness checks */
  const maxGroup = ITEMS.filter((_, i) => farmCounts[i] === max);
  const minGroup = ITEMS.filter((_, i) => farmCounts[i] === min);

  /* Count frequency map → which counts are held by exactly one item */
  const freq = {};
  farmCounts.forEach(c => { freq[c] = (freq[c] || 0) + 1; });
  const uniqueNums = Object.keys(freq)
    .filter(k => freq[k] === 1)
    .map(Number);

  /* All item-pairs with differing counts (for QT_MORE) */
  const diffPairs = [];
  for (let a = 0; a < ITEMS.length; a++) {
    for (let b = a + 1; b < ITEMS.length; b++) {
      if (farmCounts[a] !== farmCounts[b]) diffPairs.push([a, b]);
    }
  }

  /* ── Weighted question pool ── */
  /* Count questions get 3× weight so the game focuses on core skill */
  const pool = [QT_COUNT, QT_COUNT, QT_COUNT];
  if (maxGroup.length === 1)  pool.push(QT_MOST);
  if (minGroup.length === 1)  pool.push(QT_FEWEST);
  if (uniqueNums.length > 0)  pool.push(QT_EXACT);
  if (diffPairs.length > 0)   pool.push(QT_MORE);

  const type = pool[Math.floor(Math.random() * pool.length)];

  switch (type) {

    /* ── HOW MANY [X]? ── */
    case QT_COUNT: {
      const idx = Math.floor(Math.random() * ITEMS.length);
      const { emoji, plural } = ITEMS[idx];
      return {
        type, inputType: 'number',
        targetIdx: idx,
        answer: farmCounts[idx],
        html:
          `How many <span class="q-emoji">${emoji}</span>` +
          ` <strong>${plural}</strong> are on the farm?`,
      };
    }

    /* ── HOW MANY MORE [A] THAN [B]? ── */
    case QT_MORE: {
      const [a, b] = diffPairs[Math.floor(Math.random() * diffPairs.length)];
      const big   = farmCounts[a] > farmCounts[b] ? a : b;
      const small = big === a ? b : a;
      return {
        type, inputType: 'number',
        targetIdx: big,
        bigIdx: big, smallIdx: small,
        answer: farmCounts[big] - farmCounts[small],
        html:
          `How many more <span class="q-emoji">${ITEMS[big].emoji}</span>` +
          `<strong>${ITEMS[big].plural}</strong> than ` +
          `<span class="q-emoji">${ITEMS[small].emoji}</span>` +
          `<strong>${ITEMS[small].plural}</strong> are there?`,
      };
    }

    /* ── WHICH HAS THE MOST? ── */
    case QT_MOST: {
      const idx = maxGroup[0].id;
      return {
        type, inputType: 'choice',
        targetIdx: idx,
        answer: ITEMS[idx].name,
        html: `Which item has the <strong>MOST</strong> on the farm?`,
      };
    }

    /* ── WHICH HAS THE FEWEST? ── */
    case QT_FEWEST: {
      const idx = minGroup[0].id;
      return {
        type, inputType: 'choice',
        targetIdx: idx,
        answer: ITEMS[idx].name,
        html: `Which item has the <strong>FEWEST</strong> on the farm?`,
      };
    }

    /* ── WHICH HAS EXACTLY N? ── */
    case QT_EXACT: {
      const tNum = uniqueNums[Math.floor(Math.random() * uniqueNums.length)];
      const idx  = farmCounts.indexOf(tNum);
      return {
        type, inputType: 'choice',
        targetIdx: idx,
        targetCount: tNum,
        answer: ITEMS[idx].name,
        html: `Which item has <strong>exactly ${tNum}</strong> on the farm?`,
      };
    }

    /* Safety fallback — should never reach here */
    default: {
      const idx = Math.floor(Math.random() * ITEMS.length);
      return {
        type: QT_COUNT, inputType: 'number',
        targetIdx: idx,
        answer: farmCounts[idx],
        html:
          `How many <span class="q-emoji">${ITEMS[idx].emoji}</span>` +
          ` <strong>${ITEMS[idx].plural}</strong> are on the farm?`,
      };
    }
  }
}

/* ================================================================
   RENDER QUESTION TEXT
================================================================ */

function renderQuestion() {
  document.getElementById('questionText').innerHTML =
    '❓ ' + currentQ.html;
}

/* ================================================================
   ANSWER AREA RENDERING
================================================================ */

/**
 * Clears the answer area and renders either:
 *   • A number display + numeric keypad  (for 'number' questions)
 *   • A 2×2 choice button grid           (for 'choice' questions)
 */
function renderAnswerArea() {
  const area     = document.getElementById('answerArea');
  area.innerHTML = '';
  area.classList.remove('locked');
  inputDigits    = '';

  if (currentQ.inputType === 'number') {
    buildKeypad(area);
  } else {
    buildChoiceButtons(area);
  }
}

/* ── Build number display + 4×3 keypad ── */
function buildKeypad(container) {

  /* Number display box */
  const display   = document.createElement('div');
  display.id      = 'numDisplay';
  display.innerHTML =
    `<span class="num-placeholder">Tap your answer below</span>`;
  container.appendChild(display);

  /* 4-row × 3-column key layout */
  const pad = document.createElement('div');
  pad.id    = 'keypad';

  const layout = [
    ['1','2','3'],
    ['4','5','6'],
    ['7','8','9'],
    ['del','0','ok'],
  ];

  layout.forEach(row => {
    row.forEach(key => {
      const btn = document.createElement('button');
      btn.type  = 'button';
      btn.style.touchAction = 'manipulation';

      if (key === 'del') {
        btn.className   = 'key-btn key-delete';
        btn.textContent = '↩ Del';
        btn.addEventListener('click', () => handleDel(btn));

      } else if (key === 'ok') {
        btn.className   = 'key-btn key-submit';
        btn.textContent = 'Check ✅';
        btn.addEventListener('click', handleSubmit);

      } else {
        btn.className   = 'key-btn key-digit';
        btn.textContent = key;
        btn.addEventListener('click', () => handleDigit(key, btn));
      }
      pad.appendChild(btn);
    });
  });

  container.appendChild(pad);
}

/* ── Build 2×2 choice button grid ── */
function buildChoiceButtons(container) {
  const grid = document.createElement('div');
  grid.id    = 'choiceGrid';

  ITEMS.forEach((item, idx) => {
    const btn     = document.createElement('button');
    btn.type      = 'button';
    btn.id        = 'choice-' + idx;
    btn.className = `choice-btn cbt-${idx}`;
    btn.style.touchAction = 'manipulation';
    btn.innerHTML =
      `<span class="choice-emoji">${item.emoji}</span>` +
      `<span class="choice-name">${item.name}</span>`;
    btn.addEventListener('click', () => handleChoiceClick(idx, btn));
    grid.appendChild(btn);
  });

  container.appendChild(grid);
}

/* ================================================================
   KEYPAD HANDLERS
================================================================ */

function handleDigit(digit, btn) {
  if (!inputEnabled)       return;
  if (inputDigits.length >= 2) return;   /* max 2-digit answers */
  playTap();
  tapAnim(btn);
  inputDigits += digit;
  refreshDisplay();
}

function handleDel(btn) {
  if (!inputEnabled) return;
  playTap();
  tapAnim(btn);
  inputDigits = inputDigits.slice(0, -1);
  refreshDisplay();
}

function handleSubmit() {
  if (!inputEnabled) return;
  if (inputDigits === '') {
    /* Nudge border to prompt entry */
    const d = document.getElementById('numDisplay');
    if (d) {
      d.style.borderColor = '#f57f17';
      setTimeout(() => { if (d) d.style.borderColor = ''; }, 700);
    }
    return;
  }
  const value = parseInt(inputDigits, 10);
  if (value === currentQ.answer) {
    onCorrect();
  } else {
    onWrongNumber();
  }
}

/** Syncs the number display box with the current inputDigits string. */
function refreshDisplay() {
  const d = document.getElementById('numDisplay');
  if (!d) return;
  if (inputDigits === '') {
    d.innerHTML =
      `<span class="num-placeholder">Tap your answer below</span>`;
  } else {
    /* Build safely — digits are guaranteed to be '0'–'9' */
    d.textContent = inputDigits;
    const cur = document.createElement('span');
    cur.className = 'num-cursor';
    d.appendChild(cur);
  }
}

/* ================================================================
   CHOICE BUTTON HANDLER
================================================================ */

function handleChoiceClick(itemIdx, btn) {
  if (!inputEnabled) return;
  playTap();
  if (ITEMS[itemIdx].name === currentQ.answer) {
    /* Visual flash on the tapped button before overlay takes over */
    btn.classList.add('correct-flash');
    onCorrect();
  } else {
    btn.classList.remove('wrong-flash');
    void btn.offsetWidth;
    btn.classList.add('wrong-flash');
    setTimeout(() => btn.classList.remove('wrong-flash'), 450);
    playBuzz();
    showToast();
  }
}

/* ================================================================
   CORRECT / WRONG OUTCOMES
================================================================ */

/**
 * Handles a correct answer:
 * 1. Locks all inputs (pointer-events off)
 * 2. Plays chime melody
 * 3. Highlights the correct pictograph row with bounce animation
 * 4. Displays the celebration overlay
 * 5. Increments + animates the score badge
 * 6. After 1.95 s: hides overlay, starts next round
 */
function onCorrect() {
  inputEnabled = false;
  lockArea(true);
  playChime();

  /* Determine the correct row and a descriptive sub-text */
  const rowIdx = currentQ.targetIdx;
  highlightRow(rowIdx);

  let sub = '';
  if (currentQ.type === QT_COUNT) {
    sub = `${farmCounts[rowIdx]} ${ITEMS[rowIdx].emoji} ${ITEMS[rowIdx].plural}! ✅`;
  } else if (currentQ.type === QT_MORE) {
    sub = `${currentQ.answer} more ${ITEMS[currentQ.bigIdx].emoji}! ✅`;
  } else {
    sub = `${ITEMS[rowIdx].emoji} ${ITEMS[rowIdx].plural}! ✅`;
  }
  document.getElementById('celebSub').textContent = sub;

  /* Show the full-screen overlay */
  showCelebration();

  /* Increment score + badge bounce */
  score++;
  const badge = document.getElementById('scoreBadge');
  badge.textContent = '⭐ Score: ' + score;
  badge.classList.remove('bump');
  void badge.offsetWidth;  /* force reflow to restart animation */
  badge.classList.add('bump');

  /* Move to next round after the celebration finishes */
  setTimeout(() => {
    hideCelebration();
    clearRowHighlights();
    newRound();
    inputEnabled = true;
    lockArea(false);
  }, 1980);
}

/**
 * Handles a wrong number-pad submission:
 * Shakes the display box, clears the input, shows the toast.
 */
function onWrongNumber() {
  playBuzz();
  const d = document.getElementById('numDisplay');
  if (d) {
    d.classList.remove('shake');
    void d.offsetWidth;
    d.classList.add('shake');
    setTimeout(() => { if (d) d.classList.remove('shake'); }, 560);
  }
  /* Clear digits shortly after shake starts */
  setTimeout(() => {
    inputDigits = '';
    refreshDisplay();
  }, 280);
  showToast();
}

/* ================================================================
   ROW HIGHLIGHT UTILITIES
================================================================ */

/** Applies highlight background + bounce animation to a pictograph row. */
function highlightRow(idx) {
  const row = document.getElementById('row-' + idx);
  if (!row) return;
  row.classList.add('correct-row');
  row.style.background = ITEMS[idx].rowHL;
}

/** Removes all row highlight states and restores original backgrounds. */
function clearRowHighlights() {
  ITEMS.forEach((item, idx) => {
    const row = document.getElementById('row-' + idx);
    if (!row) return;
    row.classList.remove('correct-row');
    row.style.background = item.rowBg;
  });
}

/* ================================================================
   OVERLAYS & TOASTS
================================================================ */

function showCelebration() {
  const ov = document.getElementById('celebOverlay');
  ov.classList.remove('show');
  void ov.offsetWidth;
  ov.classList.add('show');
}
function hideCelebration() {
  document.getElementById('celebOverlay').classList.remove('show');
}

let _toastTimer = null;
function showToast() {
  const t = document.getElementById('feedbackToast');
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 1900);
}

/* ================================================================
   UI UTILITIES
================================================================ */

/** Plays a brief scale-up animation on a key button. */
function tapAnim(el) {
  el.classList.remove('tapped');
  void el.offsetWidth;
  el.classList.add('tapped');
  setTimeout(() => el.classList.remove('tapped'), 260);
}

/** Toggles `pointer-events: none` on the answer area during celebration. */
function lockArea(lock) {
  const area = document.getElementById('answerArea');
  if (area) area.classList.toggle('locked', lock);
}

/* ================================================================
   ROUND MANAGEMENT
================================================================ */

/**
 * Generates fresh random counts (1–7) for each farm item.
 * The do-while ensures we never produce a round where all four
 * counts are identical (would make MOST/FEWEST ambiguous).
 */
function generateCounts() {
  do {
    farmCounts = ITEMS.map(() => Math.floor(Math.random() * 7) + 1);
  } while (new Set(farmCounts).size === 1);   /* extremely rare safety guard */
}

/** Starts a completely new round: fresh counts, fresh question, re-render. */
function newRound() {
  generateCounts();
  currentQ = generateQuestion();
  renderPictograph();
  renderQuestion();
  renderAnswerArea();
}

/* ================================================================
   BOOT
================================================================ */
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', newRound);
} else {
  newRound();
}
</script>
