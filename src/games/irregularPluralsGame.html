<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plural Power-Up! - Irregular Plurals Game</title>
    <style>
        :root {
            --primary: #9b59b6;
            --secondary: #34495e;
            --success: #2ecc71;
            --error: #e74c3c;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #7f8c8d;
        }

        .stats {
            display: flex;
            gap: 20px;
            background: white;
            padding: 10px 25px;
            border-radius: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .score-text { color: var(--success); }

        .game-box {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.06);
            width: 100%;
            max-width: 600px;
            padding: 30px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .question-container {
            margin-bottom: 25px;
            width: 100%;
        }

        .prompt-text {
            font-size: 1.2rem;
            color: #7f8c8d;
            margin-bottom: 5px;
        }

        .singular-word {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--secondary);
            margin-bottom: 15px;
        }

        .graphic-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px auto;
            background: #f8f9fa;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px dashed #dcdde1;
        }

        .vector-art {
            width: 80px;
            height: 80px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
        }

        .option-btn {
            background: white;
            border: 3px solid #dcdde1;
            border-radius: 12px;
            padding: 15px;
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background-color: #fcf8ff;
            transform: translateY(-2px);
        }

        .option-btn.correct {
            background-color: #e8f8f0;
            border-color: var(--success);
            color: #27ae60;
        }

        .option-btn.wrong {
            background-color: #fdedec;
            border-color: var(--error);
            color: var(--error);
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .feedback-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .modal {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 90%;
        }

        .modal h2 {
            font-size: 2.2rem;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .modal p {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #8e44ad;
        }
    </style>
</head>
<body>

    <header>
        <h1>Plural Power-Up! ⚡</h1>
        <p class="subtitle">Match the Singular word to its Irregular Plural</p>
    </header>

    <div class="stats">
        <div>Question: <span id="current-q">1</span> / 8</div>
        <div>Score: <span id="score" class="score-text">0</span></div>
    </div>

    <div class="game-box">
        <div class="question-container">
            <p class="prompt-text">What is the plural of...</p>
            <div id="singular-display" class="singular-word">a foot</div>
            <div id="graphic-area" class="graphic-container"></div>
        </div>

        <div id="options-area" class="options-grid"></div>
    </div>

    <div class="feedback-overlay" id="end-modal">
        <div class="modal">
            <h2>Амжилттай! 🎉</h2>
            <p>You finished the irregular plurals challenge!</p>
            <p id="final-score" style="font-weight: bold; font-size: 1.4rem;"></p>
            <button class="btn" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        const dataset = [
            {
                singular: "a foot",
                plural: "feet",
                svg: `<svg class="vector-art" viewBox="0 0 100 100"><path d="M40,25 C45,20 55,20 58,28 C62,35 60,45 64,55 C67,62 72,66 72,72 C72,82 60,82 50,82 C35,82 28,75 28,65 C28,50 35,32 40,25 Z" fill="#ffdbac" stroke="#333" stroke-width="4"/><circle cx="56" cy="22" r="4" fill="#ffdbac" stroke="#333" stroke-width="1.5"/><circle cx="64" cy="26" r="3.5" fill="#ffdbac" stroke="#333" stroke-width="1.5"/><circle cx="69" cy="32" r="3" fill="#ffdbac" stroke="#333" stroke-width="1.5"/></svg>`
            },
            {
                singular: "a tooth",
                plural: "teeth",
                svg: `<svg class="vector-art" viewBox="0 0 100 100"><path d="M30,30 C30,15 45,15 50,25 C55,15 70,15 70,30 C70,55 65,55 60,80 C58,85 52,85 50,70 C48,85 42,85 40,80 C35,55 30,55 30,30 Z" fill="#fff" stroke="#333" stroke-width="4" stroke-linejoin="round"/></svg>`
            },
            {
                singular: "a child",
                plural: "children",
                svg: `<svg class="vector-art" viewBox="0 0 100 100"><circle cx="50" cy="35" r="15" fill="#ffcd56" stroke="#333" stroke-width="4"/><path d="M25,80 C25,60 35,55 50,55 C65,55 75,60 75,80 Z" fill="#4ea5cd" stroke="#333" stroke-width="4"/></svg>`
            },
            {
                singular: "a woman",
                plural: "women",
                svg: `<svg class="vector-art" viewBox="0 0 100 100"><circle cx="50" cy="40" r="14" fill="#ffdbac" stroke="#333" stroke-width="4"/><path d="M50,18 C35,18 32,32 35,42 C38,40 62,40 65,42 C68,32 65,18 50,18 Z" fill="#4a3728"/><path d="M25,85 C25,65 35,60 50,60 C65,60 75,65 75,85 Z" fill="#e84393" stroke="#333" stroke-width="4"/></svg>`
            },
            {
                singular: "a man",
                plural: "men",
                svg: `<svg class="vector-art" viewBox="0 0 100 100"><circle cx="50" cy="40" r="14" fill="#ffdbac" stroke="#333" stroke-width="4"/><path d="M34,32 C38,20 62,20 66,32 Z" fill="#2c3e50"/><path d="M25,85 C25,65 35,60 50,60 C65,60 75,65 75,85 Z" fill="#10ac84" stroke="#333" stroke-width="4"/></svg>`
            },
            {
                singular: "a sheep",
                plural: "sheep",
                svg: `<svg class="vector-art" viewBox="0 0 100 100"><rect x="35" y="65" width="8" height="20" fill="#57606f"/><rect x="57" y="65" width="8" height="20" fill="#57606f"/><circle cx="50" cy="45" r="22" fill="#f1f2f6" stroke="#333" stroke-width="4"/><circle cx="70" cy="40" r="10" fill="#2f3542" stroke="#333" stroke-width="3"/></svg>`
            },
            {
                singular: "a mouse",
                plural: "mice",
                svg: `<svg class="vector-art" viewBox="0 0 100 100"><circle cx="32" cy="35" r="12" fill="#a5b1c2" stroke="#333" stroke-width="3"/><circle cx="68" cy="35" r="12" fill="#a5b1c2" stroke="#333" stroke-width="3"/><ellipse cx="50" cy="55" rx="22" ry="18" fill="#a5b1c2" stroke="#333" stroke-width="4"/><circle cx="50" cy="55" r="3" fill="#000"/></svg>`
            },
            {
                singular: "a goose",
                plural: "geese",
                svg: `<svg class="vector-art" viewBox="0 0 100 100"><path d="M30,75 C30,55 45,55 50,55 C55,40 50,30 60,20 C65,25 65,35 58,45 C65,52 70,62 70,75 Z" fill="#fff" stroke="#333" stroke-width="4"/><path d="M60,20 L70,22 L64,28 Z" fill="#f39c12"/></svg>`
            }
        ];

        const distractors = ["foots", "toothes", "childs", "mans", "womans", "sheeps", "mouses", "gooses", "meese", "tooths"];

        let gameQuestions = [];
        let currentIndex = 0;
        let currentScore = 0;

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function initGame() {
            gameQuestions = shuffle([...dataset]);
            currentIndex = 0;
            currentScore = 0;
            document.getElementById('score').innerText = currentScore;
            document.getElementById('end-modal').style.display = 'none';
            loadQuestion();
        }

        function loadQuestion() {
            if (currentIndex >= gameQuestions.length) {
                showEndScreen();
                return;
            }

            document.getElementById('current-q').innerText = currentIndex + 1;
            const currentItem = gameQuestions[currentIndex];

            document.getElementById('singular-display').innerText = currentItem.singular;
            document.getElementById('graphic-area').innerHTML = currentItem.svg;

            let choices = [currentItem.plural];
            let filteredDistractors = shuffle(distractors.filter(d => d !== currentItem.plural));
            
            while (choices.length < 4) {
                let pick = filteredDistractors.pop();
                if (!choices.includes(pick)) {
                    choices.push(pick);
                }
            }
            choices = shuffle(choices);

            const optionsArea = document.getElementById('options-area');
            optionsArea.innerHTML = '';
            
            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.classList.add('option-btn');
                btn.innerText = choice;
                btn.onclick = () => checkAnswer(btn, choice, currentItem.plural);
                optionsArea.appendChild(btn);
            });
        }

        function checkAnswer(selectedButton, chosenValue, correctValue) {
            const allButtons = document.querySelectorAll('.option-btn');
            allButtons.forEach(btn => btn.disabled = true);

            if (chosenValue === correctValue) {
                selectedButton.classList.add('correct');
                currentScore += 10;
                document.getElementById('score').innerText = currentScore;
            } else {
                selectedButton.classList.add('wrong');
                allButtons.forEach(btn => {
                    if (btn.innerText === correctValue) btn.classList.add('correct');
                });
            }

            setTimeout(() => {
                currentIndex++;
                loadQuestion();
            }, 1200);
        }

        function showEndScreen() {
            document.getElementById('final-score').innerText = `${currentScore} / ${gameQuestions.length * 10} Points`;
            document.getElementById('end-modal').style.display = 'flex';
        }

        function restartGame() {
            initGame();
        }

        window.onload = initGame;
    </script>
</body>
</html>
