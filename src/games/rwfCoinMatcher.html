<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>RWF Coin Matcher | Guhura Amafaranga</title>
<style>
/* ============================================================
   RESET & BASE
============================================================ */
*, *::before, *::after {
  margin: 0; padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  width: 100%; min-height: 100%;
  background: #faf5e4;
  font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif;
  overflow-x: hidden;
}

/* ============================================================
   APP CONTAINER
============================================================ */
.app {
  max-width: 700px;
  margin: 0 auto;
  padding: 10px 10px 30px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 100vh;
}

/* ============================================================
   HEADER
============================================================ */
.header {
  background: linear-gradient(135deg, #1a5c22 0%, #2e7d32 55%, #388e3c 100%);
  border-radius: 22px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 5px 16px rgba(0,0,0,0.24);
  flex-shrink: 0;
}
.hdr-left { display: flex; flex-direction: column; gap: 1px; }
.hdr-en {
  font-size: clamp(1.05rem, 4.5vw, 1.55rem);
  font-weight: 900; color: #fff; line-height: 1.2;
}
.hdr-rw {
  font-size: clamp(0.66rem, 2.7vw, 0.90rem);
  font-weight: 700; font-style: italic;
  color: #c8e6c9; line-height: 1.2;
}
.score-box {
  display: flex; flex-direction: column; align-items: center;
  background: rgba(255,255,255,0.16);
  border: 2px solid rgba(255,255,255,0.30);
  border-radius: 15px;
  padding: 6px 14px;
  flex-shrink: 0;
}
.score-num {
  font-size: clamp(1.4rem, 5.5vw, 1.9rem);
  font-weight: 900; color: #fff176; line-height: 1.1;
}
.score-en {
  font-size: clamp(0.58rem, 2.2vw, 0.76rem);
  font-weight: 700; color: #c8e6c9; line-height: 1.2;
}
.score-rw {
  font-size: clamp(0.52rem, 2.0vw, 0.68rem);
  font-style: italic; color: #a5d6a7; line-height: 1.1;
}

/* ============================================================
   LEVEL + PROGRESS ROW
============================================================ */
.meta-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.level-pill {
  background: #fff;
  border-radius: 20px;
  padding: 5px 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.11);
  display: flex; flex-direction: column; align-items: center;
  flex-shrink: 0;
}
.lv-en {
  font-size: clamp(0.75rem, 3.0vw, 0.98rem);
  font-weight: 900; color: #1b5e20; line-height: 1.3;
}
.lv-rw {
  font-size: clamp(0.60rem, 2.3vw, 0.76rem);
  font-style: italic; font-weight: 700;
  color: #1565c0; line-height: 1.2;
}
.prog-track {
  flex: 1;
  background: #e8f5e9;
  border-radius: 10px;
  height: 16px;
  border: 2px solid #a5d6a7;
  overflow: hidden;
}
.prog-fill {
  background: linear-gradient(90deg, #66bb6a, #2e7d32);
  height: 100%;
  border-radius: 8px;
  transition: width 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  width: 0%;
}

/* ============================================================
   INSTRUCTION BAR
============================================================ */
.instr {
  background: #e8f5e9;
  border-radius: 14px;
  padding: 7px 14px;
  border-left: 5px solid #43a047;
  flex-shrink: 0;
}
.instr-en {
  font-size: clamp(0.78rem, 3.0vw, 0.96rem);
  font-weight: 700; color: #1b5e20; line-height: 1.45;
}
.instr-rw {
  font-size: clamp(0.65rem, 2.5vw, 0.82rem);
  font-style: italic; font-weight: 700;
  color: #1565c0; line-height: 1.3;
}

/* ============================================================
   COLUMN HEADERS
============================================================ */
.col-heads {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  flex-shrink: 0;
}
.col-head {
  background: #fff;
  border-radius: 12px;
  padding: 6px 8px;
  text-align: center;
  box-shadow: 0 2px 7px rgba(0,0,0,0.10);
}
.ch-en {
  font-size: clamp(0.75rem, 3.0vw, 1.0rem);
  font-weight: 900; color: #1b5e20; line-height: 1.3;
}
.ch-rw {
  font-size: clamp(0.60rem, 2.3vw, 0.76rem);
  font-style: italic; font-weight: 700;
  color: #1565c0; line-height: 1.2;
}

/* ============================================================
   GAME BOARD
============================================================ */
.board {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  flex-shrink: 0;
}
.col {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* ============================================================
   CARDS — BASE
============================================================ */
.card {
  background: #fff;
  border-radius: 18px;
  border: 3px solid #e0e0e0;
  box-shadow: 0 3px 11px rgba(0,0,0,0.11);
  cursor: pointer;
  touch-action: manipulation;
  user-select: none; -webkit-user-select: none;
  transition: transform 0.10s ease, border-color 0.16s ease,
              background 0.16s ease, box-shadow 0.16s ease;
  display: flex; align-items: center; justify-content: center;
  min-height: clamp(90px, 22vw, 128px);
  position: relative;
  overflow: hidden;
}
.card:active:not(.matched):not(.locked) {
  transform: scale(0.94);
}

/* Coin cards */
.coin-card { padding: 8px; }
.coin-card svg {
  display: block;
  width: clamp(68px, 18vw, 84px);
  height: clamp(68px, 18vw, 84px);
  pointer-events: none;
}

/* Word cards */
.word-card {
  flex-direction: column;
  gap: 4px;
  padding: 8px 7px;
}
.word-en {
  font-size: clamp(0.80rem, 3.1vw, 1.06rem);
  font-weight: 900; color: #212121;
  text-align: center; line-height: 1.35;
}
.word-rw {
  font-size: clamp(0.64rem, 2.4vw, 0.84rem);
  font-weight: 700; font-style: italic;
  color: #1565c0;
  text-align: center; line-height: 1.25;
}

/* ── SELECTED STATE ── */
.card-selected {
  border-color: #1565c0 !important;
  box-shadow: 0 0 0 4px rgba(21,101,192,0.22),
              0 3px 11px rgba(0,0,0,0.11) !important;
  animation: cardPulse 1.1s ease-in-out infinite;
}
@keyframes cardPulse {
  0%,100% { box-shadow: 0 0 0 3px rgba(21,101,192,0.22), 0 3px 11px rgba(0,0,0,0.11); }
  50%     { box-shadow: 0 0 0 8px rgba(21,101,192,0.10), 0 3px 11px rgba(0,0,0,0.11); }
}

/* ── WRONG STATE ── */
.card-wrong {
  border-color: #c62828 !important;
  background: #ffebee !important;
  animation: cardShake 0.50s ease forwards;
}
@keyframes cardShake {
  0%  { transform: translateX(0);   }
  13% { transform: translateX(-9px);}
  27% { transform: translateX(9px); }
  40% { transform: translateX(-7px);}
  54% { transform: translateX(7px); }
  68% { transform: translateX(-4px);}
  82% { transform: translateX(4px); }
  100%{ transform: translateX(0);   }
}

/* ── MATCHED STATE ── */
.card.matched {
  cursor: default;
  border-width: 3px;
  border-style: solid;
  animation: matchPop 0.30s cubic-bezier(0.34,1.56,0.64,1) forwards;
}
@keyframes matchPop {
  0%   { transform: scale(1.0); }
  55%  { transform: scale(1.08);}
  100% { transform: scale(1.0); }
}
.card.matched::after {
  content: '✅';
  position: absolute;
  top: 4px; right: 7px;
  font-size: 1.0rem;
  pointer-events: none;
  animation: badgePop 0.32s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes badgePop {
  from { transform: scale(0) rotate(-30deg); opacity: 0; }
  to   { transform: scale(1) rotate(0deg);  opacity: 1; }
}

/* ============================================================
   WIN OVERLAY
============================================================ */
.overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.64);
  align-items: center;
  justify-content: center;
  z-index: 9999;
  padding: 16px;
}
.overlay.active { display: flex; }

.win-card {
  background: linear-gradient(145deg, #fffde7, #fff9c4);
  border-radius: 28px;
  padding: 28px 22px 24px;
  text-align: center;
  max-width: 340px;
  width: 100%;
  box-shadow: 0 14px 48px rgba(0,0,0,0.34);
  animation: winPop 0.44s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes winPop {
  from { transform: scale(0.25) rotate(-10deg); opacity: 0; }
  to   { transform: scale(1.0)  rotate(0deg);   opacity: 1; }
}

.win-emoji {
  font-size: 5.2rem; display: block;
  line-height: 1.1; margin-bottom: 8px;
  animation: emojiSpin 0.55s ease 0.2s both;
}
@keyframes emojiSpin {
  from { transform: rotate(-22deg) scale(0.4); opacity: 0; }
  to   { transform: rotate(0deg)   scale(1.0); opacity: 1; }
}

.win-title { margin-bottom: 2px; }
.wt-en {
  display: block;
  font-size: clamp(1.8rem, 7vw, 2.4rem);
  font-weight: 900; color: #1b5e20; line-height: 1.2;
}
.wt-rw {
  display: block;
  font-size: clamp(0.90rem, 3.8vw, 1.15rem);
  font-weight: 700; font-style: italic;
  color: #1565c0; margin-top: 3px; line-height: 1.2;
}

.win-score { margin-top: 12px; }
.ws-en {
  font-size: clamp(0.90rem, 3.5vw, 1.1rem);
  color: #555; line-height: 1.5;
}
.ws-rw {
  font-size: clamp(0.76rem, 3.0vw, 0.94rem);
  color: #1565c0; font-style: italic;
  font-weight: 700; line-height: 1.4; margin-top: 2px;
}
.ws-val {
  font-size: clamp(1.3rem, 5vw, 1.7rem);
  font-weight: 900; color: #e65100;
}

.btn-next {
  margin-top: 20px;
  background: linear-gradient(145deg, #43a047, #1b5e20);
  color: #fff;
  border: none;
  border-radius: 18px;
  padding: 14px 22px;
  width: 100%;
  cursor: pointer;
  touch-action: manipulation;
  font-family: Arial, sans-serif;
  box-shadow: 0 5px 0 #1a5c22, 0 8px 20px rgba(27,94,32,0.30);
  display: flex; flex-direction: column;
  align-items: center; gap: 2px;
  transition: transform 0.08s, box-shadow 0.08s;
}
.btn-next:active {
  transform: translateY(4px);
  box-shadow: 0 1px 0 #1a5c22;
}
.btn-en {
  font-size: clamp(1.0rem, 4.0vw, 1.3rem);
  font-weight: 900; line-height: 1.2;
}
.btn-rw {
  font-size: clamp(0.70rem, 2.8vw, 0.88rem);
  font-weight: 700; font-style: italic;
  opacity: 0.90; line-height: 1.2;
}
</style>

<div class="app">

  <!-- ══ HEADER ═════════════════════════════════════════ -->
  <header class="header">

<script>
'use strict';

/* ============================================================
   COIN DEFINITIONS (English + Kinyarwanda)
============================================================ */
const ALL_COINS = [
  { v: 1,   type: 'copper', en: 'One Franc',          rw: 'Ifaranga Rimwe'            },
  { v: 5,   type: 'copper', en: 'Five Francs',        rw: 'Amafaranga Atanu'          },
  { v: 10,  type: 'silver', en: 'Ten Francs',         rw: 'Amafaranga Icumi'          },
  { v: 20,  type: 'silver', en: 'Twenty Francs',      rw: 'Amafaranga Makumyabiri'    },
  { v: 50,  type: 'bimetal',en: 'Fifty Francs',       rw: 'Amafaranga Mirongo Itanu'  },
  { v: 100, type: 'bimetal',en: 'One Hundred Francs', rw: "Ijana ry'Amafaranga"       },
];

/* Pair highlight palette (4 pairs max per round) */
const PAIR_BG  = ['#c8e6c9', '#bbdefb', '#fce4ec', '#fff9c4'];
const PAIR_BOR = ['#388e3c', '#1565c0', '#c2185b', '#f9a825'];

/* ============================================================
   METALLIC COIN SVG GENERATOR
============================================================ */
const METALS = {
  copper: {
    oH:'#f8c87a', oM:'#cd7f32', oS:'#8b4513',
    fL:'#e8a060', fD:'#9c3e10',
    rim:'#6b2e08', txt:'#2d0f00',
  },
  silver: {
    oH:'#ffffff',  oM:'#c0c0c0', oS:'#787878',
    fL:'#eaeaea',  fD:'#9e9e9e',
    rim:'#555555',  txt:'#1c1c1c',
  },
  bimetal: {           /* silver outer ring, gold inner face */
    oH:'#f4f4f4', oM:'#b8b8b8', oS:'#767676',
    fL:'#ffe566', fD:'#b88a00',
    rim:'#585858', txt:'#2a1800',
  },
};

function makeCoinSVG(coin) {
  const m   = METALS[coin.type];
  const uid = 'k' + coin.v;                     /* unique per coin value */
  const dl  = String(coin.v).length;
  const fs  = dl >= 3 ? 18 : dl === 2 ? 22 : 27;
  const isBi = coin.type === 'bimetal';

  /* For bimetallic: face uses gold gradient; outer ring stays silver */
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- Outer body gradient -->
  <radialGradient id="og_${uid}" cx="35%" cy="28%" r="72%">
    <stop offset="0%"   stop-color="${m.oH}"/>
    <stop offset="48%"  stop-color="${m.oM}"/>
    <stop offset="100%" stop-color="${m.oS}"/>
  </radialGradient>
  <!-- Inner face gradient -->
  <radialGradient id="fg_${uid}" cx="38%" cy="32%" r="66%">
    <stop offset="0%"   stop-color="${m.fL}"/>
    <stop offset="100%" stop-color="${m.fD}"/>
  </radialGradient>
  <!-- Gloss highlight -->
  <radialGradient id="gl_${uid}" cx="36%" cy="24%" r="52%">
    <stop offset="0%"   stop-color="rgba(255,255,255,0.65)"/>
    <stop offset="100%" stop-color="rgba(255,255,255,0.00)"/>
  </radialGradient>
</defs>

<!-- === OUTER COIN BODY === -->
<circle cx="50" cy="50" r="47" fill="url(#og_${uid})"/>

<!-- Milled / reeded edge -->
<circle cx="50" cy="50" r="45.5" fill="none"
        stroke="${m.rim}" stroke-width="3"
        stroke-dasharray="5.5,3" opacity="0.55"/>

<!-- Extra divider ring for bimetallic coins -->
${isBi ? `<circle cx="50" cy="50" r="33" fill="none" stroke="${m.rim}" stroke-width="2" opacity="0.38"/>` : ''}

<!-- === INNER MINTING FACE === -->
<circle cx="50" cy="50" r="${isBi ? 32 : 36}" fill="url(#fg_${uid})"/>
<circle cx="50" cy="50" r="${isBi ? 32 : 36}" fill="none"
        stroke="${m.rim}" stroke-width="1.2" opacity="0.40"/>

<!-- Decorative star at top -->
<text x="50" y="${isBi ? 18 : 20}" text-anchor="middle"
      dominant-baseline="middle"
      font-family="Arial, sans-serif" font-size="${isBi ? 6 : 7}"
      fill="${m.rim}" opacity="0.65">★</text>

<!-- === VALUE NUMBER === -->
<text x="50" y="${isBi ? 47 : 49}" text-anchor="middle"
      dominant-baseline="middle"
      font-family="Arial Black, Arial, sans-serif"
      font-weight="900" font-size="${fs}"
      fill="${m.txt}">${coin.v}</text>

<!-- "Frw" label -->
<text x="50" y="${isBi ? 63 : 66}" text-anchor="middle"
      dominant-baseline="middle"
      font-family="Arial, sans-serif"
      font-weight="700" font-size="10.5"
      fill="${m.txt}" opacity="0.78">Frw</text>

<!-- === GLOSS HIGHLIGHT === -->
<ellipse cx="40" cy="32" rx="21" ry="12"
         fill="url(#gl_${uid})" opacity="0.78"/>
</svg>`;
}

/* ============================================================
   WEB AUDIO API — SYNTHESIZED SOUND EFFECTS
============================================================ */
let _actx = null;

function getACtx() {
  if (!_actx) {
    _actx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (_actx.state === 'suspended') { _actx.resume(); }
  return _actx;
}

/**
 * playCling — metallic coin cling.
 * Three descending sine tones staggered to simulate
 * the natural ring of metal striking metal.
 */
function playCling() {
  try {
    const ctx = getACtx(), now = ctx.currentTime;
    const notes = [
      [2200, 0.00, 0.35, 0.80],   /* high strike */
      [1760, 0.06, 0.30, 0.65],   /* mid resonance */
      [1320, 0.14, 0.28, 0.55],   /* low decay */
    ];
    notes.forEach(function([freq, delay, amp, dur]) {
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now + delay);
      gain.gain.setValueAtTime(0, now + delay);
      gain.gain.linearRampToValueAtTime(amp, now + delay + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.001, now + delay + dur);
      osc.start(now + delay);
      osc.stop(now + delay + dur + 0.05);
    });
  } catch (e) {}
}

/**
 * playBuzz — short descending sawtooth error buzz.
 * Low-pitched and round — not scary for young children.
 */
function playBuzz() {
  try {
    const ctx = getACtx(), now = ctx.currentTime;
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(155, now);
    osc.frequency.linearRampToValueAtTime(80, now + 0.38);
    gain.gain.setValueAtTime(0.28, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.44);
    osc.start(now); osc.stop(now + 0.48);
  } catch (e) {}
}

/**
 * playFanfare — ascending C-major fanfare with bass chord resolution.
 * Eight-note melody: C5–E5–G5–C6–G5–C6–E6, ending on tonic chord.
 */
function playFanfare() {
  try {
    const ctx = getACtx(), now = ctx.currentTime;
    /* Melody (freq Hz, start delay s, note duration s) */
    const melody = [
      [523.25, 0.00, 0.40],  /* C5 */
      [659.25, 0.14, 0.40],  /* E5 */
      [783.99, 0.28, 0.40],  /* G5 */
      [1046.5, 0.44, 0.55],  /* C6 */
      [783.99, 0.62, 0.32],  /* G5 */
      [1046.5, 0.78, 0.32],  /* C6 */
      [1318.5, 0.96, 0.75],  /* E6 */
    ];
    melody.forEach(function([f, d, dur]) {
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(f, now + d);
      gain.gain.setValueAtTime(0, now + d);
      gain.gain.linearRampToValueAtTime(0.38, now + d + 0.018);
      gain.gain.exponentialRampToValueAtTime(0.001, now + d + dur);
      osc.start(now + d); osc.stop(now + d + dur + 0.06);
    });
    /* Bass C-major triad at climax */
    [130.81, 164.81, 196.00].forEach(function(f) {
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, now + 0.96);
      gain.gain.setValueAtTime(0, now + 0.96);
      gain.gain.linearRampToValueAtTime(0.16, now + 0.99);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 1.90);
      osc.start(now + 0.96); osc.stop(now + 1.98);
    });
  } catch (e) {}
}

/* ============================================================
   GAME STATE
============================================================ */
var level      = 1;
var score      = 0;
var roundCoins = [];    /* 4 selected coin objects */
var leftOrder  = [];    /* coin values in left column order */
var rightOrder = [];    /* coin values in right column order */
var selLeft    = null;  /* currently selected left coin value */
var selRight   = null;  /* currently selected right coin value */
var matched    = new Set();  /* coin values successfully matched */
var pairIdx    = 0;     /* index into PAIR colour arrays */
var locked     = false; /* block input during animations */

/* ============================================================
   UTILITIES
============================================================ */
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function $id(id) { return document.getElementById(id); }

function getCard(side, v) {
  var col = (side === 'L') ? 'leftCol' : 'rightCol';
  return document.querySelector('#' + col + ' [data-v="' + v + '"]');
}

function updateProgress() {
  var pct = (matched.size / roundCoins.length) * 100;
  $id('progFill').style.width = pct + '%';
}

/* ============================================================
   RENDER BOARD
============================================================ */
function renderBoard() {
  var lc = $id('leftCol');
  var rc = $id('rightCol');
  lc.innerHTML = '';
  rc.innerHTML = '';

  leftOrder.forEach(function(v) {
    var coin = roundCoins.find(function(c) { return c.v === v; });
    var card = document.createElement('div');
    card.className  = 'card coin-card';
    card.dataset.v  = v;
    card.innerHTML  = makeCoinSVG(coin);
    card.addEventListener('click', (function(val) {
      return function() { onLeftClick(val); };
    })(v));
    lc.appendChild(card);
  });

  rightOrder.forEach(function(v) {
    var coin = roundCoins.find(function(c) { return c.v === v; });
    var card = document.createElement('div');
    card.className  = 'card word-card';
    card.dataset.v  = v;
    card.innerHTML  = '<span class="word-en">' + coin.en + '</span>'
                    + '<span class="word-rw">'  + coin.rw + '</span>';
    card.addEventListener('click', (function(val) {
      return function() { onRightClick(val); };
    })(v));
    rc.appendChild(card);
  });

  updateProgress();
}

/* ============================================================
   CLICK HANDLERS
============================================================ */
function onLeftClick(v) {
  if (locked || matched.has(v)) return;

  /* Deselect if tapping same card again */
  if (selLeft === v) {
    getCard('L', v).classList.remove('card-selected');
    selLeft = null;
    return;
  }

  /* Deselect previous left selection */
  if (selLeft !== null) {
    getCard('L', selLeft).classList.remove('card-selected');
  }

  selLeft = v;
  getCard('L', v).classList.add('card-selected');

  if (selRight !== null) { evaluate(); }
}

function onRightClick(v) {
  if (locked || matched.has(v)) return;

  if (selRight === v) {
    getCard('R', v).classList.remove('card-selected');
    selRight = null;
    return;
  }

  if (selRight !== null) {
    getCard('R', selRight).classList.remove('card-selected');
  }

  selRight = v;
  getCard('R', v).classList.add('card-selected');

  if (selLeft !== null) { evaluate(); }
}

/* ============================================================
   MATCH EVALUATION
============================================================ */
function evaluate() {
  locked = true;

  var lCard = getCard('L', selLeft);
  var rCard = getCard('R', selRight);

  if (selLeft === selRight) {
    /* ✅ CORRECT MATCH */
    playCling();

    var bg  = PAIR_BG[pairIdx  % PAIR_BG.length];
    var bor = PAIR_BOR[pairIdx % PAIR_BOR.length];
    pairIdx++;

    [lCard, rCard].forEach(function(card) {
      card.classList.remove('card-selected');
      card.classList.add('matched');
      card.style.background  = bg;
      card.style.borderColor = bor;
    });

    matched.add(selLeft);
    score += 10;
    $id('scoreNum').textContent = score;
    updateProgress();

    selLeft = selRight = null;
    locked  = false;

    if (matched.size === roundCoins.length) {
      setTimeout(doWin, 700);
    }

  } else {
    /* ❌ WRONG MATCH */
    playBuzz();

    [lCard, rCard].forEach(function(card) {
      card.classList.remove('card-selected');
      card.classList.add('card-wrong');
    });

    setTimeout(function() {
      [lCard, rCard].forEach(function(card) {
        card.classList.remove('card-wrong');
      });
      selLeft = selRight = null;
      locked  = false;
    }, 580);
  }
}

/* ============================================================
   WIN CONDITION & LEVEL PROGRESSION
============================================================ */
function doWin() {
  playFanfare();

  $id('wsValEn').textContent = score;
  $id('wsValRw').textContent = score;

  /* Vary message every 5 levels */
  if (level % 5 === 0) {
    $id('winEmoji').textContent = '🏆';
    $id('wtEn').textContent     = 'Outstanding!';
    $id('wtRw').textContent     = 'Warasaze cyane!';
  } else {
    $id('winEmoji').textContent = '🎉';
    $id('wtEn').textContent     = 'Level Complete!';
    $id('wtRw').textContent     = 'Urwego rwarangiye!';
  }

  $id('winOverlay').classList.add('active');
}

function nextLevel() {
  $id('winOverlay').classList.remove('active');
  level++;
  $id('lvEn').textContent = level;
  $id('lvRw').textContent = level;
  startRound();
}

/* ============================================================
   START A NEW ROUND
============================================================ */
function startRound() {
  roundCoins  = shuffle(ALL_COINS).slice(0, 4);
  leftOrder   = shuffle(roundCoins.map(function(c) { return c.v; }));
  rightOrder  = shuffle(roundCoins.map(function(c) { return c.v; }));
  matched     = new Set();
  pairIdx     = 0;
  selLeft     = selRight = null;
  locked      = false;
  renderBoard();
}

/* ============================================================
   BOOT
============================================================ */
startRound();
</script>
