<!DOCTYPE html><html lang="rw"><head><meta name="x-poe-datastore-behavior" content="local_only"><meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://code.jquery.com https://unpkg.com https://d3js.org https://threejs.org https://cdn.plot.ly https://stackpath.bootstrapcdn.com https://maps.googleapis.com https://cdn.tailwindcss.com https://ajax.googleapis.com https://kit.fontawesome.com https://cdn.datatables.net https://maxcdn.bootstrapcdn.com https://code.highcharts.com https://tako-static-assets-production.s3.amazonaws.com https://www.youtube.com https://fonts.googleapis.com https://fonts.gstatic.com https://pfst.cf2.poecdn.net https://puc.poecdn.net https://i.imgur.com https://wikimedia.org https://*.icons8.com https://*.giphy.com https://picsum.photos https://images.unsplash.com; frame-src 'self' https://www.youtube.com https://trytako.com; child-src 'self'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests; block-all-mixed-content;">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clock Master 🕐 / Shyira Isaha</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(160deg, #0b1624 0%, #162032 55%, #0b1e35 100%);
      min-height: 100vh;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 12px 30px;
    }

    /* ── Header ── */
    .hd { text-align: center; margin-bottom: 14px; }
    .hd h1 {
      font-size: clamp(1.4rem, 6vw, 2.1rem);
      color: #ffd700;
      text-shadow: 0 2px 10px rgba(255,215,0,.4);
      letter-spacing: 1px;
    }
    .hd .sub { font-size: .82rem; color: #99aabb; margin-top: 4px; }

    .score-bar {
      font-size: 1.15rem;
      font-weight: bold;
      color: #ffd700;
      margin-bottom: 14px;
    }

    /* ── Difficulty ── */
    .diff-row {
      display: flex; gap: 10px; flex-wrap: wrap;
      justify-content: center; margin-bottom: 18px;
    }
    .diff-btn {
      padding: 8px 20px;
      border-radius: 22px;
      border: 2px solid #ffd700;
      background: transparent;
      color: #ffd700;
      cursor: pointer;
      font-size: .82rem;
      line-height: 1.45;
      transition: background .2s, color .2s;
    }
    .diff-btn.active { background: #ffd700; color: #1a1a2e; font-weight: bold; }
    .diff-btn:hover:not(.active) { background: rgba(255,215,0,.15); }

    /* ── Instruction ── */
    .instr {
      text-align: center;
      color: #aed6f1;
      font-size: .95rem;
      margin-bottom: 18px;
    }
    .instr .target-t {
      display: block;
      font-size: 2rem;
      font-weight: bold;
      color: #ffd700;
      letter-spacing: 4px;
      font-family: 'Courier New', monospace;
      margin-top: 4px;
    }

    /* ── Two-clock layout ── */
    .clocks-wrap {
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 18px;
      width: 100%;
      max-width: 520px;
    }

    .clock-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .ck-title {
      font-size: .9rem;
      color: #a8d0f0;
      font-weight: bold;
      text-align: center;
    }

    canvas {
      border-radius: 50%;
      filter: drop-shadow(0 0 14px rgba(255,215,0,.28));
      max-width: 100%;
      height: auto;
    }

    .dig {
      font-size: 1.55rem;
      font-weight: bold;
      color: #ffd700;
      letter-spacing: 4px;
      font-family: 'Courier New', monospace;
    }

    /* ── Controls ── */
    .ctrl-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      width: 210px;
      margin-top: 4px;
    }

    .ctrl {
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.22);
      color: #e8eaf0;
      border-radius: 10px;
      padding: 9px 4px;
      cursor: pointer;
      font-size: .75rem;
      text-align: center;
      line-height: 1.35;
      transition: background .15s, transform .1s;
    }
    .ctrl:hover  { background: rgba(255,255,255,.22); }
    .ctrl:active { transform: scale(.95); }

    /* ── Action buttons ── */
    .act-row {
      display: flex; gap: 12px; flex-wrap: wrap;
      justify-content: center; margin-bottom: 16px;
    }

    .btn-check, .btn-reset {
      border: none;
      color: #fff;
      padding: 12px 30px;
      border-radius: 26px;
      font-size: .98rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
    }

    .btn-check {
      background: linear-gradient(135deg, #1e8449, #27ae60);
      box-shadow: 0 4px 14px rgba(39,174,96,.4);
    }
    .btn-check:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(39,174,96,.6); }

    .btn-reset {
      background: linear-gradient(135deg, #c0392b, #e74c3c);
      box-shadow: 0 4px 14px rgba(231,76,60,.4);
    }
    .btn-reset:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(231,76,60,.6); }

    /* ── Feedback ── */
    .feedback {
      display: none;
      padding: 14px 28px;
      border-radius: 14px;
      font-size: 1.2rem;
      font-weight: bold;
      text-align: center;
      animation: pop .38s ease;
    }
    .feedback.ok   { background: rgba(39,174,96,.22); border: 2px solid #27ae60; color: #2ecc71; }
    .feedback.fail { background: rgba(231,76,60,.22); border: 2px solid #e74c3c; color: #e74c3c; }

    @keyframes pop {
      from { transform: scale(.72); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    /* ── Responsive ── */
    @media (max-width: 420px) {
      canvas { width: 155px !important; height: 155px !important; }
      .ctrl-grid { width: 178px; }
    }
    @media (max-width: 340px) {
      canvas { width: 130px !important; height: 130px !important; }
      .ctrl-grid { width: 154px; }
    }
  </style>
</head>
<body>

<div class="hd">
  <h1>🕐 Clock Master</h1>
  <div class="sub">Shyira Isaha · Set the Clock</div>
</div>

<div class="score-bar">⭐ Amanota / Score: <span id="scoreVal">0</span></div>

<div class="diff-row">
  <button class="diff-btn active" id="btnEasy" onclick="setDiff('easy')">
    P2 – Byoroshye / Easy<br><small>O'clock &amp; Half past</small>
  </button>
  <button class="diff-btn" id="btnHard" onclick="setDiff('hard')">
    P3 – Bikomeye / Hard<br><small>Buri iminota 5 / Every 5 min</small>
  </button>
</div>

<div class="instr">
  ⏰ Shyira isaha kuri · Set the clock to:
  <span class="target-t" id="instrTime">--:--</span>
</div>

<div class="clocks-wrap">

  <!-- Target clock -->
  <div class="clock-box">
    <div class="ck-title">🎯 Isaha y'intego · Target</div>
    <canvas id="cvTarget" width="200" height="200"></canvas>
    <div class="dig" id="dtTarget">--:--</div>
  </div>

  <!-- Player clock -->
  <div class="clock-box">
    <div class="ck-title">🖐️ Isaha yawe · Your Clock</div>
    <canvas id="cvPlayer" width="200" height="200"></canvas>
    <div class="dig" id="dtPlayer">12:00</div>

    <div class="ctrl-grid">
      <button class="ctrl" onclick="adj('h', 1)">+1 🕐<br>Isaha ▲ · Hour ▲</button>
      <button class="ctrl" onclick="adj('m', 5)">+5 ⏱<br>Iminota ▲ · Min ▲</button>
      <button class="ctrl" onclick="adj('h',-1)">−1 🕐<br>Isaha ▼ · Hour ▼</button>
      <button class="ctrl" onclick="adj('m',-5)">−5 ⏱<br>Iminota ▼ · Min ▼</button>
    </div>
  </div>

</div>

<div class="act-row">
  <button class="btn-check" onclick="checkAns()">✅ Genzura / Check</button>
  <button class="btn-reset" onclick="resetPlayer()">↩️ Subira / Reset</button>
</div>

<div class="feedback" id="fb"></div>

<script>
  /* =========================================================
     State
  ========================================================= */
  let score = 0;
  let diff  = 'easy';
  let tH = 3, tM = 0;   // target  hour / minute
  let pH = 12, pM = 0;  // player  hour / minute

  /* =========================================================
     Clock Drawing  (pure Canvas, no external libs)

     Angle convention (degrees from 12-o'clock, clockwise):
       Hour hand   : (h % 12) * 30  +  m * 0.5
       Minute hand : m * 6

     Convert to canvas radians (canvas 0 = 3-o'clock):
       rad = (deg − 90) * π / 180
  ========================================================= */
  function drawClock(id, h, m) {
    const canvas = document.getElementById(id);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const cx = W / 2, cy = H / 2;
    const R  = Math.min(W, H) / 2 - 4;

    ctx.clearRect(0, 0, W, H);

    /* ── Face ── */
    const grad = ctx.createRadialGradient(cx - R*.18, cy - R*.18, R*.05, cx, cy, R);
    grad.addColorStop(0, '#fffef8');
    grad.addColorStop(1, '#e4dabb');
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, 2*Math.PI);
    ctx.fillStyle = grad;
    ctx.fill();

    /* outer ring */
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, 2*Math.PI);
    ctx.lineWidth = 5;
    ctx.strokeStyle = '#1e2d3d';
    ctx.stroke();

    /* ── Hour tick marks + numbers ── */
    ctx.font = `bold ${Math.floor(R * .17)}px Arial`;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    for (let i = 1; i <= 12; i++) {
      const a = (i * 30 - 90) * Math.PI / 180;
      const cos = Math.cos(a), sin = Math.sin(a);
      /* tick */
      ctx.beginPath();
      ctx.moveTo(cx + (R - 14) * cos, cy + (R - 14) * sin);
      ctx.lineTo(cx + (R -  3) * cos, cy + (R -  3) * sin);
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = '#1e2d3d';
      ctx.stroke();
      /* number */
      ctx.fillStyle = '#1e2d3d';
      ctx.fillText(i, cx + (R - 27) * cos, cy + (R - 27) * sin);
    }

    /* ── Minute tick marks ── */
    for (let i = 0; i < 60; i++) {
      if (i % 5 === 0) continue;
      const a = (i * 6 - 90) * Math.PI / 180;
      ctx.beginPath();
      ctx.moveTo(cx + (R -  7) * Math.cos(a), cy + (R -  7) * Math.sin(a));
      ctx.lineTo(cx + (R -  2) * Math.cos(a), cy + (R -  2) * Math.sin(a));
      ctx.lineWidth = 1;
      ctx.strokeStyle = '#8a9aaa';
      ctx.stroke();
    }

    /* ── Hour hand ── */
    const hDeg = (h % 12) * 30 + m * 0.5;          // degrees from 12, clockwise
    const hRad = (hDeg - 90) * Math.PI / 180;       // canvas radians
    const hLen = R * 0.53;
    ctx.beginPath();
    ctx.moveTo(cx - Math.cos(hRad) * R * .13,
               cy - Math.sin(hRad) * R * .13);       // small back-spike
    ctx.lineTo(cx + Math.cos(hRad) * hLen,
               cy + Math.sin(hRad) * hLen);
    ctx.lineWidth   = Math.max(5, R * .065);
    ctx.strokeStyle = '#1e2d3d';
    ctx.lineCap     = 'round';
    ctx.stroke();

    /* ── Minute hand ── */
    const mDeg = m * 6;
    const mRad = (mDeg - 90) * Math.PI / 180;
    const mLen = R * 0.73;
    ctx.beginPath();
    ctx.moveTo(cx - Math.cos(mRad) * R * .13,
               cy - Math.sin(mRad) * R * .13);
    ctx.lineTo(cx + Math.cos(mRad) * mLen,
               cy + Math.sin(mRad) * mLen);
    ctx.lineWidth   = Math.max(3, R * .042);
    ctx.strokeStyle = '#2471a3';
    ctx.lineCap     = 'round';
    ctx.stroke();

    /* ── Centre cap ── */
    ctx.beginPath();
    ctx.arc(cx, cy, R * .058, 0, 2*Math.PI);
    ctx.fillStyle = '#1e2d3d';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx, cy, R * .029, 0, 2*Math.PI);
    ctx.fillStyle = '#e74c3c';
    ctx.fill();
  }

  /* =========================================================
     Helpers
  ========================================================= */
  function fmt(h, m) {
    return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
  }

  function refreshTarget() {
    const t = fmt(tH, tM);
    document.getElementById('instrTime').textContent = t;
    document.getElementById('dtTarget').textContent  = t;
    drawClock('cvTarget', tH, tM);  // ← clock image always matches the time
  }

  function refreshPlayer() {
    document.getElementById('dtPlayer').textContent = fmt(pH, pM);
    drawClock('cvPlayer', pH, pM);  // ← clock image always matches the time
  }

  function hideFb() {
    const fb = document.getElementById('fb');
    fb.style.display = 'none';
    fb.className = 'feedback';
  }

  /* =========================================================
     Game Logic
  ========================================================= */
  function newTarget() {
    if (diff === 'easy') {
      tH = Math.floor(Math.random() * 12) + 1;
      tM = Math.random() < .5 ? 0 : 30;
    } else {
      tH = Math.floor(Math.random() * 12) + 1;
      tM = Math.floor(Math.random() * 12) * 5;
    }
    refreshTarget();
  }

  function setDiff(d) {
    diff = d;
    document.getElementById('btnEasy').classList.toggle('active', d === 'easy');
    document.getElementById('btnHard').classList.toggle('active', d === 'hard');
    newTarget();
    resetPlayer();
  }

  function adj(type, delta) {
    if (type === 'h') {
      // wrap 1 – 12
      pH = ((pH - 1 + delta % 12 + 12) % 12) + 1;
    } else {
      pM = ((pM + delta) % 60 + 60) % 60;
    }
    refreshPlayer();
    hideFb();
  }

  function resetPlayer() {
    pH = 12; pM = 0;
    refreshPlayer();
    hideFb();
  }

  function checkAns() {
    // normalise both hours to 1-12 before comparing
    const tHn = tH % 12 || 12;
    const pHn = pH % 12 || 12;

    const ok = (pHn === tHn && pM === tM);
    const fb = document.getElementById('fb');
    fb.style.display = 'block';

    if (ok) {
      score++;
      document.getElementById('scoreVal').textContent = score;
      fb.className = 'feedback ok';
      fb.innerHTML = '⭐ 🎉 Byagenze neza! · GREAT JOB!';
      setTimeout(() => { newTarget(); hideFb(); }, 1700);
    } else {
      fb.className = 'feedback fail';
      fb.innerHTML = '❌ Komeza ugerageze! · Keep trying! 💪';
    }
  }

  /* =========================================================
     Init
  ========================================================= */
  newTarget();
  refreshPlayer();
</script>


</body></html>
