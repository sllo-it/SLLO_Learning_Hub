<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wordo – Offline English Learning Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  :root{
    --gray:#808080;--white:#fff;--green:#6aaa64;--yellow:#c9b458;
    --darkgray:#3a3a3c;--black:#000;
  }

  /* ---- Base font ---- */
  html{font-size:calc(10px + 1.8vw);}
  @media(min-width:480px){html{font-size:14px;}}
  @media(min-width:768px){html{font-size:16px;}}
  @media(min-width:1024px){html{font-size:18px;}}

  /* ---- Layout ---- */
  body{
    margin:0;padding:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#fafafa;
    display:flex;flex-direction:column;align-items:center;
    min-height:100vh;gap:0.6rem;padding:0.6rem;
    box-sizing:border-box;
  }
  h1{margin:0;font-size:2.2rem;color:#333;text-align:center;}
  #status{margin:0;font-size:1.1rem;min-height:1.4em;text-align:center;}
  #definition{margin:0;max-width:90%;font-size:0.85rem;line-height:1.4;text-align:center;}

  /* ---- Grid ---- */
  #grid{display:grid;gap:0.25rem;width:fit-content;}
  .tile{
    width:3.4rem;height:3.4rem;
    border:0.12rem solid var(--gray);
    display:flex;align-items:center;justify-content:center;
    font-weight:bold;font-size:1.9rem;text-transform:uppercase;
  }
  .empty{background:transparent;}
  .present{background:var(--yellow);color:var(--white);}
  .correct{background:var(--green);color:var(--white);}
  .absent{background:#787c7e;color:var(--white);}

  /* ---- Keyboard ---- */
  #keyboard{display:grid;gap:0.25rem;max-width:100%;}
  .row{display:flex;justify-content:center;gap:0.25rem;}
  .key{
    flex:1;min-width:2rem;height:2.8rem;
    background:var(--gray);color:var(--white);
    border:none;border-radius:0.25rem;
    font-size:0.95rem;text-transform:uppercase;cursor:pointer;
  }
  .key.wide{flex:1.5;}
  .key.correct{background:var(--green);}
  .key.present{background:var(--yellow);}
  .key.absent{background:var(--darkgray);}
  .key:active{transform:scale(0.94);}

  .ctrl-btn{
    margin:0.3rem;padding:0.35rem 0.9rem;
    background:var(--gray);color:var(--white);
    border:none;border-radius:0.25rem;cursor:pointer;
    font-size:0.9rem;
  }
</style>
</head>
<body>

<h1>Wordo</h1>
<div id="status"></div>

<div id="grid"></div>

<div id="definition"></div>
<div>
  <button class="ctrl-btn" id="newGame">New Game</button>
  <button class="ctrl-btn" id="hintBtn">Hint</button>
</div>

<div id="keyboard">
  <div class="row">
    <button class="key" data-key="Q">Q</button><button class="key" data-key="W">W</button>
    <button class="key" data-key="E">E</button><button class="key" data-key="R">R</button>
    <button class="key" data-key="T">T</button><button class="key" data-key="Y">Y</button>
    <button class="key" data-key="U">U</button><button class="key" data-key="I">I</button>
    <button class="key" data-key="O">O</button><button class="key" data-key="P">P</button>
  </div>
  <div class="row">
    <button class="key" data-key="A">A</button><button class="key" data-key="S">S</button>
    <button class="key" data-key="D">D</button><button class="key" data-key="F">F</button>
    <button class="key" data-key="G">G</button><button class="key" data-key="H">H</button>
    <button class="key" data-key="J">J</button><button class="key" data-key="K">K</button>
    <button class="key" data-key="L">L</button>
  </div>
  <div class="row">
    <button class="key wide" data-key="ENTER">Enter</button>
    <button class="key" data-key="Z">Z</button><button class="key" data-key="X">X</button>
    <button class="key" data-key="C">C</button><button class="key" data-key="V">V</button>
    <button class="key" data-key="B">B</button><button class="key" data-key="N">N</button>
    <button class="key" data-key="M">M</button>
    <button class="key wide" data-key="BACK">Back</button>
  </div>
</div>

<script>
/* ---------- Offline word bank & definitions ---------- */
const WORD_BANK = {
  3: ["AND","ARE","FOR","THE","YOU","CAT","DOG","MAN","RUN","SUN","HAT","PEN","RED"],
  4: ["ALSO","ABLE","ACID","AGED","AWAY","BABY","BACK","BANK","BEEN","BALL","COLD","FIRE","LOVE"],
  5: ["ABOUT","ALERT","ARGUE","BEACH","ABOVE","ALIKE","ARISE","BEGAN","BEGIN","BEGUN","HOUSE","LEARN","SMILE"],
  6: ["ABROAD","CASUAL","AROUND","COUPLE","ACCEPT","CAUGHT","ARRIVE","COURSE","CREATE","FRIEND","SCHOOL","TRAVEL"],
  7: ["ABILITY","BACKING","CABINET","ABSENCE","BALANCE","CALIBRE","ACADEMY","BANKING","CALLING","ACCOUNT","FRIENDS","LEARNED"]
};
const DEFINITIONS = {
  "AND":"Connects words or ideas. E.g., I have a cat AND a dog.",
  "ARE":"Form of 'to be' for you/we/they. E.g., They ARE happy.",
  "CAT":"A small furry animal. E.g., The CAT sleeps on the mat.",
  "DOG":"A loyal pet. E.g., The DOG barks at strangers.",
  "ABLE":"Having the skill to do something. E.g., She is ABLE to sing.",
  "BABY":"A young child. E.g., The BABY is crying.",
  "ABOUT":"Related to something. E.g., This book is ABOUT space.",
  "BEACH":"A sandy area by the sea. E.g., We walked on the BEACH.",
  "ABROAD":"In a foreign country. E.g., She studied ABROAD in France.",
  "FRIEND":"A person you like and trust. E.g., My FRIEND helped me.",
  "ABILITY":"The power to do something. E.g., His ABILITY to learn is strong.",
  "LEARNED":"Gained knowledge. E.g., She LEARNED to read quickly."
};

/* ---------- Game state ---------- */
let wordLength, target, guesses=[], current="", gameOver=false, won=false, hint="";
let keyStates={};

/* ---------- DOM ---------- */
const gridEl=document.getElementById('grid');
const statusEl=document.getElementById('status');
const defEl=document.getElementById('definition');
const newBtn=document.getElementById('newGame');
const hintBtn=document.getElementById('hintBtn');

/* ---------- Helpers ---------- */
function randomInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function randomChoice(arr){return arr[randomInt(0,arr.length-1)];}

/* ---------- Init ---------- */
function initGame(){
  wordLength=randomInt(3,7);
  target=randomChoice(WORD_BANK[wordLength]);
  guesses=[]; current=""; gameOver=false; won=false; hint="";
  keyStates={};
  statusEl.textContent=""; defEl.textContent="";
  hintBtn.disabled=false;
  buildGrid(); resetKeyboardColors();
}
function resetKeyboardColors(){
  document.querySelectorAll('.key[data-key]').forEach(k=>k.className='key');
}

/* ---------- Grid ---------- */
function buildGrid(){
  gridEl.style.gridTemplateColumns=`repeat(${wordLength},1fr)`;
  gridEl.innerHTML="";
  for(let r=0;r<5;r++)for(let c=0;c<wordLength;c++){
    const t=document.createElement('div');
    t.className='tile empty';
    t.dataset.row=r; t.dataset.col=c;
    gridEl.appendChild(t);
  }
  updateCurrentRow();
}
function updateCurrentRow(){
  const row=guesses.length;
  const tiles=gridEl.querySelectorAll(`.tile[data-row="${row}"]`);
  for(let i=0;i<wordLength;i++){
    tiles[i].textContent=current[i]||""; tiles[i].className='tile empty';
  }
}

/* ---------- Input ---------- */
document.querySelectorAll('.key').forEach(k=>k.addEventListener('click',()=>handleKey(k.dataset.key)));
document.addEventListener('keydown',e=>{
  if(gameOver) return;
  const k=e.key.toUpperCase();
  if(k>='A'&&k<='Z') handleKey(k);
  else if(e.key==='Enter') handleKey('ENTER');
  else if(e.key==='Backspace') handleKey('BACK');
});
function handleKey(k){
  if(gameOver) return;
  if(k==='ENTER') submitGuess();
  else if(k==='BACK') current=current.slice(0,-1);
  else if(current.length<wordLength) current+=k;
  updateCurrentRow();
}

/* ---------- Submit ---------- */
function submitGuess(){
  if(current.length!==wordLength) return;
  guesses.push(current);
  evaluateGuess(current);
  current="";
  if(current===target){               // <-- WIN CONDITION
    won=true; gameOver=true;
  }else if(guesses.length===5){       // <-- LOSE CONDITION
    gameOver=true;
  }
  updateCurrentRow();
  if(gameOver) showResult();
}

/* ---------- Evaluate + keyboard ---------- */
function evaluateGuess(guess){
  const row=guesses.length-1;
  const tiles=gridEl.querySelectorAll(`.tile[data-row="${row}"]`);
  const remaining=target.split('');
  const g=guess.split('');

  for(let i=0;i<wordLength;i++){
    if(g[i]===target[i]){
      tiles[i].classList.add('correct');
      remaining[i]=null;
      updateKeyState(g[i],'correct');
    }
  }
  for(let i=0;i<wordLength;i++){
    if(g[i]===target[i]) continue;
    if(remaining.includes(g[i])){
      tiles[i].classList.add('present');
      remaining[remaining.indexOf(g[i])]=null;
      updateKeyState(g[i],'present');
    }else{
      tiles[i].classList.add('absent');
      updateKeyState(g[i],'absent');
    }
    tiles[i].textContent=g[i];
  }
}
function updateKeyState(letter,state){
  const prio={correct:3,present:2,absent:1};
  if(!keyStates[letter]||prio[state]>prio[keyStates[letter]]){
    keyStates[letter]=state;
    const el=document.querySelector(`.key[data-key="${letter}"]`);
    if(el) el.className=`key ${state}`;
  }
}

/* ---------- End of game ---------- */
function showResult(){
  if(won){
    statusEl.textContent="Congratulations! You won!";
  }else{
    statusEl.textContent=`You lost! The word was ${target}`;
  }
  defEl.textContent=DEFINITIONS[target]||"No definition available.";
  hintBtn.disabled=true;
}

/* ---------- Hint ---------- */
hintBtn.addEventListener('click',()=>{
  if(gameOver) return;
  hint=`Starts with "${target[0]}" and has ${wordLength} letters.`;
  defEl.textContent=hint;
});

/* ---------- New Game ---------- */
newBtn.addEventListener('click',initGame);

/* ---------- Start ---------- */
initGame();
</script>
</body>
</html>
