<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Shape Detective 🔍</title>
<style>
/* ============================================================
   RESET & BASE
============================================================ */
*, *::before, *::after {
  margin: 0; padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  width: 100%; min-height: 100%;
  background: #eceff1;
  font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif;
  overflow-x: hidden;
}

/* ============================================================
   APP WRAPPER
============================================================ */
.app {
  max-width: 620px;
  margin: 0 auto;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 100vh;
}

/* ============================================================
   HEADER
============================================================ */
.header {
  background: linear-gradient(135deg, #263238 0%, #37474f 55%, #455a64 100%);
  border-radius: 22px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 5px 18px rgba(0,0,0,0.26);
  flex-shrink: 0;
}
.hdr-left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.hdr-icon {
  font-size: clamp(1.6rem, 6vw, 2.1rem);
  line-height: 1;
  flex-shrink: 0;
}
.hdr-title {
  font-size: clamp(1.05rem, 4.5vw, 1.5rem);
  font-weight: 900;
  color: #fff;
  line-height: 1.2;
}
.hdr-sub {
  font-size: clamp(0.58rem, 2.2vw, 0.76rem);
  font-weight: 700;
  color: #90a4ae;
  line-height: 1.3;
}
.hdr-right {
  display: flex;
  gap: 7px;
  flex-shrink: 0;
}
.stat-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  background: rgba(255,255,255,0.12);
  border: 2px solid rgba(255,255,255,0.18);
  border-radius: 14px;
  padding: 5px 12px;
}
.stat-num {
  font-size: clamp(1.25rem, 5vw, 1.7rem);
  font-weight: 900;
  color: #ffd54f;
  line-height: 1.1;
}
.stat-lbl {
  font-size: clamp(0.52rem, 1.9vw, 0.70rem);
  font-weight: 700;
  color: #90a4ae;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* ============================================================
   INSTRUCTION BANNER
============================================================ */
.instr-banner {
  display: flex;
  align-items: center;
  gap: 14px;
  background: #fff;
  border-radius: 20px;
  padding: 12px 16px;
  box-shadow: 0 3px 14px rgba(0,0,0,0.10);
  border: 4px solid #b0bec5;
  transition: border-color 0.38s ease;
  flex-shrink: 0;
}
.instr-preview {
  flex-shrink: 0;
  width: clamp(56px, 15vw, 80px);
  height: clamp(56px, 15vw, 80px);
}
.instr-preview svg {
  width: 100%;
  height: 100%;
  display: block;
}
.instr-text {
  flex: 1;
  min-width: 0;
}
.instr-line1 {
  font-size: clamp(0.86rem, 3.4vw, 1.06rem);
  font-weight: 700;
  color: #546e7a;
  line-height: 1.3;
}
.instr-name {
  display: block;
  font-size: clamp(1.4rem, 6.2vw, 1.9rem);
  font-weight: 900;
  line-height: 1.2;
  transition: color 0.32s ease;
}
.instr-line2 {
  font-size: clamp(0.68rem, 2.6vw, 0.86rem);
  font-weight: 700;
  color: #90a4ae;
  margin-top: 3px;
  line-height: 1.3;
}

/* ============================================================
   PROGRESS ROW
============================================================ */
.progress-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #fff;
  border-radius: 16px;
  padding: 10px 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  flex-shrink: 0;
  gap: 10px;
}
.prog-text {
  font-size: clamp(0.76rem, 2.9vw, 0.96rem);
  font-weight: 800;
  color: #455a64;
  white-space: nowrap;
}
.dots-wrap {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.dot {
  width: clamp(24px, 6.2vw, 34px);
  height: clamp(24px, 6.2vw, 34px);
  border-radius: 50%;
  background: #eceff1;
  border: 3px solid #b0bec5;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(0.80rem, 3.1vw, 1.08rem);
  line-height: 1;
  flex-shrink: 0;
  transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.dot.found {
  background: #fff9c4;
  border-color: #f9a825;
  transform: scale(1.20);
  animation: dotBounce 0.40s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}
@keyframes dotBounce {
  0%   { transform: scale(0.30) rotate(-20deg); }
  65%  { transform: scale(1.35) rotate(6deg);   }
  100% { transform: scale(1.20) rotate(0deg);   }
}

/* ============================================================
   SHAPE GRID
============================================================ */
.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: clamp(6px, 2.0vw, 10px);
  flex-shrink: 0;
}
/* Narrow phones: 3 columns so cells stay large enough */
@media (max-width: 345px) {
  .grid { grid-template-columns: repeat(3, 1fr); }
}

/* ============================================================
   GRID CELL — BASE
============================================================ */
.cell {
  aspect-ratio: 1 / 1;
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.12),
              inset 0 1px 0 rgba(255,255,255,0.80);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  position: relative;
  overflow: hidden;
  border: 3px solid rgba(0,0,0,0.06);
  transition: transform 0.12s ease, border-color 0.18s ease;
}
.cell:not(.found-cell):not(.wrong):active {
  transform: scale(0.89);
}
.cell svg {
  width: 68%;
  height: 68%;
  display: block;
  pointer-events: none;
}

/* ── WRONG STATE ── */
.cell.wrong {
  border-color: #ef5350 !important;
  background: #ffebee !important;
  animation: cellShake 0.52s cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards;
}
@keyframes cellShake {
  0%,100% { transform: translateX(0);    }
  11%     { transform: translateX(-12px);}
  22%     { transform: translateX(12px); }
  33%     { transform: translateX(-10px);}
  44%     { transform: translateX(10px); }
  55%     { transform: translateX(-7px); }
  66%     { transform: translateX(7px);  }
  77%     { transform: translateX(-4px); }
  88%     { transform: translateX(4px);  }
}

/* ── FOUND STATE ── */
.cell.found-cell {
  pointer-events: none;
  cursor: default;
  background: linear-gradient(135deg, #fff9c4, #fffde7) !important;
  border-color: #f9a825 !important;
  box-shadow: 0 3px 14px rgba(249,168,37,0.34),
              inset 0 1px 0 rgba(255,255,255,0.80) !important;
  animation: cellFound 0.38s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}
@keyframes cellFound {
  0%   { transform: scale(1.00); }
  50%  { transform: scale(1.13); }
  100% { transform: scale(1.00); }
}

/* ── STAR BADGE (hidden on normal cells, shown on found) ── */
.star-label {
  display: none;
  position: absolute;
  inset: 0;
  align-items: center;
  justify-content: center;
  font-size: clamp(1.9rem, 7.5vw, 2.6rem);
  line-height: 1;
  pointer-events: none;
}
.cell.found-cell .star-label {
  display: flex;
  animation: starReveal 0.36s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}
@keyframes starReveal {
  from { transform: scale(0.0) rotate(-45deg); opacity: 0; }
  to   { transform: scale(1.0) rotate(0deg);   opacity: 1; }
}

/* ============================================================
   WIN OVERLAY
============================================================ */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.62);
  align-items: center;
  justify-content: center;
  z-index: 9999;
  padding: 16px;
}
.overlay.active { display: flex; }

.win-card {
  background: linear-gradient(145deg, #f1f8e9, #e8f5e9);
  border-radius: 30px;
  padding: 28px 22px 24px;
  text-align: center;
  max-width: 330px;
  width: 100%;
  box-shadow: 0 16px 50px rgba(0,0,0,0.38);
  animation: winCardPop 0.46s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}
@keyframes winCardPop {
  from { transform: scale(0.12) rotate(-10deg); opacity: 0; }
  to   { transform: scale(1.00) rotate(0deg);   opacity: 1; }
}

.win-emoji {
  font-size: clamp(4.0rem, 15vw, 5.5rem);
  display: block;
  line-height: 1.1;
  animation: emojiDrop 0.46s ease 0.14s both;
}
@keyframes emojiDrop {
  from { transform: translateY(-30px) scale(0.50); opacity: 0; }
  to   { transform: translateY(0)     scale(1.00); opacity: 1; }
}

.win-title {
  font-size: clamp(1.8rem, 7.5vw, 2.4rem);
  font-weight: 900;
  color: #1b5e20;
  margin-top: 8px;
  line-height: 1.2;
}
.win-sub {
  font-size: clamp(0.86rem, 3.4vw, 1.08rem);
  font-weight: 700;
  color: #2e7d32;
  margin-top: 7px;
  line-height: 1.4;
}
.win-next {
  font-size: clamp(0.72rem, 2.8vw, 0.90rem);
  color: #78909c;
  font-weight: 700;
  margin-top: 10px;
}
</style>
</head>
<body>

<div class="app">

  <!-- ══ HEADER ══════════════════════════════════════════ -->
  <header class="header">
    <div class="hdr-left">
      <span class="hdr-icon">🔍</span>
      <div>
        <div class="hdr-title">Shape Detective</div>
        <div class="hdr-sub">Spot the right shapes!</div>
      </div>
    </div>
    <div class="hdr-right">
      <div class="stat-box">
        <span class="stat-num" id="scoreNum">0</span>
        <span class="stat-lbl">Score</span>
      </div>
      <div class="stat-box">
        <span class="stat-num" id="roundNum">1</span>
        <span class="stat-lbl">Round</span>
      </div>
    </div>
  </header>

  <!-- ══ INSTRUCTION BANNER ══════════════════════════════ -->
  <div class="instr-banner" id="instrBanner">
    <div class="instr-preview" id="instrPreview"></div>
    <div class="instr-text">
      <div class="instr-line1">🔎 Find all the</div>
      <span class="instr-name" id="instrName">Shapes</span>
      <div class="instr-line2" id="instrLine2">Tap each one you see!</div>
    </div>
  </div>

  <!-- ══ PROGRESS ROW ════════════════════════════════════ -->
  <div class="progress-row">
    <div class="prog-text" id="progText">🔍 0 left</div>
    <div class="dots-wrap" id="dotsWrap"></div>
  </div>

  <!-- ══ SHAPE GRID ══════════════════════════════════════ -->
  <div class="grid" id="grid"></div>

</div><!-- /.app -->

<!-- ══ WIN OVERLAY ═════════════════════════════════════════ -->
<div class="overlay" id="winOverlay">
  <div class="win-card">
    <span class="win-emoji">🕵️</span>
    <div class="win-title">Great Job! 🌟</div>
    <div class="win-sub" id="winSub">You found all the Shapes!</div>
    <div class="win-next">Next round loading…</div>
  </div>
</div>

<script>
'use strict';

/* ============================================================
   CONFIGURATION
============================================================ */

/* All four target shape types */
const SHAPES = ['square', 'rectangle', 'triangle', 'circle'];

/* Per-shape metadata used in the banner and colour scheme */
const SHAPE_META = {
  square:    { label: 'Squares',    colour: '#1565c0' },
  rectangle: { label: 'Rectangles', colour: '#e65100' },
  triangle:  { label: 'Triangles',  colour: '#2e7d32' },
  circle:    { label: 'Circles',    colour: '#c62828' },
};

/* Bright fill palette for randomised shape colours */
const FILLS = [
  '#e53935', '#d81b60', '#8e24aa',
  '#1e88e5', '#0097a7', '#00897b',
  '#43a047', '#fb8c00', '#f4511e',
];

const GRID_SIZE  = 12;   /* 4 columns × 3 rows */
const MIN_TARGET = 3;    /* min instances of target shape per round */
const MAX_TARGET = 5;    /* max instances of target shape per round */

/* ============================================================
   GAME STATE
============================================================ */
let targetShape = '';    /* currently searched shape type */
let targetCount = 0;     /* total correct shapes placed this round */
let foundCount  = 0;     /* how many the player has found */
let score       = 0;     /* cumulative total shapes found */
let round       = 0;     /* current round number (1-based) */
let busy        = false; /* true during win transition — blocks clicks */

/* ============================================================
   WEB AUDIO API — SYNTHESISED SOUND EFFECTS
   All sounds are procedurally built; no audio files are loaded.
============================================================ */
let _actx = null;

/* Lazily create and auto-resume the AudioContext */
function getACtx() {
  if (!_actx) {
    _actx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (_actx.state === 'suspended') { _actx.resume(); }
  return _actx;
}

/**
 * playDing — cheerful ascending three-note chime.
 * Triangle oscillators give a soft, bell-like timbre.
 * Notes: C6 → E6 → G6 staggered by ~70 ms.
 */
function playDing() {
  try {
    const ctx = getACtx(), now = ctx.currentTime;
    [[1047, 0.00, 0.42, 0.38],
     [1319, 0.07, 0.34, 0.36],
     [1568, 0.15, 0.32, 0.40]
    ].forEach(([freq, delay, amp, dur]) => {
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now + delay);
      gain.gain.setValueAtTime(0, now + delay);
      gain.gain.linearRampToValueAtTime(amp, now + delay + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.001, now + delay + dur);
      osc.start(now + delay);
      osc.stop(now + delay + dur + 0.04);
    });
  } catch (e) {}
}

/**
 * playBuzz — short descending sawtooth error sound.
 * Pitch swoops from 190 Hz → 75 Hz for a "boing" feel.
 * Kept rounded and child-friendly (not harsh).
 */
function playBuzz() {
  try {
    const ctx = getACtx(), now = ctx.currentTime;
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(190, now);
    osc.frequency.linearRampToValueAtTime(75, now + 0.38);
    gain.gain.setValueAtTime(0.28, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.42);
    osc.start(now); osc.stop(now + 0.46);
  } catch (e) {}
}

/**
 * playChime — pentatonic ascending level-clear fanfare.
 * Six-note C-major pentatonic ascent (C5→D5→E5→G5→A5→C6)
 * resolves to a warm bass C-major chord.
 */
function playChime() {
  try {
    const ctx = getACtx(), now = ctx.currentTime;
    /* Melody: [freq Hz, start delay s, amplitude, duration s] */
    [[523, 0.00, 0.36, 0.44],
     [587, 0.13, 0.34, 0.42],
     [659, 0.26, 0.34, 0.42],
     [784, 0.40, 0.40, 0.52],
     [880, 0.55, 0.40, 0.52],
     [1047,0.72, 0.46, 0.72]
    ].forEach(([freq, delay, amp, dur]) => {
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now + delay);
      gain.gain.setValueAtTime(0, now + delay);
      gain.gain.linearRampToValueAtTime(amp, now + delay + 0.016);
      gain.gain.exponentialRampToValueAtTime(0.001, now + delay + dur);
      osc.start(now + delay); osc.stop(now + delay + dur + 0.05);
    });
    /* Bass C–E–G triad at the climax note */
    [262, 330, 392].forEach((freq) => {
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now + 0.72);
      gain.gain.setValueAtTime(0, now + 0.72);
      gain.gain.linearRampToValueAtTime(0.14, now + 0.74);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 1.72);
      osc.start(now + 0.72); osc.stop(now + 1.78);
    });
  } catch (e) {}
}

/* ============================================================
   SVG SHAPE FACTORY
   All shapes rendered in a 100×100 viewBox with:
   — solid vibrant fill, darkened stroke, and a gloss highlight.
============================================================ */

/* Darken a 6-digit #rrggbb hex colour by pct (0.0 – 1.0) */
function darken(hex, pct) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  const f = 1 - pct;
  return '#' + [r, g, b]
    .map(n => Math.max(0, Math.round(n * f)).toString(16).padStart(2, '0'))
    .join('');
}

function makeSVG(shape, fill) {
  const dk = darken(fill, 0.28);          /* border / shadow tone  */
  const hl = 'rgba(255,255,255,0.30)';    /* specular highlight    */

  switch (shape) {
    /* Square — equal sides, rounded corners */
    case 'square':
      return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <rect x="10" y="10" width="80" height="80" rx="9"
              fill="${fill}" stroke="${dk}" stroke-width="3.5"/>
        <rect x="18" y="18" width="30" height="12" rx="5" fill="${hl}"/>
      </svg>`;

    /* Rectangle — clearly wider than tall */
    case 'rectangle':
      return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <rect x="5" y="21" width="90" height="58" rx="9"
              fill="${fill}" stroke="${dk}" stroke-width="3.5"/>
        <rect x="13" y="29" width="32" height="12" rx="5" fill="${hl}"/>
      </svg>`;

    /* Triangle — equilateral-ish upward-pointing polygon */
    case 'triangle':
      return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <polygon points="50,6 96,92 4,92"
                 fill="${fill}" stroke="${dk}" stroke-width="3.5"
                 stroke-linejoin="round"/>
        <polygon points="50,16 65,42 35,42" fill="${hl}"/>
      </svg>`;

    /* Circle — perfect disc with glossy ellipse */
    case 'circle':
      return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="44"
                fill="${fill}" stroke="${dk}" stroke-width="3.5"/>
        <ellipse cx="37" cy="33" rx="15" ry="10" fill="${hl}"/>
      </svg>`;

    default:
      return '';
  }
}

/* ============================================================
   UTILITY HELPERS
============================================================ */

/* Fisher-Yates in-place shuffle — returns a new shuffled array */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* Pick one random element from an array */
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

/* Inclusive random integer between lo and hi */
function randInt(lo, hi) { return lo + Math.floor(Math.random() * (hi - lo + 1)); }

/* ============================================================
   ROUND DATA BUILDER
   Returns an array of GRID_SIZE cell descriptors ensuring
   between MIN_TARGET and MAX_TARGET instances of targetShape.
============================================================ */
function buildCells() {
  const n       = randInt(MIN_TARGET, MAX_TARGET);
  const others  = SHAPES.filter(s => s !== targetShape);
  const cells   = [];

  /* Inject the guaranteed target-shape cells */
  for (let i = 0; i < n; i++) {
    cells.push({ shape: targetShape, fill: pick(FILLS), isTarget: true });
  }
  /* Fill remaining slots with non-target shapes */
  while (cells.length < GRID_SIZE) {
    cells.push({ shape: pick(others), fill: pick(FILLS), isTarget: false });
  }
  return { cells: shuffle(cells), n };
}

/* ============================================================
   DOM HELPERS
============================================================ */

/* Update the "N left to find" progress label */
function refreshProgLabel() {
  const left = targetCount - foundCount;
  document.getElementById('progText').textContent =
    left === 0 ? '✅ All found!' : '🔍 ' + left + ' left to find';
}

/* ============================================================
   ROUND RENDERER
   Updates the banner, progress dots, and full grid DOM.
============================================================ */
function renderRound(cells, n) {
  targetCount = n;
  foundCount  = 0;

  const meta = SHAPE_META[targetShape];

  /* — Instruction banner — */
  document.getElementById('instrBanner').style.borderColor = meta.colour;
  document.getElementById('instrPreview').innerHTML        = makeSVG(targetShape, meta.colour);

  const nameEl       = document.getElementById('instrName');
  nameEl.textContent = meta.label;
  nameEl.style.color = meta.colour;

  document.getElementById('instrLine2').textContent =
    'There are ' + n + ' hidden on the board!';
  document.getElementById('winSub').textContent =
    'You found all the ' + meta.label + '!';

  /* — Progress dots — */
  const dotsWrap = document.getElementById('dotsWrap');
  dotsWrap.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.id        = 'dot-' + i;
    dotsWrap.appendChild(dot);
  }
  refreshProgLabel();

  /* — Grid cells — */
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  cells.forEach((cd) => {
    const cell = document.createElement('div');
    cell.className           = 'cell';
    cell.dataset.isTarget    = cd.isTarget ? '1' : '0';
    cell.innerHTML           = makeSVG(cd.shape, cd.fill);

    /* Hidden star badge — revealed on correct tap */
    const star       = document.createElement('div');
    star.className   = 'star-label';
    star.textContent = '⭐';
    cell.appendChild(star);

    cell.addEventListener('click', onCellClick);
    grid.appendChild(cell);
  });
}

/* ============================================================
   INTERACTION HANDLER
============================================================ */
function onCellClick(e) {
  if (busy) return;
  const cell = e.currentTarget;

  /* Ignore cells that are already resolved or mid-shake */
  if (cell.classList.contains('found-cell') ||
      cell.classList.contains('wrong')) { return; }

  if (cell.dataset.isTarget === '1') {
    /* ✅ CORRECT tap */
    playDing();
    cell.classList.add('found-cell');
    cell.removeEventListener('click', onCellClick);

    foundCount++;
    score++;
    document.getElementById('scoreNum').textContent = score;

    /* Light up the next progress dot */
    const dot = document.getElementById('dot-' + (foundCount - 1));
    if (dot) { dot.classList.add('found'); dot.textContent = '⭐'; }

    refreshProgLabel();

    /* All targets found → trigger win sequence */
    if (foundCount >= targetCount) {
      busy = true;
      setTimeout(doWin, 660);
    }

  } else {
    /* ❌ WRONG tap */
    playBuzz();
    cell.classList.add('wrong');
    /* Remove the shake class after the animation ends */
    setTimeout(() => cell.classList.remove('wrong'), 560);
  }
}

/* ============================================================
   WIN SEQUENCE
============================================================ */
function doWin() {
  playChime();
  document.getElementById('winOverlay').classList.add('active');
  setTimeout(() => {
    document.getElementById('winOverlay').classList.remove('active');
    startRound();
  }, 1800);
}

/* ============================================================
   ROUND INITIALISATION
============================================================ */
function startRound() {
  /* Always pick a shape different from the last round */
  const pool  = SHAPES.filter(s => s !== targetShape);
  targetShape = pick(pool.length ? pool : SHAPES);

  round++;
  document.getElementById('roundNum').textContent = round;

  const { cells, n } = buildCells();
  busy = false;
  renderRound(cells, n);
}

/* ============================================================
   BOOT — kick off the very first round
============================================================ */
startRound();
</script>
