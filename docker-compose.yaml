version: '3.8'

services:
  gamehub:
    build: .
    container_name: learning-hub
    restart: unless-stopped
    # Environmental variable configuration
    environment:
      - NODE_ENV=production
      - PORT=3003
      - ADMIN_PASSWORD=polyusllo
    # Map port 8028 on your Synology NAS to port 8028 inside the Docker container
    ports:
      - "3003:3003"
    # Mount your files so your upload/delete scripts permanently write to the NAS hard drive
    volumes:
      - .:/usr/src/app/learning-hub
      # Prevents the local machine's node_modules from conflicting with the container's environment
      - /usr/src/app/learning-hub/node_modules
    networks:
      - nginx_network

networks:
    nginx_network:
        external: true